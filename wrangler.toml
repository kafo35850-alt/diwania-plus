name = "diwaniya-plus"
main = "worker.js"
compatibility_date = "2025-09-01"

workers_dev = true
keep_vars = true

[ai]
binding = "AI"

# The site's own domain (the zone lives in the same Cloudflare account). workers.dev keeps working too.
routes = [
  { pattern = "diwaniyaplus.com", custom_domain = true },
  { pattern = "www.diwaniyaplus.com", custom_domain = true }
]

# Keep large game images in Workers Static Assets so they do not count toward the script bundle size.
[assets]
directory = "./assets"
html_handling = "none"

# The public interface and the private game files are bundled into the Worker.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png", "**/ctx/*.bin"]

[[rules]]
type = "Text"
globs = ["**/ctx/*.txt"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "diwaniya-plus"
database_id = "9310fd6c-c762-4c06-9570-efc59885429e"
migrations_dir = "migrations"

# Real-time rooms (WebSocket). SQLite-backed Durable Objects also work on the Workers Free plan.
[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHubDO"

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoomDO"

[[durable_objects.bindings]]
name = "BUZZER_ROOM"
class_name = "BuzzerRoomDO"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["GameHubDO", "RelayRoomDO", "BuzzerRoomDO"]

[vars]
# Main address of the site; other hosts (www, workers.dev) redirect here.
CANONICAL_HOST = "diwaniyaplus.com"
# Sender for login emails (diwaniyaplus.com is verified in Resend).
MAIL_FROM = "ديوانية بلس <login@diwaniyaplus.com>"
# Never "true" in production: with it and no RESEND_API_KEY, login codes are printed to the server log.
DEV_MODE = "false"

# Secrets (set with: npx wrangler secret put NAME)
#   OWNER_EMAILS            comma-separated owner emails (kept secret so it is not in the repository)
#   AUTH_SECRET             long random string used to hash login codes
#   RESEND_API_KEY          API key from resend.com
#   MOYASAR_SECRET_KEY      secret API key from the Moyasar dashboard (sk_test_… or sk_live_…)
#   MOYASAR_WEBHOOK_SECRET  the "secret token" you type when adding the webhook in the Moyasar dashboard

[build]
command = "npm run build"
