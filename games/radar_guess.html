<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ديوانية بلس — رادار الديوانية</title>
<style>
:root {
  --bg-deep: #070B1A;
  --bg-panel: #101733;
  --bg-card: rgba(22, 32, 68, 0.86);
  --gold: #F5B942;
  --gold-light: #FFE08A;
  --teal: #2DD4BF;
  --coral: #F97316;
  --rose: #F43F5E;
  --emerald: #10B981;
  --accent: #38BDF8;
  --text: #F8FAFC;
  --muted: #94A3B8;
  --border: rgba(245, 185, 66, 0.24);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  background:
    radial-gradient(900px 450px at 85% 0%, rgba(245, 185, 66, 0.14), transparent 65%),
    radial-gradient(800px 450px at 10% 100%, rgba(45, 212, 191, 0.12), transparent 65%),
    linear-gradient(180deg, #0E1530 0%, #070B1A 100%);
  color: var(--text);
  font-family: -apple-system, "SF Arabic", "Tajawal", "Cairo", system-ui, sans-serif;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; touch-action: manipulation; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

.top-bar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(7, 11, 26, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand-Side { display: flex; align-items: center; gap: 10px; }
.room-pill {
  background: rgba(245, 185, 66, 0.16);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  padding: 5px 12px; border-radius: 999px; font-weight: 900; font-size: 13.5px;
}
.ctrl-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px;
  transition: transform 0.12s, filter 0.12s;
}
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn-gold { background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: #1B1100; box-shadow: 0 5px 16px rgba(245,185,66,0.3); }
.btn-teal { background: linear-gradient(180deg, #5EEAD4, #0D9488); color: #042F2E; box-shadow: 0 5px 16px rgba(45,212,191,0.25); }
.btn-rose { background: linear-gradient(180deg, #FB7185, #E11D48); color: #fff; box-shadow: 0 5px 16px rgba(225,29,72,0.35); }
.btn-sec { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }

.layout-wrap {
  max-width: 1320px; margin: 0 auto; padding: 18px 16px 90px;
  display: grid; gap: 18px;
}
.layout-wrap.mode-both {
  grid-template-columns: 1.35fr 0.95fr;
  align-items: start;
}
@media (max-width: 920px) {
  .layout-wrap.mode-both { grid-template-columns: 1fr; }
}
.panel-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 18px 45px rgba(0,0,0,0.45);
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-bottom: 12px; margin-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.09);
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;
  background: rgba(45,212,191,0.15); border: 1px solid rgba(45,212,191,0.4); color: #99F6E4;
}
.badge-gold {
  background: rgba(245,185,66,0.18); border-color: rgba(245,185,66,0.5); color: var(--gold-light);
}
.badge-rose {
  background: rgba(244,63,94,0.2); border-color: rgba(244,63,94,0.5); color: #FECDD3;
}

/* Grids & Cards inside games */
.grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

.word-tile {
  padding: 14px 6px; border-radius: 14px; font-weight: 900; font-size: clamp(12px, 1.8vw, 16px);
  text-align: center; background: rgba(255,255,255,0.07);
  border: 2px solid rgba(255,255,255,0.14);
  color: var(--text); transition: all 0.16s; position: relative; min-height: 58px;
  display: grid; place-items: center;
}
.word-tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--gold); }
.word-tile.rev-gold { background: linear-gradient(145deg, #F5B942, #B45309); color: #1A1000; border-color: #FFE08A; }
.word-tile.rev-teal { background: linear-gradient(145deg, #2DD4BF, #0F766E); color: #042F2E; border-color: #99F6E4; }
.word-tile.rev-neutral { background: rgba(148, 163, 184, 0.28); color: #CBD5E1; border-color: #64748B; }
.word-tile.rev-bomb { background: linear-gradient(145deg, #991B1B, #090D16); color: #FECDD3; border-color: #F43F5E; box-shadow: 0 0 24px rgba(244,63,94,0.65); }
.word-tile.spy-hint-gold { box-shadow: inset 0 0 0 2px #F5B942; }
.word-tile.spy-hint-teal { box-shadow: inset 0 0 0 2px #2DD4BF; }
.word-tile.spy-hint-bomb { box-shadow: inset 0 0 0 3px #F43F5E; background: rgba(244,63,94,0.18); }

.vault-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px;
}
.vault-btn {
  height: 56px; border-radius: 13px; font-weight: 900; font-size: 16px;
  background: linear-gradient(160deg, #1E293B, #0F172A);
  border: 1.5px solid rgba(245,185,66,0.35); color: var(--gold-light);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform 0.14s, border-color 0.14s;
}
.vault-btn:hover:not(:disabled) { transform: scale(1.05); border-color: var(--gold); }
.vault-btn.opened-gold { background: linear-gradient(145deg, #F5B942, #B45309); color: #1A1000; }
.vault-btn.opened-teal { background: linear-gradient(145deg, #2DD4BF, #0F766E); color: #042F2E; }
.vault-btn.opened-bomb { background: linear-gradient(145deg, #E11D48, #881337); color: #fff; }

.score-strip {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.score-box {
  flex: 1; min-width: 135px; background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.score-box.active-turn { border-color: var(--gold); box-shadow: 0 0 18px rgba(245,185,66,0.25); }

.timer-ring {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 68px; height: 42px; padding: 0 14px; border-radius: 999px;
  background: rgba(244,63,94,0.18); border: 2px solid var(--rose);
  color: #FECDD3; font-weight: 900; font-size: 20px;
}

.inp {
  width: 100%; padding: 10px 13px; border-radius: 11px;
  background: rgba(5,9,22,0.75); border: 1px solid rgba(255,255,255,0.16);
  color: var(--text); outline: none;
}
.inp:focus { border-color: var(--gold); }

.view-tabs {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 60; background: rgba(8, 12, 28, 0.94);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px; display: flex; gap: 6px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.65);
}
.view-tabs button {
  padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 13px;
  color: var(--muted);
}
.view-tabs button.active {
  background: linear-gradient(135deg, var(--gold), #D97706);
  color: #1A1000;
}

.modal-bg {
  position: fixed; inset: 0; z-index: 80; background: rgba(4, 7, 18, 0.84);
  backdrop-filter: blur(8px); display: none; place-items: center; padding: 16px;
}
.modal-bg.open { display: grid; }
.modal-card {
  width: 100%; max-width: 480px; background: #101733;
  border: 1px solid var(--border); border-radius: 22px; padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
canvas.draw-pad {
  width: 100%; max-width: 520px; height: 320px; background: #0B1024;
  border: 2px solid var(--gold); border-radius: 16px; touch-action: none;
  cursor: crosshair; display: block; margin: 0 auto;
}
</style>
<style>/*dw-tv-scale*/
@media (min-width: 1280px) { .top-bar, .layout-wrap, .view-tabs { zoom: 1.18; } }
@media (min-width: 1700px) { .top-bar, .layout-wrap, .view-tabs { zoom: 1.4; } }
@media (min-width: 2400px) { .top-bar, .layout-wrap, .view-tabs { zoom: 1.8; } }
/*dw-landscape*/
@media (orientation: landscape) and (max-height: 540px) {
  .top-bar { position: static; padding: 4px 10px; }
  .top-bar .brand-Side div > div { display: none; }
  .top-bar .brand-Side b { font-size: 14px !important; }
  .layout-wrap { padding: 8px 8px 56px; gap: 8px; }
  .layout-wrap.mode-both { grid-template-columns: 1.35fr 1fr; }
  .panel-box { padding: 10px 12px; border-radius: 14px; }
  .panel-head { padding-bottom: 4px; margin-bottom: 8px; }
  .panel-head h2 { font-size: 15px !important; margin-top: 4px !important; }
  .panel-head h3 { font-size: 14px !important; margin-top: 4px !important; }
  .view-tabs { bottom: 6px; padding: 3px; }
  .view-tabs button { padding: 5px 11px; font-size: 12px; }
  .layout-wrap { zoom: 0.9; }
}
</style>
</head>

        qIdx: 0,
        questions: shuffle(CFG.questions),

        roundPoints: 0,
        violations: 0,
        running: false,
        finished: false

    renderAll();

      '</div>' +
      (gd.clueWord ? '<div style="background:rgba(245,185,66,0.14);border:1px solid var(--gold);padding:10px 14px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
        '<span>📢 الشفرة الحالية: <b style="color:var(--gold);font-size:18px">' + esc(gd.clueWord) + ' (' + arNum(gd.clueCount) + ')</b></span>' +

      '</div>' +
      '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">' +
        '<button class="btn btn-gold" data-act="v50-bank" ' + (gd.unbankedPot <= 0 ? 'disabled' : '') + '>🏦 تأمين الرصيد في البنك (' + arNum(gd.unbankedPot) + ' نقطة) وتمرير الدور</button>' +

          return '<button class="' + cls + '" data-act="v50-open" data-num="' + v.num + '" ' + (v.opened ? 'disabled' : '') + '>' +
            (v.opened ? '<span style="font-size:11px;line-height:1.2">' + esc(v.info.label) + '</span>' : arNum(v.num)) +
          '</button>';
        }).join('') +
      '</div>';
    }

    if (slug === 'radar_guess') {
      var curPts = gd.ptsSchedule[gd.clueIdx] || 150;
      return '<div class="score-strip">' +
        '<div class="score-box"><span>🟡 الفريق الأول</span><b style="font-size:22px;color:var(--gold)">' + arNum(ST.teamScores[0]) + '</b></div>' +

          '<button class="btn btn-gold" data-act="next-round">اللغز التالي ⬅</button>' +
        '</div>'
      ) : (
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          (gd.clueIdx < gd.mystery.clues.length - 1 ? '<button class="btn btn-sec" data-act="rg-next-clue">🔍 كشف التلميح التالي (تقل النقاط)</button>' : '') +
        '</div>'
      ));

      ) : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-teal btn-sm" data-act="ac-next-q">سؤال استجواب تالٍ ⏭️</button>' +

      '<div style="background:rgba(244,63,94,0.12);border:1.5px solid var(--rose);padding:12px;border-radius:14px;margin-bottom:14px;text-align:center;font-size:13.5px">' +
        '🚫 <b>الكلمات المحظورة على الضحية:</b> (نعم / أيوه / إيه) · (لا / أبداً) · (أبيض / أسود) · (تكرار نفس الكلمة أو التردد لأكثر من ٣ ثوانٍ)' +

  function bindCanvasDrawing() {
    var pad = document.getElementById('sharedDrawPad');
    if (!pad) return;
    var ctx = pad.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;

    // Redraw existing strokes
    ctx.clearRect(0, 0, pad.width, pad.height);
    var strokes = ST.gameData.strokes || [];
    strokes.forEach(function(st) {
      ctx.strokeStyle = st.color;
      ctx.beginPath();
      st.pts.forEach(function(pt, i) {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();
    });

    var drawing = false;
    var curPts = [];
    var colors = ['#F5B942', '#2DD4BF', '#F43F5E', '#A855F7'];

    function getPos(ev) {
      var rect = pad.getBoundingClientRect();
      var clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      var clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      return {
        x: (clientX - rect.left) * (pad.width / rect.width),
        y: (clientY - rect.top) * (pad.height / rect.height)
      };
    }

    pad.onpointerdown = function(ev) {
      drawing = true;
      curPts = [getPos(ev)];
    };
    pad.onpointermove = function(ev) {
      if (!drawing) return;
      var pt = getPos(ev);
      curPts.push(pt);
      ctx.strokeStyle = colors[ST.gameData.strokeTurn % colors.length];
      ctx.beginPath();
      var prev = curPts[curPts.length - 2];
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    };
    window.onpointerup = function() {
      if (!drawing) return;
      drawing = false;
      if (curPts.length > 1) {
        ST.gameData.strokes.push({
          color: colors[ST.gameData.strokeTurn % colors.length],
          pts: curPts
        });
        ST.gameData.strokeTurn++;
        SFX.play('click');
        renderAll();
      }
    };
  }

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var gd = ST.gameData;

    if (act === 'set-view') {
      ST.viewMode = btn.getAttribute('data-v');
      renderAll();
    } else if (act === 'toggle-sfx') {
      SFX.enabled = !SFX.enabled;
      renderAll();
    } else if (act === 'open-qr') {
      var modal = document.getElementById('qrModal');
      var box = document.getElementById('qrBox');
      var txt = document.getElementById('qrRoomCodeText');
      if (modal && box) {
        var joinUrl = window.location.href.split('#')[0] + '?room=' + ST.roomCode + '&game=' + CFG.slug;
        if (window.M8QR && window.M8QR.svg) {
          box.innerHTML = window.M8QR.svg(joinUrl, { ecc: 'M', pad: 2 });
        }
        if (txt) txt.textContent = 'كود الغرفة المباشر: ' + ST.roomCode;
        modal.classList.add('open');
      }
    } else if (act === 'next-round') {
      ST.round++;
      SFX.play('click');
      initGameEngine();
    } else if (act === 'cn-toggle-spy') {
      gd.spymasterView = !gd.spymasterView;
      SFX.play('click');
      renderAll();
    } else if (act === 'cn-send-clue') {
      var cw = (document.getElementById('cnClueInp').value || '').trim();
      var cc = parseInt(document.getElementById('cnCountInp').value, 10) || 2;
      if (!cw) cw = 'شفرة';
      gd.clueWord = cw;
      gd.clueCount = cc;
      gd.guessesLeft = cc + 1;
      ST.statusMsg = 'الشفرة المعلنة: «' + cw + ' (' + arNum(cc) + ')» — اضغطوا على الكلمات لتخمينها!';
      SFX.play('buzz');
      renderAll();
    } else if (act === 'cn-pick') {
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var card = gd.cards[idx];
      if (!card || card.revealed || gd.gameOver) return;
      card.revealed = true;
      if (card.role === 'bomb') {
        gd.gameOver = true;
        gd.winnerText = '💥 تم كشف الفخ الأسود («' + card.word + '»)! خسر الفريق ' + (gd.turnTeam === 'gold' ? 'الذهبي' : 'الفيروزي') + ' القيم فوراً!';
        SFX.play('alarm');
      } else if (card.role === gd.turnTeam) {
        SFX.play('win');
        if (gd.guessesLeft > 0) gd.guessesLeft--;
        var rem = gd.cards.filter(function(c){ return c.role === gd.turnTeam && !c.revealed; }).length;
        if (rem === 0) {
          gd.gameOver = true;
          gd.winnerText = '🏆 كشف الفريق ' + (gd.turnTeam === 'gold' ? 'الذهبي' : 'الفيروزي') + ' جميع كلماته السرية وفاز بالقيم!';
        } else if (gd.guessesLeft === 0) {
          gd.turnTeam = gd.turnTeam === 'gold' ? 'teal' : 'gold';
        }
      } else {
        SFX.play('alarm');
        gd.turnTeam = gd.turnTeam === 'gold' ? 'teal' : 'gold';
        gd.clueWord = '';
      }
      renderAll();
    } else if (act === 'cn-end-turn') {
      gd.turnTeam = gd.turnTeam === 'gold' ? 'teal' : 'gold';
      gd.clueWord = '';
      SFX.play('click');
      renderAll();
    } else if (act === 'mz-bid-up') {
      var tm = parseInt(btn.getAttribute('data-team'), 10);
      gd.currentBid++;
      gd.bidHolderTeam = tm;
      SFX.play('click');
      renderAll();
    } else if (act === 'mz-start-clock') {
      gd.phase = 'countdown';
      SFX.play('buzz');
      startTimer(30, function() {
        if (gd.namedItems.length < gd.currentBid) {
          var other = gd.bidHolderTeam === 1 ? 2 : 1;
          ST.teamScores[other - 1] += gd.currentBid * 100;
          gd.phase = 'result';
          gd.roundWinner = '⏱️ انتهى الوقت! لم يكمل الفريق ' + arNum(gd.bidHolderTeam) + ' العدد المطلوب — ذهبت +' + arNum(gd.currentBid * 100) + ' نقطة للفريق ' + arNum(other) + '!';
          renderAll();
        }
      });
      renderAll();
    } else if (act === 'mz-tick-item') {
      var itm = btn.getAttribute('data-item');
      if (gd.namedItems.indexOf(itm) === -1) gd.namedItems.push(itm);
      SFX.play('win');
      if (gd.namedItems.length >= gd.currentBid) {
        stopTimer();
        ST.teamScores[gd.bidHolderTeam - 1] += gd.currentBid * 100;
        gd.phase = 'result';
        gd.roundWinner = '🏆 أنجز الفريق ' + arNum(gd.bidHolderTeam) + ' المزاد بنجاح (' + arNum(gd.currentBid) + ' إجابات) وكسب +' + arNum(gd.currentBid * 100) + ' نقطة!';
      }
      renderAll();
    } else if (act === 'mz-add-manual') {
      gd.namedItems.push('إجابة #' + (gd.namedItems.length + 1));
      SFX.play('win');
      if (gd.namedItems.length >= gd.currentBid) {
        stopTimer();
        ST.teamScores[gd.bidHolderTeam - 1] += gd.currentBid * 100;
        gd.phase = 'result';
        gd.roundWinner = '🏆 أنجز الفريق ' + arNum(gd.bidHolderTeam) + ' المزاد بنجاح وكسب +' + arNum(gd.currentBid * 100) + ' نقطة!';
      }
      renderAll();
    } else if (act === 'fa-toggle-role') {
      gd.revealRole = !gd.revealRole;
      SFX.play('click');
      renderAll();
    } else if (act === 'fa-bot-stroke') {
      var colors = ['#F5B942', '#2DD4BF', '#F43F5E', '#A855F7'];
      var cx = 140 + Math.random() * 240, cy = 80 + Math.random() * 160;
      var pts = [];
      for (var s = 0; s < 12; s++) {
        pts.push({ x: cx + Math.cos(s * 0.5) * (35 + Math.random() * 20), y: cy + Math.sin(s * 0.5) * (35 + Math.random() * 20) });
      }
      gd.strokes.push({ color: colors[gd.strokeTurn % colors.length], pts: pts });
      gd.strokeTurn++;
      SFX.play('click');
      renderAll();
    } else if (act === 'fa-clear-canvas') {
      gd.strokes = [];
      renderAll();
    } else if (act === 'fa-open-vote') {
      gd.phase = 'vote';
      SFX.play('buzz');
      renderAll();
    } else if (act === 'fa-cast-vote') {
      var vIdx = parseInt(btn.getAttribute('data-idx'), 10);
      gd.phase = 'result';
      if (vIdx === gd.fakeIdx) {
        SFX.play('win');
        gd.winnerText = '🎯 قفطة ناجحة! كشفتم الرسّام المندسّ (' + ST.players[gd.fakeIdx].name + ') — الكلمة السرية كانت: «' + gd.secretWord + '»!';
      } else {
        SFX.play('alarm');
        gd.winnerText = '🎭 نجا الرسّام المندسّ (' + ST.players[gd.fakeIdx].name + ') وخدعكم جميعاً! الكلمة السرية كانت: «' + gd.secretWord + '»!';
      }
      renderAll();
    } else if (act === 'fa-guess-word') {
      var gw = btn.getAttribute('data-w');
      gd.phase = 'result';
      if (gw === gd.secretWord) {
        SFX.play('win');
        gd.winnerText = '🔥 أصاب الرسّام المندسّ الكلمة السرية («' + gw + '») وخطف نقاط الجولة!';
      } else {
        SFX.play('alarm');
        gd.winnerText = '❌ تخمين خاطئ («' + gw + '»)! الكلمة الصحيحة هي «' + gd.secretWord + '» — فاز الفنانون!';
      }
      renderAll();
    } else if (act === 'lt-toggle-card') {
      var cIdx = parseInt(btn.getAttribute('data-idx'), 10);
      var pos = gd.selectedIndices.indexOf(cIdx);
      if (pos !== -1) gd.selectedIndices.splice(pos, 1);
      else if (gd.selectedIndices.length < 3) gd.selectedIndices.push(cIdx);
      SFX.play('click');
      renderAll();
    } else if (act === 'lt-play-selected') {
      if (!gd.selectedIndices.length) return;
      var played = gd.selectedIndices.map(function(i){ return gd.hand[i]; });
      gd.hand = gd.hand.filter(function(_, i){ return gd.selectedIndices.indexOf(i) === -1; });
      gd.selectedIndices = [];
      gd.pileCount += played.length;
      gd.lastPlay = { playerIdx: 0, playerName: ST.players[0].name, count: played.length, actualCards: played };
      gd.verdictText = '';
      SFX.play('click');
      renderAll();
    } else if (act === 'lt-call-liar') {
      if (!gd.lastPlay) return;
      var liar = gd.lastPlay.actualCards.some(function(c){ return c !== gd.targetEmblem && c !== '🃏 الجوكر'; });
      if (liar) {
        SFX.play('win');

      } else {

        gd.chamberRisk[1]++;
        gd.verdictText = '🛡️ كان صادقاً! جميع أوراقه مطابقة [' + gd.lastPlay.actualCards.join(' ، ') + '] — العقاب يرتد على المتّهِم!';
      }
      gd.lastPlay = null;
      gd.pileCount = 0;
      renderAll();
    } else if (act === 'v50-open') {
      var num = parseInt(btn.getAttribute('data-num'), 10);
      var v = gd.vaults[num - 1];
      if (!v || v.opened) return;
      v.opened = true;
      if (v.info.bomb) {

          gd.shields[gd.turnTeam - 1]--;

          SFX.play('buzz');

          gd.turnTeam = gd.turnTeam === 1 ? 2 : 1;
          SFX.play('alarm');
        }
      } else {
        gd.unbankedPot += v.info.pts;
        if (v.info.shield) gd.shields[gd.turnTeam - 1]++;
        ST.statusMsg = '✨ الخزنة رقم ' + arNum(num) + ': ' + v.info.label + ' — الرصيد المعلّق الآن ' + arNum(gd.unbankedPot) + ' نقطة!';
        SFX.play('win');
      }
      renderAll();
    } else if (act === 'v50-random') {
      var closed = gd.vaults.filter(function(v){ return !v.opened; });
      if (closed.length) {
        var pick = closed[Math.floor(Math.random() * closed.length)];
        var fakeBtn = document.querySelector('[data-act="v50-open"][data-num="' + pick.num + '"]');
        if (fakeBtn) fakeBtn.click();
      }
    } else if (act === 'v50-bank') {
      ST.teamScores[gd.turnTeam - 1] += gd.unbankedPot;
      ST.statusMsg = '🏦 أمّن الفريق ' + arNum(gd.turnTeam) + ' مبلغ ' + arNum(gd.unbankedPot) + ' نقطة في البنك الرسمي!';
      gd.unbankedPot = 0;
      gd.turnTeam = gd.turnTeam === 1 ? 2 : 1;
      SFX.play('win');
      renderAll();
    } else if (act === 'rg-next-clue') {
      if (gd.clueIdx < gd.mystery.clues.length - 1) {
        gd.clueIdx++;
        SFX.play('click');
        renderAll();
      }
    } else if (act === 'rg-answer') {
      var ans = btn.getAttribute('data-ans');
      var pts = gd.ptsSchedule[gd.clueIdx] || 150;
      if (ans === gd.mystery.answer) {
        ST.teamScores[0] += pts;
        gd.solved = true;
        gd.winnerText = '🎯 إجابة صحيحة من التلميح رقم ' + arNum(gd.clueIdx + 1) + ' (+' + arNum(pts) + ' نقطة)!';
        SFX.play('win');
      } else {
        ST.statusMsg = '❌ تخمين خاطئ («' + ans + '»)! اكشف التلميح التالي لتقريب الإجابة.';
        SFX.play('alarm');
      }
      renderAll();
    } else if (act === 'ac-toggle-alibi') {
      gd.showSecretAlibi = !gd.showSecretAlibi;
      SFX.play('click');
      renderAll();
    } else if (act === 'ac-submit-ans') {
      var inp = document.getElementById('acAnsInp');
      var val = inp ? inp.value.trim() : '';
      if (!val) val = 'كنا مجتمعين في الاستراحة وقت الحادثة!';
      gd.suspectAnswers.push({ player: 'المشتبه ١', text: val });
      gd.suspectAnswers.push({ player: 'فهد (المشتبه ٢)', text: gd.caze.botReply });
      SFX.play('click');
      renderAll();
    } else if (act === 'ac-next-q') {
      gd.questionIdx++;
      SFX.play('click');
      renderAll();
    } else if (act === 'ac-catch-culprit') {
      gd.verdictText = '⚖️ انتهى الاستجواب! التناقض ظهر في رواية المشتبه الثاني حول التوقيت — +٥٠٠ نقطة لفريق المحققين!';
      SFX.play('win');
      renderAll();
    } else if (act === 'ps-start') {
      gd.running = true;
      SFX.play('buzz');
      startTimer(60, function() {
        gd.running = false;
        ST.statusMsg = '🏆 انتهت الـ ٦٠ ثانية! حصد اللاعب ' + arNum(gd.roundPoints) + ' نقطة على كرسي الضغط!';
        renderAll();
      });
      renderAll();
    } else if (act === 'ps-pass-q') {
      gd.qIdx++;
      gd.streak++;
      gd.roundPoints += 100 + (gd.streak >= 3 ? 50 : 0);
      SFX.play('win');
      renderAll();
    } else if (act === 'ps-trap') {
      gd.qIdx++;
      gd.streak = 0;
      gd.violations++;
      gd.roundPoints = Math.max(0, gd.roundPoints - 50);
      ST.statusMsg = '🚨 قفطة مخالفة! نطق بكلمة محظورة أو تردد — تم خصم ٥٠ نقطة وتصفير السلسلة!';
      SFX.play('alarm');
      renderAll();
    }
  });

  document.getElementById('closeQrBtn').addEventListener('click', function() {
    document.getElementById('qrModal').classList.remove('open');
  });

  initGameEngine();
})();
</script>

<script>
(function(){
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'DW_AUDIO_SYNC') {
      window.__DW_VOICE_ON = !!d.voiceOn;
      window.__DW_SFX_ON = !!d.sfxOn;
      if (!d.voiceOn && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    }
  });
})();
</script>
