 *
 * الاستخدام:

 *   MafiaAudio.play('wolf')             // مؤثر

  const join = (g, name) => L.join(g, name);

  function deal(g, rng) {
    const cards = L.shuffle(D.pool(g.settings.set), rng);
    const extra = L.shuffle(D.pool('mix'), rng).filter((c) => !cards.some((x) => x.n === c.n));

  }

    g.players.forEach((p) => { p.score = 0; });

  function start(g, hostId, now, rng) {
    if (g.hostId !== hostId) return fail('not_host'); if (g.phase !== 'lobby') return fail('already_started');

  const waiting = (g) => g.order.filter((id) => !g.solved[id] && (byId(g, id) || {}).connected);
  function finish(g, now) {

    if (g.phase !== 'judge') return fail('bad_phase'); if (id === g.cur) return fail('not_judge');
    if (!byId(g, id)) return fail('no_player'); if (v !== 'ok' && v !== 'no') return fail('bad_vote');

  // الأغلبية تحكم. إذا تعادلوا أو ما صوّت أحد = غلط.
  function settle(g, now, force) {
    const js = judges(g), n = js.length;
    const yes = js.filter((p) => g.votes[p.id] === 'ok').length, no = js.filter((p) => g.votes[p.id] === 'no').length;
    let verdict = null;

  function skip(g, id, now) {
    if (g.hostId !== id) return fail('not_host');

  }

      case 'vote': return vote(g, id, m.v, now);
      case 'pass': return pass(g, id, now);
      case 'skip': return skip(g, id, now);
      case 'end': { if (g.hostId !== id) return fail('not_host'); if (g.phase !== 'turn' && g.phase !== 'judge') return fail('bad_phase'); finish(g, now); return ok(); }
      case 'again': { if (g.hostId !== id) return fail('not_host'); if (g.phase !== 'ended') return fail('bad_phase'); begin(g, now, rng); return ok(); }
      case 'lobby': return L.toLobby(g, id);
      case 'settings': return L.setSettings(g, id, m.patch || {}, ALLOWED);
      default: return fail('bad_action');
    }
  }

  function viewFor(g, pid, now) {
    const v = L.baseView(g, now), inGame = g.phase !== 'lobby';
    v.setNames = D.NAMES; v.setOrder = D.ORDER;
    if (inGame) {
      const ended = g.phase === 'ended';
      v.cur = g.cur; v.lap = g.lap; v.laps = g.settings.laps; v.last = g.last;
      v.claim = g.claim;
      // بطاقتك ما تشوفها إلا إذا عرفتها أو خلصت اللعبة. التلفزيون ما يعرض إلا البطاقات المعروفة.
      v.cards = g.players.map((p) => {
        const show = ended || g.solved[p.id] || (pid && p.id !== pid && byId(g, pid));
        const c = g.cards[p.id];
        return { id: p.id, solved: g.solved[p.id] || 0, turns: g.turns[p.id] || 0, card: show && c ? { n: c.n, m: c.m || '', e: c.e || '' } : null };
      });
      if (g.last && g.last.card) v.last = Object.assign({}, g.last);
      if (g.phase === 'judge') {
        const js = judges(g);

      }
    }
    v.players.forEach((p) => { p.solved = g.solved[p.id] || 0; });
    const p = pid && byId(g, pid);
    if (p) {
      v.me = { id: p.id, name: p.name, host: g.hostId === p.id, solved: g.solved[p.id] || 0 };
      if (g.phase === 'judge') v.me.vote = g.votes[p.id] || null;
    }
    return v;
  }
  return Object.assign({ MIN, MAX, ALLOWED, RANK_PTS, createGame, join, start, tick, act, viewFor }, { leave: L.leave, kick: L.kick, setConnected: L.setConnected, need: L.need, byId: L.byId });
});

    function endScreen(v, extra) {

      return out;
    }
    const K = { cfg, ST, E, esc, AR, act, toast, byId, av, nm, timerHtml, hostSkip, topbar, scores, playerPicks, endScreen, render: () => render(), fmt, remaining, store };

    // ------------------------------------------------------------ الشاشات العامة
    function home() {
      const pre = params.get('room') || '';
      return '<div class="logo"><div class="ic">' + (cfg.icon || '') + '</div><div class="t">' + (cfg.nameHtml || esc(cfg.name)) + '</div><div class="s">' + esc(cfg.tagline || '') + '</div></div>' +
        (ST.me && !ST.view ? '<div class="card ctr mut">نرجّعك لغرفتك…</div>' : '') +
        '<div class="card col"><div class="big">ادخل غرفة</div><input id="inCode" class="inp code" inputmode="numeric" maxlength="4" placeholder="••••" value="' + esc(pre) + '" autocomplete="off"><input id="inName" class="inp" maxlength="14" placeholder="اسمك" autocomplete="off" value="' + esc(store.get('diwaniya_name') || '') + '"><button class="btn" data-a="join">دخول</button></div>' +
        '<div class="card col"><div class="big">أنشئ غرفة جديدة</div><div class="mut small">تصير أنت المضيف. الباقين يدخلون بمسح الـQR بدون تسجيل. من ' + AR(cfg.min) + ' إلى ' + AR(cfg.max) + ' لاعبين.</div><input id="inName2" class="inp" maxlength="14" placeholder="اسمك" autocomplete="off" value="' + esc(store.get('diwaniya_name') || '') + '"><button class="btn gold" data-a="create">إنشاء الغرفة</button></div>' +
        '<button class="btn sec" data-a="help">؟ كيف تلعب؟</button>';
    }
    const qrFor = (code) => { const link = root.location.origin + root.location.pathname + '?room=' + code; let svg = ''; try { svg = QR.toSvg(link, { ecc: 'M', border: 1 }); } catch (e) { } return { link, svg }; };
    function lobby(v) {
      const me = v.me, host = me && me.host, q = qrFor(v.code), n = v.players.length;
      let out = '<div class="topbar"><span class="pill">' + esc(cfg.name) + ' — غرفة <b>' + esc(v.code) + '</b></span><span class="sp"></span>' + (me ? '<button class="btn sec sm" data-a="leave">خروج</button>' : '') + '</div>';
      out += '<div class="card col"><div class="ctr mut small">امسحوا الرمز من الكاميرا أو ادخلوا بالرمز</div><div class="qrbox">' + q.svg + '</div><div class="code" dir="ltr">' + esc(v.code) + '</div><div class="row"><button class="btn sec sm sp" data-a="share">نسخ / مشاركة الرابط</button><button class="btn sec sm sp" data-a="boardlink">شاشة التلفزيون</button></div></div>';
      if (ST.ui.board) { const bl = root.location.origin + root.location.pathname + '?board=' + v.code; out += '<div class="card col"><div class="big">شاشة التلفزيون</div><div class="mut small" style="line-height:1.8">افتح هذا الرابط على التلفزيون أو الآيباد أو اللابتوب. يعرض اللعب للكل مع الراوي والمؤثرات، وما يعرض أي شي سري.</div><div class="hint" dir="ltr" style="word-break:break-all">' + esc(bl) + '</div><button class="btn sec sm" data-a="copyboard" data-u="' + esc(bl) + '">نسخ رابط الشاشة</button></div>'; }
      out += '<div class="card col"><div class="row"><div class="big">اللاعبين (' + AR(n) + ')</div><span class="sp"></span><span class="mut small">من ' + AR(cfg.min) + ' إلى ' + AR(cfg.max) + '</span></div>' + v.players.map((p) => {
        const kick = host && me.id !== p.id ? '<button class="btn sec sm" data-a="kick" data-id="' + p.id + '">' + (ST.ui.kick === p.id ? 'تأكيد الطرد' : '✕') + '</button>' : '';
        return '<div class="pl ' + (p.connected ? '' : 'off') + '">' + av(p) + '<b>' + esc(p.name) + '</b>' + (p.host ? '<span class="tag g">المضيف</span>' : '') + (me && p.id === me.id ? '<span class="tag">أنت</span>' : '') + '<span class="sp"></span>' + kick + '</div>';
      }).join('') + '</div>';
      if (cfg.lobbyInfo) out += cfg.lobbyInfo(v, K);
      if (host && cfg.lobbyHost) out += cfg.lobbyHost(v, K);
      out += '<button class="btn sec" data-a="help">؟ كيف تلعب؟</button>';
      if (host) out += '<div class="stick"><button class="btn gold" data-a="start" ' + (v.need ? 'disabled' : '') + '>' + (v.need ? 'ينقصكم ' + AR(v.need) + ' لاعب' : 'ابدأ اللعبة') + '</button></div>';
      else if (me) out += '<div class="card ctr mut">ننتظر المضيف يبدأ اللعبة…</div>';
      return out;
    }
    function settingChips(v, key, options, label) {
      return '<div class="col" style="gap:8px"><div class="mut small">' + label + '</div><div class="row wrap">' + options.map((o) => '<button class="chip ' + (v.settings[key] === o[0] ? 'on' : '') + '" data-a="setting" data-k="' + key + '" data-v="' + esc(JSON.stringify(o[0])) + '">' + esc(o[1]) + '</button>').join('') + '</div></div>';
    }
    K.settingChips = settingChips;
    function logCard(v) {
      const evs = (v.events || []).slice().reverse().map((e) => (cfg.evText ? cfg.evText(v, e, K) : '')).filter(Boolean);
      if (!evs.length) return '';
      return '<div class="card col"><button class="row" data-a="log" style="width:100%"><b>سجل اللعبة</b><span class="sp"></span><span class="mut small">' + (ST.ui.log ? 'إخفاء' : 'عرض') + '</span></button>' + (ST.ui.log ? '<div class="log">' + evs.map((t) => '<div>' + t + '</div>').join('') + '</div>' : '') + '</div>';
    }
    K.logCard = logCard;

    function render() {
      const v = ST.view; let html;
      if (!v) html = home();
      else if (v.phase === 'lobby') html = lobby(v);
      else if (!v.me) html = '<div class="card ctr">أنت مو لاعب في هذي الغرفة.</div>';
      else html = cfg.screen(v, K);
      const focus = doc.activeElement && doc.activeElement.id, keep = {};
      Array.prototype.forEach.call(doc.querySelectorAll('#app input, #app textarea'), (x) => { if (x.id) keep[x.id] = x.value; });
      $app.innerHTML = html;
      Object.keys(keep).forEach((k) => { const x = doc.getElementById(k); if (x && !x.hasAttribute('data-fresh')) x.value = keep[k]; });
      if (focus) { const f = doc.getElementById(focus); if (f) { f.focus(); try { const L = f.value.length; f.setSelectionRange(L, L); } catch (e) { } } }
      if (cfg.after) cfg.after(v, K);
      renderOverlay();
    }
    function renderOverlay() {
      let out = '';
      if (ST.me && !ST.open) out += '<div class="conn">الاتصال مقطوع… نحاول نرجّعه</div>';
      if (ST.toast) out += '<div class="toast">' + esc(ST.toast) + '</div>';
      if (ST.ui.peek && cfg.peek && ST.view) out += '<div class="peek noselect" data-peek="1">' + cfg.peek(ST.view, K) + '</div>';
      $ov.innerHTML = out;
    }
    K.renderOverlay = renderOverlay;
    setInterval(() => {
      const v = ST.view; if (!v || !v.deadline) return;
      const t = doc.querySelector('[data-timer]'), b = doc.querySelector('[data-bar]');
      if (t) t.textContent = fmt(remaining(v)); if (b) b.style.width = Math.round(100 * remaining(v) / (v.timerTotal || 1)) + '%';
    }, 250);
    // عرض السر بالضغط المطوّل
    let holdT = 0;
    const isPeekEl = (e) => e.target.closest && e.target.closest('[data-peek]');
    doc.addEventListener('pointerdown', (e) => { if (!isPeekEl(e)) return; clearTimeout(holdT); holdT = setTimeout(() => { ST.ui.peek = true; renderOverlay(); }, 160); });
    ['pointerup', 'pointercancel'].forEach((n) => doc.addEventListener(n, () => { clearTimeout(holdT); if (ST.ui.peek === true) { ST.ui.peek = false; renderOverlay(); } }));
    doc.addEventListener('contextmenu', (e) => { if (isPeekEl(e)) e.preventDefault(); });

    // ------------------------------------------------------------ الشرح
    const HS = { sec: null };
    function openHelp(s) { HS.sec = s || HS.sec || cfg.help.SECTIONS[0].id; $help.classList.add('on'); renderHelp(); }
    function renderHelp() {
      const S = cfg.help.SECTIONS.find((x) => x.id === HS.sec) || cfg.help.SECTIONS[0]; let body = '';
      if (S.lead) body += '<div class="lead">' + esc(S.lead) + '</div>';
      if (S.kind === 'list') body += '<ul class="pts">' + S.points.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>';
      if (S.kind === 'steps') body += S.steps.map((s, i) => '<div class="stp"><span class="n">' + AR(i + 1) + '</span><div class="tx"><b>' + esc(s.h) + '</b>' + esc(s.t) + '</div></div>').join('');
      if (S.note) body += '<div class="note">' + esc(S.note) + '</div>';
      const i = cfg.help.SECTIONS.indexOf(S), nx = cfg.help.SECTIONS[i + 1];
      $help.innerHTML = '<div class="hp"><div class="row"><div class="big sp">شرح ' + esc(cfg.name) + '</div><button class="btn sec sm" data-a="helpclose">إغلاق ✕</button></div><div class="htabs">' + cfg.help.SECTIONS.map((x) => '<button class="chip ' + (x.id === S.id ? 'on' : '') + '" data-a="helptab" data-s="' + x.id + '">' + esc(x.short) + '</button>').join('') + '</div><div class="big">' + esc(S.title) + '</div>' + body +
        (nx ? '<button class="btn" data-a="helptab" data-s="' + nx.id + '">التالي: ' + esc(nx.short) + '</button>' : '<button class="btn gold" data-a="helpclose">فهمت، يلا نلعب</button>') + '</div>';
      $help.scrollTop = 0;
    }

    // ------------------------------------------------------------ الأزرار
    doc.addEventListener('click', (e) => {
      const el = e.target.closest ? e.target.closest('[data-a]') : null; if (!el) return;
      const a = el.getAttribute('data-a'), v = ST.view, id = el.getAttribute('data-id');
      const val = (i) => { const x = doc.getElementById(i); return x ? x.value.trim() : ''; };
      if (cfg.click && cfg.click(a, el, K)) return;
      switch (a) {
        case 'create': { try { if (root.MafiaAudio) root.MafiaAudio.unlock(); } catch(e){} const n = val('inName2') || val('inName') || 'المضيف'; store.set('diwaniya_name', n); send({ t: 'create', name: n }) || toast('الاتصال مقطوع'); break; }
        case 'join': { const c = val('inCode'), n2 = val('inName'); if (!/^\d{4}$/.test(c)) return toast('اكتب رمز الغرفة (٤ أرقام)'); if (!n2) return toast(ERR.name_required); store.set('diwaniya_name', n2); send({ t: 'join', code: c, name: n2 }) || toast('الاتصال مقطوع'); break; }
        case 'leave': act('leave'); break;
        case 'share': { const u = qrFor(v.code).link; if (root.navigator.share) root.navigator.share({ title: cfg.name, text: 'ادخل غرفتنا: ' + v.code, url: u }).catch(() => { }); else if (root.navigator.clipboard) root.navigator.clipboard.writeText(u).then(() => toast('انسخ الرابط')); break; }
        case 'boardlink': ST.ui.board = !ST.ui.board; render(); break;
        case 'copyboard': if (root.navigator.clipboard) root.navigator.clipboard.writeText(el.getAttribute('data-u')).then(() => toast('انسخ رابط الشاشة')); break;
        case 'kick': if (ST.ui.kick === id) { ST.ui.kick = null; act('kick', { target: id }); } else { ST.ui.kick = id; render(); setTimeout(() => { if (ST.ui.kick === id) { ST.ui.kick = null; render(); } }, 3000); } break;
        case 'setting': { const p = {}; p[el.getAttribute('data-k')] = JSON.parse(el.getAttribute('data-v')); act('settings', { patch: p }); break; }
        case 'start': act('start'); break;
        case 'skip': act('skip'); break;
        case 'again': act('again'); break;
        case 'lobby': act('lobby'); break;
        case 'sel': ST.ui.sel = ST.ui.sel === id ? null : id; render(); break;
        case 'peek': ST.ui.peek = ST.ui.peek ? false : 'btn'; renderOverlay(); break;
        case 'log': ST.ui.log = !ST.ui.log; render(); break;
        case 'help': openHelp(el.getAttribute('data-s')); break;
        case 'helpclose': $help.classList.remove('on'); break;
        case 'helptab': HS.sec = el.getAttribute('data-s'); renderHelp(); break;
      }
    });
    doc.addEventListener('click', (e) => { if (ST.ui.peek === 'btn' && e.target.closest && e.target.closest('.peek')) { ST.ui.peek = false; renderOverlay(); } });
    doc.addEventListener('keydown', (e) => {

      if (t && t.id === 'inName') { const b = doc.querySelector('[data-a="join"]'); b && b.click(); }

    });

    // النسخة التجريبية: التلفزيون داخل نفس الصفحة
    const DB = { board: null };
    function setTab(t) { doc.body.classList.toggle('show-board', t === 'board'); doc.body.classList.toggle('show-both', t === 'both'); doc.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.getAttribute('data-tab') === t)); if (DB.board) setTimeout(DB.board.fit, 30); }
    function demoBoard(code) {

      const bh = doc.getElementById('board'); bh.className = 'bd-host'; DB.board = root.DiwaniyaBoard.mount(bh, cfg, { code }); DB.board.enableSound();
      const t = doc.createElement('div'); t.className = 'tabs'; t.innerHTML = '<button class="on" data-tab="phone">جوالي</button><button data-tab="board">التلفزيون</button>' + (root.innerWidth >= 900 ? '<button data-tab="both">الاثنين معاً</button>' : ''); doc.body.appendChild(t);
      t.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTab(b.getAttribute('data-tab')); });
    }
    root.__mk = ST; root.__setTab = setTab; root.__K = K;
    if (root.DIWANIYA_DEMO) { doc.body.classList.add('is-demo'); const db = doc.createElement('div'); db.className = 'demo'; db.textContent = 'نسخة تجريبية بدون إنترنت — باقي اللاعبين بوتات'; doc.body.appendChild(db); }
    render(); connect();
  }
  root.DiwaniyaKit = { run, esc, AR };
})(typeof self !== 'undefined' ? self : this);

</script>

  function mount(el, cfg, opts) {

    const av = (p, cls) => '<div class="av ' + (cls || '') + '" style="background:' + p.color + '"><b>' + esc((p.name || '?').charAt(0)) + '</b></div>';
    const qrSvg = (v) => { const link = root.location.origin + root.location.pathname + '?room=' + v.code; try { return QR.toSvg(link, { ecc: 'M', border: 1 }); } catch (e) { return ''; } };

        '<div class="sub" style="margin-top:1em">اللاعبين: ' + AR(n) + (v.need ? ' — ينقصكم ' + AR(v.need) : ' — جاهزين! المضيف يبدأ') + '</div><div class="chips">' + v.players.map((p) => '<span class="chip"><i style="background:' + p.color + '"></i>' + esc(p.name) + '</span>').join('') + '</div>' + (BC.lobbyExtra ? BC.lobbyExtra(v, B) : '') + '</div></div>';
    }

      return '<div class="hp"><h2>' + esc(S.title) + '</h2>' + (S.lead ? '<div class="ls">' + esc(S.lead) + '</div>' : '') + '<ul class="ls">' + items.join('') + '</ul><div class="nav"><span class="bbtn s" data-act="hprev">السابق</span><span class="bbtn" data-act="hnext">' + (ST.help < HELP.SECTIONS.length - 1 ? 'التالي' : 'إغلاق') + '</span><span class="bbtn s" data-act="hclose">إغلاق</span></div></div>';

      if (!ST.code) h = '<div class="err">افتح شاشة العرض من زر «التلفزيون» داخل الغرفة</div>';
      else if (ST.err) h = '<div class="err">' + esc(ST.err) + '</div>';
      else if (!v) h = '<div class="err">نتصل بالغرفة…</div>';

        else h = header(v) + BC.render(v, B);
        if (ST.started) h += '<div class="ctl"><button data-act="sfx" class="' + (ST.sfxOn ? '' : 'off') + '" title="المؤثرات">♪</button><button data-act="voice" class="' + (ST.voiceOn ? '' : 'off') + '" title="الراوي">ر</button><button data-act="help" title="شرح اللعبة">؟</button></div>';
        else h += '<div class="gate" data-act="start"><div class="box"><h2>جاهزين؟</h2><p>اضغط لتفعيل الراوي والمؤثرات الصوتية</p><span class="bbtn">تفعيل الصوت</span><span class="bbtn s" data-act="mute">بدون صوت</span></div></div>';

<script>/* kit/loopback.js */
/* ديوانية بلس — النسخة التجريبية بدون إنترنت لأي لعبة جماعية: "خادم" داخل الصفحة + لاعبين بوتات.
 * نفس بروتوكول hub.js بالضبط، فالواجهة ما تدري إنها مو على خادم حقيقي.
 *   DiwaniyaLoop.install({ E, names?, bots: 5, think(b, v, H) })
 *   b.act(o) يرسل فعل · b.once(key, minMs, maxMs, fn) ينفذ مرة وحدة لكل key بعد تأخير عشوائي · b.mem ذاكرة البوت
 *   H = { rnd, pick(arr), D(a,b), shuffle }   ?fast=1 يسرّع  ·  ?bots=N يغيّر العدد */
(function (g) {
  'use strict';
  var rnd = Math.random, search = (g.location && g.location.search) || '';
  var FAST = /[?&]fast=1/.test(search);
  var NAMES = ['بدر', 'لمى', 'سلطان', 'هند', 'ياسر', 'جود', 'تركي', 'أروى', 'نواف', 'ريم', 'فهد', 'سارة', 'ماجد', 'دانة', 'خالد', 'نورة'];
  var H = {
    rnd: rnd,
    pick: function (a) { return a[Math.floor(rnd() * a.length)]; },
    D: function (a, b) { return FAST ? 300 + rnd() * 600 : a + rnd() * (b - a); },
    shuffle: function (a) { return a.slice().sort(function () { return rnd() - 0.5; }); }
  };
  function install(cfg) {
    var E = cfg.E, Hub = g.MafiaHub;
    var hub = Hub.createHub({ E: E, rng: rnd, allowDev: false, randInt: function (a, b) { return a + Math.floor(rnd() * (b - a)); }, token: function () { var s = ''; for (var i = 0; i < 24; i++) s += Math.floor(rnd() * 16).toString(16); return s; } });
    setInterval(function () { hub.tick(); }, 500);
    function Sock(url) {
      var self = this; self.readyState = 0; self.url = url;
      self.conn = { closed: false, pid: null, code: null, board: false, send: function (o) { self._deliver(o); }, close: function () { self._shut(); } };
      setTimeout(function () { if (self.readyState !== 0) return; self.readyState = 1; if (self.onopen) self.onopen({}); }, 20);
    }
    Sock.prototype.send = function (text) { var self = this; if (self.readyState !== 1) throw new Error('closed'); var m = JSON.parse(text); setTimeout(function () { if (!self.conn.closed) hub.message(self.conn, m); }, 0); };

    Sock.prototype.close = function () { this._shut(); };
    Sock.prototype._shut = function () { var self = this; if (self.conn.closed) return; self.conn.closed = true; self.readyState = 3; hub.closed(self.conn); setTimeout(function () { if (self.onclose) self.onclose({}); }, 0); };
    g.DiwaniyaWS = Sock; g.__hub = hub;

    function Bot(code, name) {
      var b = this; b.name = name; b.view = null; b.sentFor = ''; b.mem = {}; b.lastPhase = '';
      b.sock = new Sock('bot'); b.sock.onopen = function () { b.sock.send(JSON.stringify({ t: 'join', code: code, name: name })); };
      b.sock.onmessage = function (ev) { var m = JSON.parse(ev.data); if (m.t === 'view') { b.view = m.view; if (m.view.phase === 'lobby') { b.sentFor = ''; b.mem = {}; return; } try { cfg.think(b, m.view, H); } catch (e) { if (g.console) console.error('bot', e); } } };
    }
    Bot.prototype.act = function (o) { try { this.sock.send(JSON.stringify(Object.assign({ t: 'act' }, o))); } catch (e) { } };
    Bot.prototype.later = function (ms, fn) { setTimeout(fn, ms); };
    Bot.prototype.once = function (key, a, b2, fn) { if (this.sentFor === key) return false; this.sentFor = key; var me = this; setTimeout(function () { fn.call(me); }, H.D(a, b2)); return true; };
    var seen = {};
    function wantBots() { var m = /[?&]bots=(\d+)/.exec(search); var n = m ? Number(m[1]) : (cfg.bots || 5); return Math.max(1, Math.min(n, (E.MAX || 60) - 1)); }
    setInterval(function () {
      hub.rooms.forEach(function (room, code) {
        if (seen[code]) return; seen[code] = true;
        var names = H.shuffle(cfg.names || NAMES), n = wantBots();
        for (var i = 0; i < n; i++) (function (i) { setTimeout(function () { var r = hub.rooms.get(code); if (r && r.g.phase === 'lobby' && r.g.players.length < r.g.max) new Bot(code, names[i]); }, 800 + i * 600); })(i);
      });
    }, 400);
  }
  g.DiwaniyaLoop = { install: install, H: H };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* games/fooq_rasak/bots.js */
/* فوق راسك — بوتات النسخة التجريبية */
(function (g) {
  'use strict';
  var E = g.MG.fooq_rasak;
  g.DiwaniyaLoop.install({ E: E, bots: 4, think: function (b, v, H) {
    var me = v.me; if (!me) return; var ph = v.phase;
    if (ph === 'turn' && v.cur === me.id) b.once('t' + v.round, 5000, 12000, function () { this.act({ a: H.rnd() < 0.55 ? 'claim' : 'pass' }); });
    else if (ph === 'judge' && v.cur !== me.id && !me.vote) b.once('j' + v.round, 1500, 5000, function () { this.act({ a: 'vote', v: H.rnd() < 0.6 ? 'ok' : 'no' }); });
  } });
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function(){
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'DW_AUDIO_SYNC') {
      window.__DW_VOICE_ON = !!d.voiceOn;
      window.__DW_SFX_ON = !!d.sfxOn;
      if (!d.voiceOn && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    }
  });
})();
</script>
