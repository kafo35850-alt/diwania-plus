<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>ديوانية بلس — مافيا الديوانية</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg2);color:var(--ink);font-family:-apple-system,"SF Arabic","Segoe UI",Tajawal,Cairo,system-ui,sans-serif;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

input{font:inherit;color:var(--ink)}
#app{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(76px,calc(env(safe-area-inset-bottom) + 60px));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
body.board #app{max-width:1180px;padding:28px 36px}
.noselect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3,p{margin:0}
.logo{text-align:center;padding-top:8px}
.logo .t{font-size:34px;font-weight:900;letter-spacing:.5px}
.logo .t b{color:var(--org)}
.logo .s{color:var(--mut);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
.wrap{flex-wrap:wrap}
.ctr{text-align:center}
.mut{color:var(--mut)}
.small{font-size:13px}
.big{font-size:22px;font-weight:800}
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-weight:800;font-size:17px;text-align:center;background:linear-gradient(180deg,#ff7a4a,var(--org));box-shadow:0 6px 18px rgba(242,101,56,.35)}
.btn.sec{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#ffd978,var(--gold));color:#2b1c00;box-shadow:0 6px 18px rgba(242,193,78,.3)}
.btn.red{background:linear-gradient(180deg,#ff6b6f,var(--red))}

.conn{position:fixed;inset:0 0 auto 0;background:#b4232a;text-align:center;padding:6px;font-size:13px;font-weight:700;z-index:60}
.topbar{display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#10122e;flex:none;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.pick{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid transparent;text-align:right}

.rolecard{border-radius:26px;padding:22px 18px;text-align:center;border:2px solid;position:relative;overflow:hidden}
.rolecard.mafia{background:linear-gradient(160deg,#4a1220,#14060b);border-color:#e5484d}
.rolecard.town{background:linear-gradient(160deg,#12395e,#071a2c);border-color:#38bdf8}
.rolecard.solo{background:linear-gradient(160deg,#4a2878,#1b0d33);border-color:#f2c14e}
.rolecard svg{width:120px;height:120px;display:block;margin:0 auto 6px}
.rolecard .rn{font-size:32px;font-weight:900}
.rolecard .ab{margin-top:12px;line-height:1.8;font-size:16px}
.rolecard .tp{margin-top:10px;font-size:14px;color:#ffe9a8}
.rolecard .wn{margin-top:10px;font-size:13px;color:var(--mut)}
.facedown{border-radius:26px;padding:50px 18px;text-align:center;border:2px dashed var(--org);background:repeating-linear-gradient(45deg,rgba(242,101,56,.10) 0 14px,rgba(242,101,56,.04) 14px 28px)}
.facedown .q{font-size:64px;font-weight:900;color:var(--org)}
.moon{width:130px;height:130px;margin:10px auto}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7}
.ann{border-radius:22px;padding:22px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line)}
.tally{display:flex;align-items:center;gap:8px}
.tally .tb{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--org),var(--gold));min-width:4px}
.hold{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.peek{position:fixed;inset:0;background:rgba(3,4,20,.9);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.peek .rolecard{width:100%;max-width:420px}
.qrbox{background:#fff;border-radius:18px;padding:10px;width:min(62vw,230px);margin:0 auto;line-height:0}
body.board .qrbox{width:300px}
.code{font-size:46px;font-weight:900;letter-spacing:12px;text-align:center}
body.board .code{font-size:80px}
.hint{font-size:13px;color:var(--mut);text-align:center}
.demo{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;padding:5px;background:rgba(242,193,78,.92);color:#2b1c00;font-weight:800;z-index:70;pointer-events:none}
.bd-host{visibility:hidden;pointer-events:none}
body.board-only #app,body.board-only #overlay{display:none}
body.show-board #app,body.show-board #overlay{visibility:hidden}
body.show-both #app{position:fixed;top:0;bottom:0;right:0;width:430px;max-width:430px;overflow-y:auto;z-index:70;background:#0b0a2e;padding-bottom:80px;border-left:1px solid rgba(255,255,255,.2)}
body.show-both #board.bd-host{visibility:visible;pointer-events:auto;z-index:60;right:430px}
body.show-both .peek,body.show-both .toast,body.show-both .conn{z-index:100}
body.show-both .tabs{left:calc(50% - 215px)}
body.show-board .bd-host{visibility:visible;pointer-events:auto;z-index:60}
.tabs{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:6px;background:rgba(10,10,46,.92);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px}
.tabs button{padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;color:#fff}
.tabs button.on{background:var(--org)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:900;font-size:18px}
.sum{font-weight:800;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.mode{flex:1;display:flex;flex-direction:column;gap:6px;text-align:right;padding:12px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid transparent;line-height:1.5}
.mode b{font-size:17px}.mode span{font-size:12.5px;color:var(--mut)}
.mode.on{border-color:var(--gold);background:rgba(242,193,78,.14)}
.stick{position:sticky;bottom:calc(10px + var(--stk,0px));z-index:5;padding-top:14px;background:linear-gradient(rgba(11,10,46,0),rgba(11,10,46,.92) 38%)}
body.is-demo{--stk:84px}
body.is-demo #app{padding-bottom:130px}
.tabsrow{display:flex;gap:8px;flex-wrap:wrap}
.tabsrow .chip{padding:9px 13px;font-size:14px}
.tabsrow .chip.on{background:var(--gold);border-color:var(--gold);color:#2b1c00}
.steps{margin:0;padding:0 22px 0 0;line-height:1.9;font-size:15px}
.steps li{margin-bottom:4px}.steps li.gh{opacity:.55}
.rost{display:flex;flex-wrap:wrap;gap:6px}
.rost .chip{font-size:12.5px;padding:5px 10px}.rost .chip.dead{opacity:.4;text-decoration:line-through}
.susp .dots3{display:flex;gap:10px;justify-content:center;margin-top:18px}
.susp .dots3 i{width:14px;height:14px;border-radius:50%;background:var(--gold);opacity:.3;animation:blink 1.2s infinite}
.susp .dots3 i:nth-child(2){animation-delay:.25s}.susp .dots3 i:nth-child(3){animation-delay:.5s}
@keyframes blink{50%{opacity:1;transform:scale(1.3)}}
.task{display:flex;flex-direction:column;gap:12px}
.task .tt{font-size:22px;font-weight:900;text-align:center}
.task .ti{color:var(--mut);font-size:14px;text-align:center;line-height:1.7}
.prog{display:flex;gap:7px;justify-content:center;min-height:14px}
.prog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}.prog i.on{background:var(--green)}
.tgrid{display:grid;gap:10px;width:100%}
.tgrid>*{min-width:0;width:100%}
.tgrid.wide .tcell{aspect-ratio:1.35}
#tbody{width:100%;display:flex;flex-direction:column;gap:12px}
.tcell{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff}
.tcell.num{background:rgba(56,189,248,.2);border-color:rgba(56,189,248,.65)}
.tcell.ok{background:rgba(52,211,153,.3);border-color:var(--green);opacity:.55}
.tcell.bad{animation:shake .3s;background:rgba(229,72,77,.45)}
.tcell.lit{background:radial-gradient(closest-side,#fff6bf,#f2c14e);border-color:#ffd978;box-shadow:0 0 26px rgba(242,193,78,.85)}
.pad{aspect-ratio:1.25;border-radius:22px;border:2px solid rgba(255,255,255,.22);opacity:.78}
.pad.on{opacity:1;filter:brightness(1.9);box-shadow:0 0 34px 6px currentColor;transform:scale(1.03)}
.tmsg{text-align:center;font-weight:800;min-height:24px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.keys button{padding:15px;border-radius:14px;background:rgba(255,255,255,.1);font-size:24px;font-weight:900;color:#fff}
.keys button:active{background:rgba(255,255,255,.22)}
.codebox{display:flex;gap:8px;justify-content:center;direction:ltr}
.codebox span{width:54px;height:66px;border-radius:12px;background:rgba(0,0,0,.38);border:1px solid var(--line);display:grid;place-items:center;font-size:34px;font-weight:900}
.codebox.show span{border-color:var(--gold);color:var(--gold)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.warn{border-radius:16px;padding:11px 14px;background:rgba(229,72,77,.15);border:1px solid rgba(229,72,77,.5);text-align:center;line-height:1.7;font-size:14px}
.warn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5)}
.mutebox{border-radius:16px;padding:11px 14px;background:rgba(167,139,250,.16);border:1px solid rgba(167,139,250,.55);text-align:center;line-height:1.7;font-size:15px;font-weight:700}
.tmrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.35);font-size:14px}
.tmrow .st{margin-inline-start:auto;font-size:12.5px;color:#ffd0d2;font-weight:700;text-align:left}
.lot{border-radius:20px;padding:18px;text-align:center;background:linear-gradient(160deg,rgba(229,72,77,.25),rgba(0,0,0,.2));border:1px solid rgba(229,72,77,.6)}
.lot .nm2{font-size:34px;font-weight:900;margin-top:8px;min-height:44px}
.lot .spin{display:inline-block;animation:lotpop .11s}
@keyframes lotpop{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
.pick.dis{opacity:.5;pointer-events:none}
#help{position:fixed;inset:0;z-index:90;background:radial-gradient(1200px 600px at 80% -10%,#2b2290 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#help.on{display:block}
.hp{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.hp .hh{display:flex;align-items:center;gap:10px}
.hp .hh .big{flex:1}
.hp .htabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hp .htabs::-webkit-scrollbar{display:none}
.hp .htabs .chip{flex:none;padding:9px 14px;font-size:14px}
.hp .htabs .chip.on{background:var(--gold);border-color:var(--gold);color:#2b1c00}
.hp .lead{line-height:1.9;font-size:16px}
.hp .pts{margin:0;padding:0 20px 0 0;line-height:1.9;font-size:15px}
.hp .stp{display:flex;gap:12px;align-items:flex-start}
.hp .stp .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--org);display:grid;place-items:center;font-weight:900}
.hp .stp .tx{line-height:1.8;font-size:15px}.hp .stp .tx b{display:block;font-size:16px}
.hp .rule{border-radius:16px;padding:12px 14px;background:rgba(242,193,78,.14);border:1px solid rgba(242,193,78,.55);line-height:1.8;font-size:15px}
.hp .tkc{display:flex;align-items:center;gap:10px}
.hp .tkc .tx{flex:1;line-height:1.7;font-size:14.5px}.hp .tkc .tx b{display:block;font-size:16px}
.hp .tkc .btn{flex:none}
.hp .practice{border:2px solid var(--gold)}
.hp .rolec{display:flex;gap:12px;align-items:flex-start}
.hp .rolec svg{width:54px;height:54px;flex:none}
.hp .rolec .tx{line-height:1.7;font-size:14px}.hp .rolec .tx b{font-size:17px;margin-inline-end:8px}
#hp-body{width:100%;display:flex;flex-direction:column;gap:12px}
.hfab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;width:42px;height:42px;border-radius:50%;background:rgba(10,10,46,.82);border:1px solid rgba(255,255,255,.28);font-weight:900;font-size:19px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.88}
body.is-demo .hfab{bottom:84px}
body.board .hfab,body.board-only .hfab,body.show-board .hfab,body.show-both .hfab,body.help-open .hfab{display:none}
.untimed{border-radius:14px;padding:9px 12px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.45);text-align:center;line-height:1.7;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04)}}}
</style>
</head>

<div id="overlay"></div>

<div id="board"></div>

.bd .err{color:#ff9aa0;font-size:3.4em;margin-top:.8em;min-height:1.4em}
.bd .ring.inf text{font-size:22px}
.bd .ctl button.hbtn{width:auto;padding:0 1.3em;border-radius:3em}
.bd .ctl button.hbtn span{font-size:2.6em;font-weight:900;white-space:nowrap}
.bd .hv{position:absolute;inset:0;z-index:12;background:radial-gradient(120% 90% at 50% 0%,#2b2290,#0b0a2e 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3.5em 8em 3em}

.bd .htt{font-size:6.4em;font-weight:900;color:#ffd978;text-align:center;line-height:1.15}
.bd .hct{display:flex;flex-direction:column;gap:.55em;color:#e7eaff}
.bd .hl{line-height:1.7;text-align:center;color:#cfd6ff}
.bd .hu{margin:0;padding:0 1.2em 0 0;line-height:1.85}
.bd .hr{display:flex;gap:.8em;align-items:flex-start;line-height:1.55;background:rgba(255,255,255,.07);border-radius:.8em;padding:.4em .8em}
.bd .hr .hn{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:#f26538;display:grid;place-items:center;font-weight:900;margin-top:.05em}
.bd .hr b{color:#ffd978;margin-inline-end:.4em}

.bd .hc{background:rgba(255,255,255,.08);border-radius:.8em;padding:.4em .8em;line-height:1.45;display:flex;flex-direction:column;min-width:0}
.bd .hc b{color:#ffd978}.bd .hc span{font-size:.84em;color:#cfd6ff}
.bd .hc .hic{width:1.9em;height:1.9em;display:block;margin-bottom:.1em}.bd .hc .hic svg{width:100%;height:100%}
.bd .hnote{text-align:center;color:#a9b2ea;font-size:.8em}
.bd .hnav{display:flex;align-items:center;gap:2em;margin-top:.8em}
.bd .hnav button{font-size:3em;font-weight:900;padding:.35em 1.1em;border-radius:1em;background:rgba(255,255,255,.12);color:#fff;border:.05em solid rgba(255,255,255,.3);cursor:pointer}

.bd .bconn{position:absolute;top:0;left:0;right:0;background:#b4232a;text-align:center;font-size:3em;padding:.3em;z-index:20}

  function injectCss() { if (root.document && !root.document.getElementById('bd-css')) { const s = root.document.createElement('style'); s.id = 'bd-css'; s.textContent = CSS; root.document.head.appendChild(s); } }

  function mount(el, opts) {

    }

    // ------------------------------------------------------------ الصوت والراوي
    const later_ = (ms, fn) => { ST.pend.push(setTimeout(() => { if (!ST.destroyed) fn(); }, ms)); };

    const sfx = (n, p) => { if (ST.started && ST.sfxOn && A) A.play(n, p); };
    const say = (t, o) => { ST.log.push(t); if (ST.started && ST.voiceOn && A) A.say(t, o); };
    const revRem = (r) => (r && r.revealAt ? Math.max(0, r.revealAt - (Date.now() + ST.offset)) : 0);
    function deathCue(v) {
      const deaths = (v.dawn && v.dawn.deaths) || [];
      const kd = deaths.filter((d) => d.by !== 'task'), td = deaths.filter((d) => d.by === 'task');
      if (kd.length) { sfx(kd.some((d) => d.by === 'sniper') ? 'gun' : 'stab'); later_(900, () => say(L.dawnDead(kd.map((d) => NAME(v, d.id)).join(' و ')), { key: 'n_dead' })); }
      else if (!td.length) { sfx('chime'); later_(500, () => say(L.dawnNone, { key: 'n_quiet' })); }
      if (td.length) { if (!kd.length) sfx('gavel'); later_(kd.length ? 3600 : 700, () => say(L.dawnIdle(td.map((d) => NAME(v, d.id)).join(' و ')))); }
    }
    function voteCue(v) {
      const r = v.voteResult || {};
      sfx('gavel'); later_(700, () => say(r.eliminated ? L.resOut(NAME(v, r.eliminated)) : (r.tie ? L.resTie : L.resNone), { key: r.eliminated ? 'n_out' : r.tie ? 'n_tie' : 'n_none' }));

        case 'night': if (A && ST.sfxOn) A.ambient('night'); sfx('wolf'); later_(600, () => say(v.mode === 'host' ? L.nightHost : L.night, { pitch: 0.7, rate: 0.85, key: v.mode === 'host' ? 'n_night_h' : 'n_night' })); break;

        case 'vote': sfx('bell'); later_(500, () => say(L.vote, { key: 'n_vote' })); break;

    // الإضاءة الدوّارة على المقاعد أثناء الترقّب (شكل فقط، ما تكشف أي شي)
    function spotPending(v) { return (v.phase === 'dawn' && v.dawn && v.dawn.pending) || (v.phase === 'voteResult' && v.voteResult && v.voteResult.pending); }

    // ------------------------------------------------------------ الرسم

    const SEATS = {};

    function dots(n, on) {

    // ------------------------------------------------------------ شرح اللعبة (صفحات كبيرة للتلفزيون)

<script>/* hub.js */
/* مافيا الديوانية — مركز الغرف (hub): بروتوكول الرسائل + الغرف + المؤقتات، بدون أي شبكة.
 * يشتغل في Node (server.js) وفي المتصفح (النسخة التجريبية) وفي Cloudflare Durable Object لاحقاً.
 * الناقل (WebSocket أو غيره) يعطي كل اتصال كائن conn فيه: send(obj) و close(code).
 *
 * رسائل العميل -> الخادم (JSON):
 *   {t:'create', name, dev?}          إنشاء غرفة (المنشئ هو المضيف)
 *   {t:'join', code, name}            دخول بالرمز
 *   {t:'resume', code, token}         رجوع بعد انقطاع / قفل الجوال
 *   {t:'board', code}                 شاشة عرض عامة (بدون دور)
 *   {t:'act', a, ...}                 a = ready | night{target,kind?} | confirm{on?} | task | vote | voteReady | start | skip | settings | kick | reset | leave
 *                                     (الليل: المافيا تقترح بـnight ثم تؤكد بـconfirm · بقية اللاعبين اللي ما عندهم قدرة ينفذون مهمة ويبلّغون بـtask)
 *                                     وضع المقدّم: hostPick{kind,target} | hostNext | hostTimer{sec}
 *   {t:'ping'}
 * الخادم -> العميل: {t:'joined',code,id,token} | {t:'view',view} | {t:'err',err} | {t:'pong'} | {t:'kicked'} | {t:'left'}
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MafiaHub = factory();

  'use strict';
  const LOBBY_GRACE_MS = 90 * 1000, ROOM_IDLE_MS = 6 * 3600 * 1000, EMPTY_ROOM_MS = 30 * 60 * 1000;

  /* opts: { E (المحرك), rng(), randInt(min,max), token(), now(), wallet, allowDev, maxRooms } */
  function createHub(opts) {
    const E = opts.E, rng = opts.rng, now = opts.now || Date.now, maxRooms = opts.maxRooms || 500;
    const wallet = opts.wallet || { async charge() { return true; } };   // مكان ربط الرصيد: يُخصم قيم واحد من المضيف عند البدء
    const rooms = new Map();

    const newCode = () => { for (let i = 0; i < 50; i++) { const c = String(opts.randInt(1000, 10000)); if (!rooms.has(c)) return c; } return null; };

    function sendViews(room) {
      const t = now();
      room.conns.forEach((c) => { if (!c.closed) c.send({ t: 'view', view: E.viewFor(room.g, c.pid, t) }); });
    }
    function bind(room, conn, pid) {
      // اتصال قديم لنفس اللاعب؟ نقفله
      room.conns.forEach((c) => { if (c !== conn && pid && c.pid === pid) { c.pid = null; room.conns.delete(c); c.close(4000); } });
      conn.code = room.g.code; conn.pid = pid; conn.board = !pid; room.conns.add(conn);

    function closed(conn) {
      const room = conn.code && rooms.get(conn.code); if (!room) return;
      room.conns.delete(conn);
      if (conn.pid && E.byId(room.g, conn.pid)) {
        const still = [...room.conns].some((c) => c.pid === conn.pid);

    function message(conn, m) {
      const t0 = now();
      const err = (e) => conn.send({ t: 'err', err: e });
      switch (m.t) {
        case 'ping': return conn.send({ t: 'pong' });
        case 'create': {
          if (rooms.size >= maxRooms) return err('server_busy');
          const code = newCode(); if (!code) return err('server_busy');

        }
        case 'join': {
          const room = rooms.get(String(m.code || '')); if (!room) return err('no_room');
          const r = E.join(room.g, m.name, t0); if (!r.ok) return err(r.err);
          const tk = opts.token(); room.tokens[tk] = r.id; room.last = t0;

        }

        }
        case 'board': {
          const room = rooms.get(String(m.code || '')); if (!room) return err('no_room');
          bind(room, conn, null); return conn.send({ t: 'view', view: E.viewFor(room.g, null, t0) });
        }
        case 'act': {
          const room = conn.code && rooms.get(conn.code); if (!room || !conn.pid) return err('not_joined');
          const g = room.g, id = conn.pid; let r = { ok: true }; room.last = t0;

            case 'night': r = E.nightAct(g, id, m.target === undefined ? null : m.target, t0, m.kind, rng); break;
            case 'confirm': r = E.nightConfirm(g, id, t0, rng, m.on !== false); break;
            case 'task': r = E.nightTask(g, id, t0, rng); break;
            case 'vote': r = E.vote(g, id, m.target, t0); break;
            case 'voteReady': r = E.voteReady(g, id, t0); break;
            case 'settings': r = E.setSettings(g, id, m.patch || {}); break;
            case 'skip': r = E.skip(g, id, t0, rng); break;
            case 'hostPick': r = E.hostPick(g, id, m.kind, m.target === undefined ? null : m.target); break;
            case 'hostNext': r = E.hostNext(g, id, t0); break;
            case 'hostTimer': r = E.hostTimer(g, id, m.sec, t0); break;
            case 'kick': { const victim = [...room.conns].find((c) => c.pid === m.target); r = E.kick(g, id, m.target); if (r.ok && victim) { victim.pid = null; room.conns.delete(victim); victim.send({ t: 'kicked' }); victim.close(4001); } break; }
            case 'reset': r = E.reset(g, id); break;
            case 'start': {
              if (g.hostId !== id) { r = { ok: false, err: 'not_host' }; break; }
              if (g.phase !== 'lobby') { r = { ok: false, err: 'already_started' }; break; }
              if (E.need(g) > 0) { r = { ok: false, err: 'need_players' }; break; }
              // هنا يُخصم قيم واحد من رصيد المضيف (من الخادم، مو من الجوال).
              Promise.resolve(wallet.charge(room)).then((okc) => {
                if (!okc) { conn.send({ t: 'err', err: 'no_credit' }); return; }
                const rr = E.start(g, id, now(), rng); if (!rr.ok) conn.send({ t: 'err', err: rr.err });

            }
            case 'leave': { r = E.leave(g, id); const tkn = Object.keys(room.tokens).find((k) => room.tokens[k] === id); if (tkn) delete room.tokens[tkn]; conn.pid = null; conn.send({ t: 'left' }); break; }
            default: r = { ok: false, err: 'bad_action' };
          }
          if (!r.ok) err(r.err);
          return sendViews(room);
        }
      }
    }

    // مؤقتات اللعبة + تنظيف الغرف (يُستدعى كل ~500ms)
    function tick() {
      const t = now();
      rooms.forEach((room, code) => {
        const g = room.g; let changed = false;
        try { changed = E.tick(g, t, rng); } catch (e) { if (typeof console !== 'undefined') console.error('tick error', code, e); }
        if (g.phase === 'lobby') Object.keys(room.discAt).forEach((pid) => { if (t - room.discAt[pid] > LOBBY_GRACE_MS) { E.leave(g, pid); delete room.discAt[pid]; changed = true; } });
        if (changed) sendViews(room);
        if ((room.conns.size === 0 && t - room.last > EMPTY_ROOM_MS) || t - room.last > ROOM_IDLE_MS) rooms.delete(code);
      });
    }

    return { rooms, message, closed, tick, sendViews };
  }

  return { createHub };
});

<script>/* loopback.js */
/* مافيا الديوانية — النسخة التجريبية بدون إنترنت: "خادم" داخل الصفحة نفسها + لاعبين بوتات.
 * يحاكي WebSocket بنفس البروتوكول بالضبط (hub.js)، فالواجهة ما تدري إنها مو على خادم حقيقي.
 * المضيف (أنت) تنشئ الغرفة، والبوتات تدخل لوحدها وتلعب (تفتح بطاقتها، تختار بالليل، تصوّت...).
 */
(function (g) {
  'use strict';
  var E = g.MafiaEngine, H = g.MafiaHub;
  var rnd = Math.random;
  var hub = H.createHub({
    E: E, rng: rnd, allowDev: true,
    randInt: function (a, b) { return a + Math.floor(rnd() * (b - a)); },
    token: function () { var s = ''; for (var i = 0; i < 24; i++) s += Math.floor(rnd() * 16).toString(16); return s; }
  });
  setInterval(function () { hub.tick(); }, 500);

  // ------------------------------------------------------------ مقبس وهمي
  function Sock(url) {
    var self = this; self.readyState = 0; self.url = url;
    self.conn = { closed: false, pid: null, code: null, board: false, send: function (o) { self._deliver(o); }, close: function () { self._serverClose(); } };

  }
  Sock.prototype.send = function (text) {
    var self = this; if (self.readyState !== 1) throw new Error('closed');
    var m = JSON.parse(text);
    setTimeout(function () { if (!self.conn.closed) hub.message(self.conn, m); }, 0);
  };
  Sock.prototype._deliver = function (o) {
    var self = this; if (self.readyState !== 1) return;
    var data = JSON.stringify(o);
    setTimeout(function () { if (self.readyState === 1 && self.onmessage) self.onmessage({ data: data }); }, 0);
  };
  Sock.prototype._serverClose = function () { this._shut(); };
  Sock.prototype.close = function () { this._shut(); };
  Sock.prototype._shut = function () {
    var self = this; if (self.conn.closed) return; self.conn.closed = true; self.readyState = 3;
    hub.closed(self.conn);
    setTimeout(function () { if (self.onclose) self.onclose({}); }, 0);
  };
  g.MafiaWS = Sock;

  // ------------------------------------------------------------ البوتات
  var NAMES = ['بدر', 'لمى', 'سلطان', 'هند', 'ياسر', 'جود', 'تركي', 'أروى', 'نواف', 'ريم', 'فهد', 'سارة', 'ماجد', 'دانة', 'خالد', 'نورة', 'عمر', 'غادة', 'زياد', 'منى', 'راكان', 'لجين', 'مشعل', 'ريما', 'سعود', 'وعد', 'طلال', 'جواهر', 'يزيد', 'هيا', 'عبدالله', 'شهد', 'ناصر', 'رهف', 'وليد', 'تالا', 'حمد', 'مها', 'صالح'];
  var pick = function (a) { return a[Math.floor(rnd() * a.length)]; };
  var delay = function (a, b) { return a + rnd() * (b - a); };

  function Bot(code, name) {
    var b = this; b.name = name; b.view = null; b.timer = 0; b.sentFor = '';
    b.sock = new Sock('bot'); b.sock.onopen = function () { b.sock.send(JSON.stringify({ t: 'join', code: code, name: name })); };
    b.sock.onmessage = function (ev) { var m = JSON.parse(ev.data); if (m.t === 'view') { b.view = m.view; b.think(); } };
  }
  Bot.prototype.act = function (o) { try { this.sock.send(JSON.stringify(Object.assign({ t: 'act' }, o))); } catch (e) { } };
  Bot.prototype.think = function () {
    var b = this, v = b.view, me = v && v.me; if (!me) return;
    if (v.phase === 'lobby') { b.sentFor = ''; return; }                      // لعبة جديدة: نبدأ من الصفر
    if (v.mode === 'host' && v.phase !== 'reveal') return;                    // وضع المقدّم: اللاعبين ما عندهم أفعال غير "جاهز"
    var key = v.phase + ':' + v.round + ':' + (me.alive ? 1 : 0); if (b.sentFor === key) return; // مرة وحدة لكل مرحلة
    var role = me.role, mafia = role === 'mafia' || role === 'godfather';
    var alive = v.players.filter(function (p) { return p.alive && p.id !== me.id; });
    if (v.phase === 'reveal' && !me.ready) { b.sentFor = key; b.later(delay(1500, 6000), function () { b.act({ a: 'ready' }); }); }
    else if (v.phase === 'night' && me.alive && me.night && !me.night.done) {
      b.sentFor = key;
      b.later(delay(3000, 9000), function () {
        var n = b.view && b.view.me && b.view.me.night; if (!n || n.done) return;
        if (n.kind === 'task') { b.act({ a: 'task' }); return; }                 // البوت يخلّص مهمته دايم (اللي ما يخلّصها يطلع من اللعبة)
        var opts = n.options.slice(), target = null;

          // يقترح (غالباً يتبنّى اقتراح زميله) ثم يؤكد؛ أحياناً يخالف فتصير قرعة
          var team = (n.teamPicks || []).filter(function (t) { return t.target && t.id !== me.id; });

          if (rnd() < 0.92) b.later(delay(1200, 3500), function () { b.act({ a: 'confirm' }); });
        } else {
          if (n.kind === 'investigate') {
            var seen = (me.notes || []).map(function (x) { return x.target; });
            var fresh = opts.filter(function (o) { return seen.indexOf(o) < 0; }); target = pick(fresh.length ? fresh : opts);
          } else if (n.kind === 'protect' || n.kind === 'guard') target = pick(opts);
          else if (n.kind === 'snipe') target = null;       // القناص البوت يحتفظ برصاصته
          b.act({ a: 'night', target: target });
        }
        if (n.extra && n.extra.options.length) b.later(delay(600, 1800), function () { b.act({ a: 'night', kind: 'silence', target: pick(n.extra.options) }); });
      });
    }
    else if (v.phase === 'day' && me.alive && !me.voteReady) { b.sentFor = key; b.later(delay(9000, 40000), function () { b.act({ a: 'voteReady' }); }); }
    else if (v.phase === 'vote' && me.alive && me.myVote == null && !me.voidVote) {
      b.sentFor = key;
      b.later(delay(4000, 14000), function () {
        var cur = b.view; if (!cur || cur.phase !== 'vote') return;
        var al = cur.players.filter(function (p) { return p.alive && p.id !== me.id; });
        var cand = al; var found = (me.notes || []).filter(function (x) { return x.mafia; }).map(function (x) { return x.target; });
        var t;
        if (mafia) { var town = al.filter(function (p) { return !(cur.me.team || []).some(function (m) { return m.id === p.id; }); }); t = pick(town.length ? town : al); }
        else { var hit = al.filter(function (p) { return found.indexOf(p.id) >= 0; }); t = hit.length ? hit[0] : pick(cand); }
        if (t) b.act({ a: 'vote', target: t.id });
      });
    }
  };
  Bot.prototype.later = function (ms, fn) { setTimeout(fn, ms); };

  // بوتات لكل غرفة جديدة ينشئها اللاعب البشري
  var seen = {};
  function wantBots() { var m = /[?&]bots=(\d+)/.exec(g.location && g.location.search || ''); return m ? Math.max(2, Math.min(59, Number(m[1]))) : 6; }
  setInterval(function () {
    hub.rooms.forEach(function (room, code) {
      if (seen[code]) return; seen[code] = true;
      var names = NAMES.slice().sort(function () { return rnd() - 0.5; }), n = wantBots();
      for (var i = 0; i < n; i++) (function (i) { setTimeout(function () { var r = hub.rooms.get(code); if (r && r.g.phase === 'lobby') new Bot(code, names[i % names.length] + (i >= names.length ? ' ' + (i + 1) : '')); }, 900 + i * 700); })(i);
    });
  }, 400);
})(typeof window !== 'undefined' ? window : globalThis);

      case 'tryclose': HS.prac = null; renderHelp(true); break;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var t = e.target; if (t && t.id === 'inName') { var b = document.querySelector('[data-a="join"]'); b && b.click(); } if (t && t.id === 'inName2') { var b2 = document.querySelector('[data-a="create"]'); b2 && b2.click(); } } });

  var DB = { board: null };
  function setTab(t) { document.body.classList.toggle('show-board', t === 'board'); document.body.classList.toggle('show-both', t === 'both'); var bs = document.querySelectorAll('.tabs button'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-tab') === t); if ((t === 'board' || t === 'both') && DB.board) setTimeout(function () { DB.board.redraw(); }, 30); }
  function demoBoard(code) {
    if (!window.MAFIA_DEMO || DB.board || !window.MafiaBoard) return;
    var bh = document.getElementById('board'); bh.className = 'bd-host'; DB.board = window.MafiaBoard.mount(bh, { code: code }); DB.board.enableSound();
    var t = document.createElement('div'); t.className = 'tabs'; t.innerHTML = '<button class="on" data-tab="phone">جوالي</button><button data-tab="board">الطاولة (التلفزيون)</button>' + (window.innerWidth >= 900 ? '<button data-tab="both">الاثنين معاً</button>' : ''); document.body.appendChild(t);
    t.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setTab(b.getAttribute('data-tab')); });
  }
  window.__tg = TG; window.__tgp = TGP; window.__help = HS; window.__mountTask = function (task) { return mountTask(task, TG); }; window.__mafia = ST; window.__roleCard = roleCard; window.__setTab = setTab;          // للاختبار
  if (window.MAFIA_DEMO) { document.body.classList.add('is-demo'); var db = document.createElement('div'); db.className = 'demo'; db.textContent = 'نسخة تجريبية بدون إنترنت — باقي اللاعبين بوتات'; document.body.appendChild(db); }
  render(); connect();
})();
</script>

<style>
.dw-FloatingAudioBar {
  position: fixed; bottom: 12px; left: 12px; z-index: 9999;
  display: inline-flex; gap: 6px; background: rgba(10, 15, 36, 0.92);
  border: 1px solid rgba(245, 185, 66, 0.45); border-radius: 999px;
  padding: 5px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  font-family: -apple-system, "Tajawal", "Cairo", sans-serif;
}
.dw-FloatingAudioBar button {
  padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.08); color: #F8FAFC; font-size: 12px; font-weight: 800;
  cursor: pointer;
}
.dw-FloatingAudioBar button.off {
  opacity: 0.55; background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.45);
}
</style>
<script>
(function(){
  window.__DW_VOICE_ON = true;
  window.__DW_SFX_ON = true;
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var sfxCtx = null;
  function playPremiumClick(freq) {
    if (!window.__DW_SFX_ON || !AudioCtx) return;
    try {
      if (!sfxCtx) sfxCtx = new AudioCtx();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
      var o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq || 560, sfxCtx.currentTime);
      g.gain.setValueAtTime(0.06, sfxCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.075);
      o.connect(g); g.connect(sfxCtx.destination);
      o.start(); o.stop(sfxCtx.currentTime + 0.075);
    } catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    var bar = document.createElement('div');
    bar.className = 'dw-FloatingAudioBar';
    bar.innerHTML =
      '<button id="dwFlVoiceBtn" type="button">🔊 الصوت: مفعّل</button>' +
      '<button id="dwFlSfxBtn" type="button">🎵 المؤثرات: مفعّلة</button>';
    document.body.appendChild(bar);
    var vBtn = document.getElementById('dwFlVoiceBtn');
    var sBtn = document.getElementById('dwFlSfxBtn');
    vBtn.addEventListener('click', function(){
      window.__DW_VOICE_ON = !window.__DW_VOICE_ON;
      vBtn.textContent = window.__DW_VOICE_ON ? '🔊 الصوت: مفعّل' : '🔇 الصوت: مغلق';
      vBtn.classList.toggle('off', !window.__DW_VOICE_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('voice', window.__DW_VOICE_ON);
      if (!window.__DW_VOICE_ON && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
    });
    sBtn.addEventListener('click', function(){
      window.__DW_SFX_ON = !window.__DW_SFX_ON;
      sBtn.textContent = window.__DW_SFX_ON ? '🎵 المؤثرات: مفعّلة' : '🔕 المؤثرات: مغلقة';
      sBtn.classList.toggle('off', !window.__DW_SFX_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('sfx', window.__DW_SFX_ON);
      if (window.__DW_SFX_ON) playPremiumClick(660);
    });
    document.addEventListener('click', function(ev){
      if (ev.target && ev.target.closest && ev.target.closest('button')) playPremiumClick(540);
    }, true);
  });
})();
</script>


<script>
(function(){
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'DW_AUDIO_SYNC') {
      window.__DW_VOICE_ON = !!d.voiceOn;
      window.__DW_SFX_ON = !!d.sfxOn;
      if (!d.voiceOn && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    }
  });
})();
</script>
