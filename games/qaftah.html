<style>

});

<script>/* hub.js */
/* ديوانية بلس مافيا — مركز الغرف (hub): بروتوكول الرسائل + الغرف + المؤقتات، بدون أي شبكة.
 * يشتغل في Node (server.js) وفي المتصفح (النسخة التجريبية) وفي Cloudflare Durable Object لاحقاً.
 * الناقل (WebSocket أو غيره) يعطي كل اتصال كائن conn فيه: send(obj) و close(code).
 *
 * رسائل العميل -> الخادم (JSON):
 *   {t:'create', name, dev?}          إنشاء غرفة (المنشئ هو المضيف)
 *   {t:'join', code, name}            دخول بالرمز
 *   {t:'resume', code, token}         رجوع بعد انقطاع / قفل الجوال
 *   {t:'board', code}                 شاشة عرض عامة (بدون دور)
 *   {t:'act', a, ...}                 a = ready | night{target,kind?} | confirm{on?} | task | vote | voteReady | start | skip | settings | kick | reset | leave
 *                                     (الليل: المافيا تقترح بـnight ثم تؤكد بـconfirm · بقية اللاعبين اللي ما عندهم قدرة ينفذون مهمة ويبلّغون بـtask)
 *                                     وضع المقدّم: hostPick{kind,target} | hostNext | hostTimer{sec}
 *   {t:'ping'}
 * الخادم -> العميل: {t:'joined',code,id,token} | {t:'view',view} | {t:'err',err} | {t:'pong'} | {t:'kicked'} | {t:'left'}
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MafiaHub = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const LOBBY_GRACE_MS = 90 * 1000, ROOM_IDLE_MS = 6 * 3600 * 1000, EMPTY_ROOM_MS = 30 * 60 * 1000;

  /* opts: { E (المحرك), rng(), randInt(min,max), token(), now(), wallet, allowDev, maxRooms } */
  function createHub(opts) {
    const E = opts.E, rng = opts.rng, now = opts.now || Date.now, maxRooms = opts.maxRooms || 500;
    const wallet = opts.wallet || { async charge() { return true; } };   // مكان ربط الرصيد: يُخصم قيم واحد من المضيف عند البدء
    const rooms = new Map();

    const newCode = () => { for (let i = 0; i < 50; i++) { const c = String(opts.randInt(1000, 10000)); if (!rooms.has(c)) return c; } return null; };

    function sendViews(room) {
      const t = now();
      room.conns.forEach((c) => { if (!c.closed) c.send({ t: 'view', view: E.viewFor(room.g, c.pid, t) }); });
    }
    function bind(room, conn, pid) {
      // اتصال قديم لنفس اللاعب؟ نقفله
      room.conns.forEach((c) => { if (c !== conn && pid && c.pid === pid) { c.pid = null; room.conns.delete(c); c.close(4000); } });
      conn.code = room.g.code; conn.pid = pid; conn.board = !pid; room.conns.add(conn);
      if (pid) { E.setConnected(room.g, pid, true); delete room.discAt[pid]; }
    }
    function closed(conn) {
      const room = conn.code && rooms.get(conn.code); if (!room) return;
      room.conns.delete(conn);
      if (conn.pid && E.byId(room.g, conn.pid)) {
        const still = [...room.conns].some((c) => c.pid === conn.pid);
        if (!still) { E.setConnected(room.g, conn.pid, false); room.discAt[conn.pid] = now(); sendViews(room); }
      }
    }

    function message(conn, m) {
      const t0 = now();
      const err = (e) => conn.send({ t: 'err', err: e });
      switch (m.t) {
        case 'ping': return conn.send({ t: 'pong' });
        case 'create': {
          if (rooms.size >= maxRooms) return err('server_busy');
          const code = newCode(); if (!code) return err('server_busy');
          const g = E.createGame(code, { minPlayers: m.dev && opts.allowDev ? 3 : 5 });
          const room = { g, conns: new Set(), tokens: {}, discAt: {}, created: t0, last: t0 };
          const r = E.join(g, m.name, t0); if (!r.ok) return err(r.err);
          rooms.set(code, room); const tk = opts.token(); room.tokens[tk] = r.id;
          bind(room, conn, r.id); conn.send({ t: 'joined', code, id: r.id, token: tk }); return sendViews(room);
        }
        case 'join': {
          const room = rooms.get(String(m.code || '')); if (!room) return err('no_room');
          const r = E.join(room.g, m.name, t0); if (!r.ok) return err(r.err);
          const tk = opts.token(); room.tokens[tk] = r.id; room.last = t0;
          bind(room, conn, r.id); conn.send({ t: 'joined', code: room.g.code, id: r.id, token: tk }); return sendViews(room);
        }
        case 'resume': {
          const room = rooms.get(String(m.code || '')); if (!room) return err('no_room');
          const pid = room.tokens[String(m.token || '')]; if (!pid || !E.byId(room.g, pid)) return err('bad_token');
          bind(room, conn, pid); conn.send({ t: 'joined', code: room.g.code, id: pid, token: m.token, resumed: true }); return sendViews(room);
        }
        case 'board': {
          const room = rooms.get(String(m.code || '')); if (!room) return err('no_room');
          bind(room, conn, null); return conn.send({ t: 'view', view: E.viewFor(room.g, null, t0) });
        }
        case 'act': {
          const room = conn.code && rooms.get(conn.code); if (!room || !conn.pid) return err('not_joined');
          const g = room.g, id = conn.pid; let r = { ok: true }; room.last = t0;
          // محرك عام (مثل المستشار السري): كل أفعال اللعب تروح لـ E.act، ما عدا الطرد والبدء والخروج (لها شغل اتصالات هنا)

          switch (m.a) {
            case 'ready': r = E.ready(g, id, t0); break;
            case 'night': r = E.nightAct(g, id, m.target === undefined ? null : m.target, t0, m.kind, rng); break;
            case 'confirm': r = E.nightConfirm(g, id, t0, rng, m.on !== false); break;
            case 'task': r = E.nightTask(g, id, t0, rng); break;
            case 'vote': r = E.vote(g, id, m.target, t0); break;
            case 'voteReady': r = E.voteReady(g, id, t0); break;
            case 'settings': r = E.setSettings(g, id, m.patch || {}); break;
            case 'skip': r = E.skip(g, id, t0, rng); break;
            case 'hostPick': r = E.hostPick(g, id, m.kind, m.target === undefined ? null : m.target); break;
            case 'hostNext': r = E.hostNext(g, id, t0); break;
            case 'hostTimer': r = E.hostTimer(g, id, m.sec, t0); break;
            case 'kick': { const victim = [...room.conns].find((c) => c.pid === m.target); r = E.kick(g, id, m.target); if (r.ok && victim) { victim.pid = null; room.conns.delete(victim); victim.send({ t: 'kicked' }); victim.close(4001); } break; }
            case 'reset': r = E.reset(g, id); break;
            case 'start': {
              if (g.hostId !== id) { r = { ok: false, err: 'not_host' }; break; }
              if (g.phase !== 'lobby') { r = { ok: false, err: 'already_started' }; break; }
              if (E.need(g) > 0) { r = { ok: false, err: 'need_players' }; break; }
              // هنا يُخصم قيم واحد من رصيد المضيف (من الخادم، مو من الجوال).
              Promise.resolve(wallet.charge(room)).then((okc) => {
                if (!okc) { conn.send({ t: 'err', err: 'no_credit' }); return; }
                const rr = E.start(g, id, now(), rng); if (!rr.ok) conn.send({ t: 'err', err: rr.err });
                sendViews(room);

              return;
            }
            case 'leave': { r = E.leave(g, id); const tkn = Object.keys(room.tokens).find((k) => room.tokens[k] === id); if (tkn) delete room.tokens[tkn]; conn.pid = null; conn.send({ t: 'left' }); break; }
            default: r = { ok: false, err: 'bad_action' };
          }
          if (!r.ok) err(r.err);
          return sendViews(room);
        }
      }
    }

    // مؤقتات اللعبة + تنظيف الغرف (يُستدعى كل ~500ms)
    function tick() {
      const t = now();
      rooms.forEach((room, code) => {
        const g = room.g; let changed = false;
        try { changed = E.tick(g, t, rng); } catch (e) { if (typeof console !== 'undefined') console.error('tick error', code, e); }
        if (g.phase === 'lobby') Object.keys(room.discAt).forEach((pid) => { if (t - room.discAt[pid] > LOBBY_GRACE_MS) { E.leave(g, pid); delete room.discAt[pid]; changed = true; } });
        if (changed) sendViews(room);
        if ((room.conns.size === 0 && t - room.last > EMPTY_ROOM_MS) || t - room.last > ROOM_IDLE_MS) rooms.delete(code);
      });
    }

    return { rooms, message, closed, tick, sendViews };
  }

  return { createHub };
});

</script>

    const usedNorms = new Set([norm(q.truth)]);
    const byNorm = new Map();
    const list = [{ id: 'c_truth', text: q.truth, truth: true, authors: [], decoy: false }];

    Object.keys(g.lies).forEach((pid) => {
      const t = g.lies[pid], nt = norm(t);
      if (byNorm.has(nt)) {
        byNorm.get(nt).authors.push(pid);
      } else {
        usedNorms.add(nt);
        const ch = { id: 'c_' + pid, text: t, truth: false, authors: [pid], decoy: false };
        byNorm.set(nt, ch);
        list.push(ch);
      }
    });

    const decoys = shuffle(q.decoys || [], rng);
    for (let i = 0; i < decoys.length && list.length < 4; i++) {
      const dn = norm(decoys[i]);
      if (!usedNorms.has(dn)) {
        usedNorms.add(dn);
        list.push({ id: 'c_decoy_' + i, text: decoys[i], truth: false, authors: [], decoy: true });
      }
    }
    g.choices = shuffle(list, rng);
    g.votes = {};
    setPhase(g, 'vote', now, actMs(g));
  }

  // ---------------------------------------------------------------- التصويت
  function submitVote(g, id, choiceId, now) {
    if (g.phase !== 'vote') return fail('bad_phase');
    const p = byId(g, id); if (!p) return fail('no_player');
    const ch = g.choices.find((c) => c.id === choiceId);
    if (!ch) return fail('bad_choice');
    if (ch.authors.indexOf(id) >= 0) return fail('own_lie');
    g.votes[id] = choiceId;
    if (g.players.filter((x) => x.connected).every((x) => g.votes[x.id])) resolveVotes(g, now);
    return ok();
  }

  function resolveVotes(g, now) {
    const truthPts = 1000 * g.mult, liePts = 500 * g.mult;
    const steps = [];
    const fooledChoices = g.choices.filter((c) => !c.truth && g.players.some((p) => g.votes[p.id] === c.id));
    fooledChoices.sort((a, b) => {
      const va = g.players.filter((p) => g.votes[p.id] === a.id).length;
      const vb = g.players.filter((p) => g.votes[p.id] === b.id).length;
      return vb - va; // Most victims first when shown in unified summary!
    });

    fooledChoices.forEach((ch) => {
      const victims = g.players.filter((p) => g.votes[p.id] === ch.id).map((p) => p.id);
      const pts = ch.decoy ? 0 : victims.length * liePts;
      if (!ch.decoy) {
        ch.authors.forEach((aid) => {
          const ap = byId(g, aid);
          if (ap) { ap.score += pts; ap.fooled += victims.length; }
        });
      }
      steps.push({
        id: ch.id, text: ch.text, truth: false, decoy: ch.decoy,
        authors: ch.authors, victims, pts
      });
      if (!ch.decoy && ch.authors.length) {
        ev(g, { k: 'trap', author: ch.authors[0], victims, text: ch.text, pts });
      }
    });

    const cappedTraps = steps.length > 8 ? steps.slice(0, 8) : steps;

    // The Real Truth!
    const truthCh = g.choices.find((c) => c.truth);
    const winners = g.players.filter((p) => g.votes[p.id] === truthCh.id).map((p) => p.id);
    winners.forEach((wid) => {
      const wp = byId(g, wid);
      if (wp) { wp.score += truthPts; wp.truths++; }
    });
    const truthStep = {
      id: truthCh.id, text: truthCh.text, truth: true, decoy: false,
      authors: [], victims: winners, pts: truthPts, info: g.q.info
    };
    ev(g, { k: 'truth', text: truthCh.text, winners, pts: truthPts });

    // For step-by-step mode, traps come first then truth last; for instant mode, truth is shown right at the top with all traps and scores!
    const stepList = cappedTraps.slice().reverse().concat([truthStep]);
    g.revealSteps = stepList;
    g.revealIdx = 0;

    if (g.settings.revealMode === 'step' && stepList.length > 1) {
      setPhase(g, 'reveal', now, STEP_MS);
    } else {
      g.revealIdx = stepList.length - 1;
      setPhase(g, 'scores', now, 0);
    }
  }

  function likeLie(g, id, choiceId) {
    if (g.phase !== 'reveal' && g.phase !== 'scores') return fail('bad_phase');
    if (g.likes[id]) return fail('already_liked');
    const ch = g.choices.find((c) => c.id === choiceId);
    if (!ch || ch.truth || ch.decoy || ch.authors.indexOf(id) >= 0) return fail('bad_choice');
    g.likes[id] = choiceId;
    ch.authors.forEach((aid) => {
      const ap = byId(g, aid);
      if (ap) { ap.score += 100; ap.likes++; }
    });
    return ok();
  }

  function skipToScores(g, now) {
    g.revealIdx = Math.max(0, g.revealSteps.length - 1);
    setPhase(g, 'scores', now, 0);
  }

  function advanceRevealOrNext(g, now, rng) {
    if (g.phase === 'reveal') {
      if (g.revealIdx < g.revealSteps.length - 1) {
        g.revealIdx++;
        setPhase(g, 'reveal', now, STEP_MS);
        return;
      }
      setPhase(g, 'scores', now, 0);
      return;
    }
    if (g.phase === 'scores') {
      if (g.round >= g.totalRounds) {
        const sorted = g.players.slice().sort((a, b) => b.score - a.score);
        g.winner = { id: sorted[0] ? sorted[0].id : null };
        ev(g, { k: 'end', winner: g.winner.id });
        setPhase(g, 'ended', now, 0);
      } else {
        beginRound(g, now, rng);
      }
    }
  }

  function auto(g, now, rng) {
    rng = rng || RNG;
    if (g.phase === 'write') return startVotePhase(g, now, rng);
    if (g.phase === 'vote') return resolveVotes(g, now);
    if (g.phase === 'reveal' || g.phase === 'scores') return advanceRevealOrNext(g, now, rng);
  }

  function tick(g, now, rng) {
    if (g.deadline && now >= g.deadline && g.phase !== 'lobby' && g.phase !== 'ended') {
      auto(g, now, rng);
      return true;
    }
    return false;
  }

  function skip(g, id, now, rng) {
    if (g.hostId !== id) return fail('not_host');
    if (g.phase === 'lobby' || g.phase === 'ended') return fail('bad_phase');
    if (g.phase === 'reveal') { skipToScores(g, now); return ok(); }
    auto(g, now, rng);
    return ok();
  }

  function reset(g, id) {
    if (g.hostId !== id) return fail('not_host'); if (g.phase !== 'ended') return fail('bad_phase');
    g.players = g.players.filter((p) => p.connected);
    if (!g.players.some((p) => p.id === g.hostId)) g.hostId = g.players.length ? g.players[0].id : null;
    g.players.forEach((p) => { p.score = 0; p.fooled = 0; p.truths = 0; p.likes = 0; });
    Object.assign(g, { phase: 'lobby', round: 0, deadline: null, timerTotal: null, winner: null, q: null, lies: {}, choices: [], votes: {}, likes: {}, revealSteps: [], revealIdx: 0 });
    return ok();
  }

  function act(g, id, m, now, rng) {
    switch (m.a) {
      case 'lie': return submitLie(g, id, m.text, now, rng);
      case 'vote': return submitVote(g, id, m.target, now);
      case 'like': return likeLie(g, id, m.target);
      case 'skipReveal': if (g.hostId !== id) return fail('not_host'); skipToScores(g, now); return ok();
      case 'next': if (g.hostId !== id) return fail('not_host'); advanceRevealOrNext(g, now, rng); return ok();
      case 'settings': return setSettings(g, id, m.patch || {});
      case 'skip': return skip(g, id, now, rng);
      case 'reset': return reset(g, id);
      case 'again': { const r = reset(g, id); if (!r.ok) return r; return start(g, id, now, rng); }
    }
    return fail('bad_action');
  }

  function viewFor(g, pid, now) {
    const me = pid ? byId(g, pid) : null;
    const players = g.players.map((p) => ({
      id: p.id, name: p.name, color: p.color, connected: p.connected, host: p.id === g.hostId,
      score: p.score, fooled: p.fooled, truths: p.truths, likes: p.likes,
      wrote: g.phase === 'write' ? !!g.lies[p.id] : undefined,
      voted: g.phase === 'vote' ? !!g.votes[p.id] : undefined
    }));

    const publicChoices = (g.phase === 'vote' || g.phase === 'reveal' || g.phase === 'scores')
      ? g.choices.map((c) => ({
          id: c.id, text: c.text,
          mine: me ? c.authors.indexOf(me.id) >= 0 : false,
          canLike: (g.phase === 'reveal' || g.phase === 'scores') && !c.truth && !c.decoy && (!me || c.authors.indexOf(me.id) < 0)
        }))
      : [];

    const curStep = (g.phase === 'reveal' && g.revealSteps[g.revealIdx]) ? g.revealSteps[g.revealIdx] : null;
    const shownSteps = (g.phase === 'reveal') ? g.revealSteps.slice(0, g.revealIdx + 1) : (g.phase === 'scores' ? g.revealSteps : []);

    const v = {
      now, code: g.code, phase: g.phase, round: g.round, totalRounds: g.totalRounds, mult: g.mult,
      settings: g.settings, untimed: !g.settings.actSec, deadline: g.deadline, timerTotal: g.timerTotal,
      minPlayers: MIN_PLAYERS, maxPlayers: MAX_PLAYERS, need: need(g), players,
      wroteCount: g.phase === 'write' ? Object.keys(g.lies).length : 0,
      votedCount: g.phase === 'vote' ? Object.keys(g.votes).length : 0,
      q: g.q ? { id: g.q.id, cat: g.q.cat, q: g.q.q } : null,
      choices: publicChoices,
      curStep, shownSteps,
      revealIdx: g.revealIdx, revealTotal: g.revealSteps.length,
      events: g.events.slice(-30), winner: g.winner
    };

    if (me) {
      v.me = {
        id: me.id, host: me.id === g.hostId, score: me.score,
        myLie: g.lies[me.id] || null,
        myVote: g.votes[me.id] || null,
        myLike: g.likes[me.id] || null
      };
    }
    return v;
  }

  return {
    ACT_OPTIONS, ROUND_OPTIONS, REVEAL_OPTIONS, CAT_OPTIONS, MIN_PLAYERS, MAX_PLAYERS, QUESTIONS,
    createGame, join, leave, kick, setConnected, setSettings, need, start,
    submitLie, submitVote, likeLie, skip, reset, tick, act, viewFor, byId, norm
  };
});
</script>

<script>/* qf/loopback.js */
/* ديوانية بلس — قفطة!: النسخة التجريبية بدون إنترنت — خادم محلي فوري + دعم إضافة حتى 50+ بوت */
(function (g) {

  var E = g.QFEngine, H = g.MafiaHub, rnd = Math.random;
  var hub = H.createHub({
    E: E, rng: rnd, allowDev: true,
    randInt: function (a, b) { return a + Math.floor(rnd() * (b - a)); },

  });

  function Sock(url) {

    setTimeout(function () { if (!self.conn.closed && self.onopen) self.onopen({}); }, 0);
  }

  };

  };

    'بدر', 'لمى', 'سلطان', 'هند', 'ياسر', 'جود', 'تركي', 'أروى', 'نواف', 'ريم',
    'فهد', 'سارة', 'ماجد', 'دانة', 'طلال', 'غادة', 'وليد', 'مها', 'فيصل', 'نورة',

    'منظار ليلي عسكري', 'خريطة ورقية مقطوعة', 'فانوس غاز قديم', 'مكبر صوت يدوي'

    });
  }, 300);
})(typeof window !== 'undefined' ? window : globalThis);

    out += '<div class="grid"><div class="card ctr"><div class="mut small">ملك الفخاخ</div><div class="big" style="margin-top:4px">' + (topFox ? esc(topFox.name) : '—') + '</div><div class="small" style="color:var(--gold)">خدع ' + AR(topFox ? topFox.fooled : 0) + ' لاعبين</div></div><div class="card ctr"><div class="mut small">صائد الحقيقة</div><div class="big" style="margin-top:4px">' + (topDet ? esc(topDet.name) : '—') + '</div><div class="small" style="color:var(--green)">كشف ' + AR(topDet ? topDet.truths : 0) + ' حقائق</div></div></div>';
    out += '<div class="card col"><div class="big">الترتيب النهائي (' + AR(sorted.length) + ' لاعب)</div><div class="plist">' + sorted.map(function (p, i) {
      return '<div class="pl">' + av(p) + '<b>' + AR(i + 1) + '. ' + esc(p.name) + '</b><span class="sp"></span><span class="chip on">' + AR(p.score) + ' نقطة</span></div>';
    }).join('') + '</div></div>';
    if (me && me.host) out += '<button class="btn gold" data-a="again">لعبة جديدة بنفس اللاعبين</button><button class="btn sec" data-a="reset">رجوع للوبي</button>';
    return out;
  }

  function render() {
    var v = ST.view, html;
    if (!v) html = home();
    else if (v.phase === 'lobby') html = lobby(v);
    else if (v.phase === 'ended') html = ended(v);
    else html = game(v);
    var focus = document.activeElement && document.activeElement.id, keep = {};
    ['inCode', 'inName', 'inName2', 'inLie'].forEach(function (k) { var x = document.getElementById(k); if (x) keep[k] = x.value; });
    $app.innerHTML = html;
    Object.keys(keep).forEach(function (k) { var x = document.getElementById(k); if (x && keep[k]) x.value = keep[k]; });
    if (focus) { var f = document.getElementById(focus); if (f) f.focus(); }
    renderOverlay();
  }

  function renderOverlay() {
    var out = '';
    if (ST.me && !ST.open) out += '<div class="conn">الاتصال مقطوع… نحاول نرجّعه</div>';
    if (ST.toast) out += '<div class="toast">' + esc(ST.toast) + '</div>';
    $ov.innerHTML = out;
  }

  setInterval(function () {
    var v = ST.view; if (!v || !v.deadline) return;
    var t = document.querySelector('[data-timer]'), b = document.querySelector('[data-bar]');
    if (t) t.textContent = fmt(remaining(v)); if (b) b.style.width = Math.round(100 * remaining(v) / (v.timerTotal || 1)) + '%';
  }, 250);

  var HS = { sec: 'idea' };
  function openHelp(s) { HS.sec = s || HS.sec; $help.classList.add('on'); renderHelp(); }
  function renderHelp() {
    var S = HELP.SECTIONS.filter(function (x) { return x.id === HS.sec; })[0] || HELP.SECTIONS[0], body = '';
    if (S.lead) body += '<div class="lead">' + esc(S.lead) + '</div>';
    if (S.kind === 'list') body += '<ul class="pts">' + S.points.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    if (S.kind === 'steps') body += S.steps.map(function (st, i) { return '<div class="stp"><span class="n">' + AR(i + 1) + '</span><div class="tx"><b>' + esc(st.h) + '</b>' + esc(st.t) + '</div></div>'; }).join('');
    if (S.note) body += '<div class="note">' + esc(S.note) + '</div>';
    var i = HELP.SECTIONS.indexOf(S), nx = HELP.SECTIONS[i + 1];
    $help.innerHTML = '<div class="hp"><div class="row"><div class="big sp">شرح اللعبة</div><button class="btn sec sm" data-a="helpclose">إغلاق ✕</button></div><div class="htabs">' + HELP.SECTIONS.map(function (x) { return '<button class="chip ' + (x.id === S.id ? 'on' : '') + '" data-a="helptab" data-s="' + x.id + '">' + esc(x.short) + '</button>'; }).join('') + '</div><div class="big">' + esc(S.title) + '</div>' + body +
      (nx ? '<button class="btn" data-a="helptab" data-s="' + nx.id + '">التالي: ' + esc(nx.short) + '</button>' : '<button class="btn gold" data-a="helpclose">فهمت، يلا نلعب</button>') + '</div>';
    $help.scrollTop = 0;
  }

  document.addEventListener('click', function (e) {
    var raw = e.target;
    var baseEl = raw && raw.nodeType === 1 ? raw : (raw && raw.parentElement ? raw.parentElement : null);
    var el = baseEl && baseEl.closest ? baseEl.closest('[data-a]') : null; if (!el) return;
    var a = el.getAttribute('data-a'), v = ST.view, id = el.getAttribute('data-id');
    var val = function (i) { var x = document.getElementById(i); return x ? x.value.trim() : ''; };
    switch (a) {
      case 'mute': toggleMute(); break;
      case 'create': {
        if (!ST.muted) { try { if (window.MafiaAudio) window.MafiaAudio.unlock(); } catch (err) {} }
        var n = val('inName2') || val('inName') || store.get('qf_name') || '';
        store.set('qf_name', n);
        send({ t: 'create', name: n });
        break;
      }
      case 'join': {
        if (!ST.muted) { try { if (window.MafiaAudio) window.MafiaAudio.unlock(); } catch (err) {} }
        var c = val('inCode'), n2 = val('inName') || val('inName2') || store.get('qf_name') || 'لاعب';
        if (!/^\d{4}$/.test(c)) return toast('اكتب رمز الغرفة (٤ أرقام)');
        store.set('qf_name', n2);
        send({ t: 'join', code: c, name: n2 });
        break;
      }
      case 'addbots': {
        if (v && window.QFSpawnBots) {
          var cnt = Number(el.getAttribute('data-n') || 1);
          var added = window.QFSpawnBots(v.code, cnt);
          if (added > 0) toast('أضفنا ' + AR(added) + ' بوت للغرفة!');
          else toast('الغرفة وصلت للحد الأقصى (' + AR(v.maxPlayers || 60) + ' لاعب)');
        }
        break;
      }
      case 'fill50': {
        if (v && window.QFSpawnBots) {
          var need50 = Math.max(0, 50 - v.players.length);
          if (need50 <= 0) { toast('في الغرفة الحين ' + AR(v.players.length) + ' لاعب!'); break; }
          var added50 = window.QFSpawnBots(v.code, need50);
          if (added50 > 0) toast('جاري دخول ' + AR(added50) + ' بوت ليصل العدد إلى ٥٠ لاعباً!');
        }
        break;
      }
      case 'leave': act('leave'); break;
      case 'share': { var u = qrFor(v.code).link; if (navigator.share) navigator.share({ title: 'قفطة!', text: 'ادخل غرفتنا: ' + v.code, url: u }).catch(function () {}); else if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast('نسخنا الرابط'); }); break; }
      case 'boardlink': ST.ui.board = !ST.ui.board; render(); break;
      case 'copyboard': if (navigator.clipboard) navigator.clipboard.writeText(el.getAttribute('data-u')).then(function () { toast('نسخنا رابط الشاشة'); }); break;
      case 'kick': if (ST.ui.kick === id) { ST.ui.kick = null; act('kick', { target: id }); } else { ST.ui.kick = id; render(); setTimeout(function () { if (ST.ui.kick === id) { ST.ui.kick = null; render(); } }, 3000); } break;
      case 'actsec': act('settings', { patch: { actSec: Number(el.getAttribute('data-s')) } }); break;
      case 'setrounds': act('settings', { patch: { rounds: Number(el.getAttribute('data-r')) } }); break;
      case 'setcat': act('settings', { patch: { cat: el.getAttribute('data-c') } }); break;
      case 'setrev': act('settings', { patch: { revealMode: el.getAttribute('data-m') } }); break;
      case 'start': act('start'); break;
      case 'skip': act('skip'); break;
      case 'skipReveal': act('skipReveal'); break;
      case 'sendlie': { var lt = val('inLie'); act('lie', { text: lt }); break; }
      case 'sel': ST.ui.sel = ST.ui.sel === id ? null : id; render(); break;
      case 'vote': if (ST.ui.sel) act('vote', { target: ST.ui.sel }); break;
      case 'like': act('like', { target: id }); break;
      case 'next': act('next'); break;
      case 'again': act('again'); break;
      case 'reset': act('reset'); break;
      case 'help': openHelp(el.getAttribute('data-s')); break;
      case 'helpclose': $help.classList.remove('on'); break;
      case 'helptab': HS.sec = el.getAttribute('data-s'); renderHelp(); break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var t = e.target;
      if (t && t.id === 'inName') { var b = document.querySelector('[data-a="join"]'); b && b.click(); }
      if (t && t.id === 'inName2') { var b2 = document.querySelector('[data-a="create"]'); b2 && b2.click(); }
      if (t && t.id === 'inLie') { var b3 = document.querySelector('[data-a="sendlie"]'); b3 && b3.click(); }
    }
  });

  var DB = { board: null };
  function setTab(t) {
    document.body.classList.toggle('show-board', t === 'board');
    document.body.classList.toggle('show-both', t === 'both');
    var bs = document.querySelectorAll('.tabs button[data-tab]');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-tab') === t);
    if (DB.board && DB.board.fit) setTimeout(DB.board.fit, 30);
  }
  function demoBoard(code) {
    if (!window.QF_DEMO || !window.QFBoard) return;
    if (DB.board) {
      if (DB.board.setCode) DB.board.setCode(code);
      return;
    }
    var bh = document.getElementById('board'); bh.className = 'bd-host';
    DB.board = window.QFBoard.mount(bh, { code: code });
    if (!ST.muted) DB.board.enableSound();
    var t = document.createElement('div'); t.className = 'tabs';
    t.innerHTML = '<button class="on" data-tab="phone">جوالي</button><button data-tab="board">التلفزيون</button>' + (window.innerWidth >= 900 ? '<button data-tab="both">الاثنين معاً</button>' : '') + '<button class="mute-pill' + (ST.muted ? ' off' : '') + '" data-act-mute="1">' + (ST.muted ? 'الصوت: مقفول ✕' : 'الصوت: شغال ♪') + '</button>';
    document.body.appendChild(t);
    t.addEventListener('click', function (e) {
      var raw = e.target;
      var baseEl = raw && raw.nodeType === 1 ? raw : (raw && raw.parentElement ? raw.parentElement : null);
      var b = baseEl && baseEl.closest ? baseEl.closest('button') : null;
      if (!b) return;
      if (b.hasAttribute('data-act-mute')) { toggleMute(); return; }
      if (b.hasAttribute('data-tab')) setTab(b.getAttribute('data-tab'));
    });
  }
  window.__qf = ST; window.__setTab = setTab;
  if (window.QF_DEMO) {
    document.body.classList.add('is-demo');
    var db = document.createElement('div'); db.className = 'demo';
    db.textContent = 'نسخة تجريبية بدون إنترنت — باقي اللاعبين بوتات (تستوعب حتى ٦٠ لاعباً)';
    document.body.appendChild(db);
  }
  syncAudioState();
  connect(); render();
})();
</script>

<script>
(function(){
  function mergeCustomQaftah(items) {
    if (!window.QFEngine || !Array.isArray(items) || !items.length) return;
    items.forEach(function(it) {
      var qText = it.prompt_text || it.q;
      var aText = it.answer_text || it.truth;
      if (!qText || !aText) return;
      if (qText.indexOf('_____') === -1) qText = qText + ' _____';
      var existing = window.QFEngine.QUESTIONS.find(function(x){ return x.id === it.id; });
      var decoys = it.options || it.decoys || ['خيار مموه ١', 'خيار مموه ٢', 'خيار مموه ٣', 'خيار مموه ٤'];
      if (existing) {
        existing.q = qText; existing.truth = aText; existing.info = it.extra_info || it.info || ''; existing.decoys = decoys;
      } else {
        window.QFEngine.QUESTIONS.unshift({
          id: String(it.id),
          cat: it.cat || 'سوالف ومواقف',
          q: qText,
          truth: aText,
          info: it.extra_info || it.info || '',
          decoys: decoys
        });
      }
    });
  }
  try {
    var localItems = (window.__DW_CONTENT && window.__DW_CONTENT.qaftah) || [];
    mergeCustomQaftah(localItems);
  } catch (e) {}
  if (typeof fetch !== 'undefined' && location.protocol.indexOf('http') === 0) {
    Promise.resolve({ json: function(){ return {}; } }).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.ok && Array.isArray(d.items)) mergeCustomQaftah(d.items);
    }).catch(function(){});
  }
})();
</script>


<style>
.dw-FloatingAudioBar {
  position: fixed; bottom: 12px; left: 12px; z-index: 9999;
  display: inline-flex; gap: 6px; background: rgba(10, 15, 36, 0.92);
  border: 1px solid rgba(245, 185, 66, 0.45); border-radius: 999px;
  padding: 5px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  font-family: -apple-system, "Tajawal", "Cairo", sans-serif;
}
.dw-FloatingAudioBar button {
  padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.08); color: #F8FAFC; font-size: 12px; font-weight: 800;
  cursor: pointer;
}
.dw-FloatingAudioBar button.off {
  opacity: 0.55; background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.45);
}
</style>
<script>
(function(){
  window.__DW_VOICE_ON = true;
  window.__DW_SFX_ON = true;
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var sfxCtx = null;
  function playPremiumClick(freq) {
    if (!window.__DW_SFX_ON || !AudioCtx) return;
    try {
      if (!sfxCtx) sfxCtx = new AudioCtx();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
      var o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq || 560, sfxCtx.currentTime);
      g.gain.setValueAtTime(0.06, sfxCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.075);
      o.connect(g); g.connect(sfxCtx.destination);
      o.start(); o.stop(sfxCtx.currentTime + 0.075);
    } catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    var bar = document.createElement('div');
    bar.className = 'dw-FloatingAudioBar';
    bar.innerHTML =
      '<button id="dwFlVoiceBtn" type="button">🔊 الصوت: مفعّل</button>' +
      '<button id="dwFlSfxBtn" type="button">🎵 المؤثرات: مفعّلة</button>';
    document.body.appendChild(bar);
    var vBtn = document.getElementById('dwFlVoiceBtn');
    var sBtn = document.getElementById('dwFlSfxBtn');
    vBtn.addEventListener('click', function(){
      window.__DW_VOICE_ON = !window.__DW_VOICE_ON;
      vBtn.textContent = window.__DW_VOICE_ON ? '🔊 الصوت: مفعّل' : '🔇 الصوت: مغلق';
      vBtn.classList.toggle('off', !window.__DW_VOICE_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('voice', window.__DW_VOICE_ON);
      if (!window.__DW_VOICE_ON && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
    });
    sBtn.addEventListener('click', function(){
      window.__DW_SFX_ON = !window.__DW_SFX_ON;
      sBtn.textContent = window.__DW_SFX_ON ? '🎵 المؤثرات: مفعّلة' : '🔕 المؤثرات: مغلقة';
      sBtn.classList.toggle('off', !window.__DW_SFX_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('sfx', window.__DW_SFX_ON);
      if (window.__DW_SFX_ON) playPremiumClick(660);
    });
    document.addEventListener('click', function(ev){
      if (ev.target && ev.target.closest && ev.target.closest('button')) playPremiumClick(540);
    }, true);
  });
})();
</script>


<script>
(function(){
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'DW_AUDIO_SYNC') {
      window.__DW_VOICE_ON = !!d.voiceOn;
      window.__DW_SFX_ON = !!d.sfxOn;
      if (!d.voiceOn && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    }
  });
})();
</script>
