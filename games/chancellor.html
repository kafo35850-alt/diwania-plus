<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a2e">
<title>ديوانية بلس — مستشار الديوانية</title>
<style>
:root{--bg1:#111936;--bg2:#0A0F24;--ink:#fff;--mut:#aab0d8;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--org:#f26538;--gold:#F5B942;--red:#e5484d;--blue:#38bdf8;--green:#34d399;--vio:#a78bfa;--stk:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg2);color:var(--ink);font-family:-apple-system,"SF Arabic","Segoe UI",Tajawal,Cairo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#2b2290 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%);min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;color:var(--ink)}
#app{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(80px,calc(env(safe-area-inset-bottom) + 64px));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.logo{text-align:center;padding-top:8px}.logo .ic{width:84px;height:84px;margin:0 auto 6px}
.logo .t{font-size:32px;font-weight:900}.logo .t b{color:var(--gold)}
.logo .s{color:var(--mut);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}.ctr{text-align:center}
.mut{color:var(--mut)}.small{font-size:13px}.big{font-size:21px;font-weight:800}.huge{font-size:30px;font-weight:900}
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-weight:800;font-size:17px;text-align:center;background:linear-gradient(180deg,#ff7a4a,var(--org));box-shadow:0 6px 18px rgba(242,101,56,.35)}
.btn.sec{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#ffd978,var(--gold));color:#2b1c00;box-shadow:0 6px 18px rgba(242,193,78,.3)}
.btn.red{background:linear-gradient(180deg,#ff6b6f,var(--red))}.btn.blue{background:linear-gradient(180deg,#5fd0ff,#1b8fd0)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px;width:auto;display:inline-block}
.inp{width:100%;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:18px;outline:none}.inp:focus{border-color:var(--gold)}
.inp.code{letter-spacing:10px;text-align:center;font-size:28px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:700;border:1px solid var(--line)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#2b1c00}
.chip.lib{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.55)}.chip.fas{background:rgba(229,72,77,.22);border-color:rgba(229,72,77,.6)}
.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);background:#1d2150;border:1px solid var(--gold);padding:10px 16px;border-radius:14px;z-index:50;max-width:90vw;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.conn{position:fixed;inset:0 0 auto 0;background:#b4232a;text-align:center;padding:6px;font-size:13px;font-weight:700;z-index:60}
.topbar{display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--org));width:100%;transition:width .3s linear}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pl.off{opacity:.55}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#10122e;flex:none;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid>*{min-width:0}
.pick{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.07);border:2px solid transparent;text-align:right}
.pick.sel{border-color:var(--gold);background:rgba(242,193,78,.16)}.pick.red.sel{border-color:var(--red);background:rgba(229,72,77,.2)}
.pick .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.dis{opacity:.4;pointer-events:none}
.tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.tag.g{background:var(--gold);color:#2b1c00}.tag.b{background:#38bdf8;color:#04243a}.tag.r{background:var(--red)}.tag.ok{background:rgba(52,211,153,.25);color:#b6ffe1}
/* المسارات المصغّرة */
.tracks{display:flex;flex-direction:column;gap:8px}
.trk{display:flex;align-items:center;gap:6px}
.trk .lb{font-size:12px;font-weight:800;width:58px;flex:none}
.trk .sl{flex:1;height:30px;border-radius:8px;display:grid;place-items:center;border:1.5px dashed;font-size:11px;font-weight:800}
.trk.l .sl{border-color:rgba(56,189,248,.5);color:#9bdcff}.trk.l .sl.on{background:linear-gradient(180deg,#38bdf8,#1b6fae);border:1.5px solid #bfe9ff;color:#fff}
.trk.f .sl{border-color:rgba(229,72,77,.55);color:#ffb3b5}.trk.f .sl.on{background:linear-gradient(180deg,#e5484d,#8a1a24);border:1.5px solid #ffc4c6;color:#fff}
.trk .sl svg{width:16px;height:16px}
.trkr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--mut)}
.trkr i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}.trkr i.on{background:var(--gold);border-color:var(--gold)}.trkr i.c.on{background:var(--red);border-color:var(--red)}
/* بطاقات السياسات */
.pcard{width:100%;aspect-ratio:.7;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px;color:#fff;border:3px solid;position:relative}
.pcard.lib{background:linear-gradient(160deg,#38bdf8,#1b6fae 60%,#0a2f4d);border-color:#bfe9ff}
.pcard.fas{background:linear-gradient(160deg,#ff6b6f,#b4232a 60%,#3a0a12);border-color:#ffc4c6}
.pcard .pk{font-size:13px;font-weight:900;letter-spacing:.5px;opacity:.9}.pcard .pi{width:62%}.pcard .pi svg{width:100%;height:auto;display:block}.pcard .pn{font-size:13px;font-weight:800}
.cards{display:grid;gap:12px}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c2{grid-template-columns:repeat(2,1fr);max-width:330px;margin:0 auto;width:100%}
.cbtn{border-radius:20px;padding:0;position:relative;transition:transform .15s}
.cbtn.sel{transform:translateY(-8px)}.cbtn.sel .pcard{box-shadow:0 0 0 4px var(--gold),0 12px 26px rgba(0,0,0,.5)}
.cbtn .mk{position:absolute;inset:auto 0 -10px 0;margin:auto;width:max-content;font-size:12px;font-weight:900;background:#0b0a2e;border:1px solid var(--gold);padding:3px 9px;border-radius:999px}
.back{width:100%;aspect-ratio:.7;border-radius:18px;background:repeating-linear-gradient(45deg,rgba(242,193,78,.16) 0 12px,rgba(242,193,78,.05) 12px 24px);border:3px solid rgba(242,193,78,.6);display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--gold)}
/* بطاقة الدور */
.rolecard{border-radius:26px;padding:22px 18px;text-align:center;border:2px solid;position:relative;overflow:hidden}
.rolecard.liberal{background:linear-gradient(160deg,#12395e,#071a2c);border-color:#38bdf8}
.rolecard.fascist{background:linear-gradient(160deg,#4a1220,#14060b);border-color:#e5484d}
.rolecard.leader{background:linear-gradient(160deg,#4a1220,#1b0d10);border-color:#f2c14e}
.rolecard .ri{width:118px;height:118px;margin:0 auto 6px}.rolecard .ri svg{width:100%;height:100%}
.rolecard .rn{font-size:32px;font-weight:900}.rolecard .ab{margin-top:12px;line-height:1.8;font-size:16px}
.rolecard .tm{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
.facedown{border-radius:26px;padding:46px 18px;text-align:center;border:2px dashed var(--gold);background:repeating-linear-gradient(45deg,rgba(242,193,78,.10) 0 14px,rgba(242,193,78,.04) 14px 28px)}
.facedown .q{font-size:60px;font-weight:900;color:var(--gold)}
.peek{position:fixed;inset:0;background:rgba(3,4,20,.92);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.peek .rolecard{width:100%;max-width:420px}
.ann{border-radius:22px;padding:20px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line)}
.ann.lib{background:linear-gradient(160deg,rgba(56,189,248,.28),rgba(10,47,77,.4));border-color:rgba(56,189,248,.6)}
.ann.fas{background:linear-gradient(160deg,rgba(229,72,77,.3),rgba(58,10,18,.5));border-color:rgba(229,72,77,.6)}
.vbtn{border-radius:22px;padding:22px 10px;font-weight:900;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.vbtn small{font-size:14px;font-weight:700;opacity:.9}
.vbtn.ja{background:linear-gradient(160deg,#34d399,#0f7a52)}.vbtn.nein{background:linear-gradient(160deg,#ff6b6f,#a3202e)}
.vbtn.sel{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.vbtn.dim{opacity:.45}
.susp .dots3{display:flex;gap:10px;justify-content:center;margin-top:18px}
.susp .dots3 i{width:14px;height:14px;border-radius:50%;background:var(--gold);opacity:.3;animation:blink 1.2s infinite}
.susp .dots3 i:nth-child(2){animation-delay:.25s}.susp .dots3 i:nth-child(3){animation-delay:.5s}
@keyframes blink{50%{opacity:1;transform:scale(1.3)}}
.qrbox{background:#fff;border-radius:18px;padding:10px;width:min(62vw,230px);margin:0 auto;line-height:0}.qrbox svg{width:100%;height:auto}
.code{font-size:46px;font-weight:900;letter-spacing:12px;text-align:center}
.hint{font-size:13px;color:var(--mut);text-align:center;line-height:1.7}
.untimed{border-radius:14px;padding:9px 12px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.45);text-align:center;line-height:1.7;font-size:13.5px}
.warn{border-radius:16px;padding:11px 14px;background:rgba(229,72,77,.15);border:1px solid rgba(229,72,77,.5);text-align:center;line-height:1.7;font-size:14px}
.warn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5)}
.gov{display:flex;gap:8px;align-items:stretch}
.gov>div{flex:1;border-radius:16px;padding:10px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.gov .gi{width:30px;height:30px;margin:0 auto 4px}.gov .gi svg{width:100%;height:100%}
.gov b{display:block;font-size:17px}
.log{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;font-size:13.5px;line-height:1.6}
.log div{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
.vl{display:flex;flex-wrap:wrap;gap:6px}
.stick{position:sticky;bottom:10px;z-index:5;padding-top:12px;background:linear-gradient(rgba(11,10,46,0),rgba(11,10,46,.92) 38%)}
#help{position:fixed;inset:0;z-index:90;background:radial-gradient(1200px 600px at 80% -10%,#2b2290 0%,transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%);overflow-y:auto;display:none}
#help.on{display:block}
.hp{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.hp .htabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.hp .htabs::-webkit-scrollbar{display:none}
.hp .htabs .chip{flex:none;padding:9px 14px;font-size:14px}
.hp .lead{line-height:1.9;font-size:16px}.hp .pts{margin:0;padding:0 20px 0 0;line-height:1.9;font-size:15px}
.hp .stp{display:flex;gap:12px;align-items:flex-start}.hp .stp .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--org);display:grid;place-items:center;font-weight:900}
.hp .stp .tx{line-height:1.8;font-size:15px}.hp .stp .tx b{display:block;font-size:16px}
.hp .note{border-radius:16px;padding:12px 14px;background:rgba(242,193,78,.14);border:1px solid rgba(242,193,78,.55);line-height:1.8;font-size:14px}
.hfab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;width:42px;height:42px;border-radius:50%;background:rgba(10,10,46,.82);border:1px solid rgba(255,255,255,.28);font-weight:900;font-size:19px;color:#fff}
.demo{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px;padding:5px;background:rgba(242,193,78,.92);color:#2b1c00;font-weight:800;z-index:70;pointer-events:none}
body.is-demo #app{padding-bottom:130px}body.is-demo .hfab{bottom:84px}
.bd-host{visibility:hidden;pointer-events:none}
body.board-only #app,body.board-only .hfab{display:none}
body.show-board #app,body.show-board .hfab{visibility:hidden}
body.show-board .bd-host{visibility:visible;pointer-events:auto;z-index:60}
body.show-both #app{position:fixed;top:0;bottom:0;right:0;width:430px;max-width:430px;overflow-y:auto;z-index:70;background:#0b0a2e;padding-bottom:90px;border-left:1px solid rgba(255,255,255,.2)}
body.show-both .bd-host{visibility:visible;pointer-events:auto;z-index:60;right:430px}
body.show-both .hfab{display:none}
.tabs{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:6px;background:rgba(10,10,46,.92);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px}
.tabs button{padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;color:#fff}.tabs button.on{background:var(--org)}
body.show-both .tabs{left:calc(50% - 215px)}
.dead{opacity:.5;text-decoration:line-through}
</style>

<script>/* hub.js */
/* ديوانية بلس مافيا — مركز الغرف (hub): بروتوكول الرسائل + الغرف + المؤقتات، بدون أي شبكة.
 * يشتغل في Node (server.js) وفي المتصفح (النسخة التجريبية) وفي Cloudflare Durable Object لاحقاً.
 * الناقل (WebSocket أو غيره) يعطي كل اتصال كائن conn فيه: send(obj) و close(code).
 *
 * رسائل العميل -> الخادم (JSON):
 *   {t:'create', name, dev?}          إنشاء غرفة (المنشئ هو المضيف)
 *   {t:'join', code, name}            دخول بالرمز
 *   {t:'resume', code, token}         رجوع بعد انقطاع / قفل الجوال
 *   {t:'board', code}                 شاشة عرض عامة (بدون دور)
 *   {t:'act', a, ...}                 a = ready | night{target,kind?} | confirm{on?} | task | vote | voteReady | start | skip | settings | kick | reset | leave
 *                                     (الليل: المافيا تقترح بـnight ثم تؤكد بـconfirm · بقية اللاعبين اللي ما عندهم قدرة ينفذون مهمة ويبلّغون بـtask)
 *                                     وضع المقدّم: hostPick{kind,target} | hostNext | hostTimer{sec}
 *   {t:'ping'}
 * الخادم -> العميل: {t:'joined',code,id,token} | {t:'view',view} | {t:'err',err} | {t:'pong'} | {t:'kicked'} | {t:'left'}
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.MafiaHub = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const LOBBY_GRACE_MS = 90 * 1000, ROOM_IDLE_MS = 6 * 3600 * 1000, EMPTY_ROOM_MS = 30 * 60 * 1000;

  /* opts: { E (المحرك), rng(), randInt(min,max), token(), now(), wallet, allowDev, maxRooms } */
  function createHub(opts) {
    const E = opts.E, rng = opts.rng, now = opts.now || Date.now, maxRooms = opts.maxRooms || 500;
    const wallet = opts.wallet || { async charge() { return true; } };   // مكان ربط الرصيد: يُخصم قيم واحد من المضيف عند البدء
    const rooms = new Map();

    const newCode = () => { for (let i = 0; i < 50; i++) { const c = String(opts.randInt(1000, 10000)); if (!rooms.has(c)) return c; } return null; };

    function sendViews(room) {
      const t = now();
      room.conns.forEach((c) => { if (!c.closed) c.send({ t: 'view', view: E.viewFor(room.g, c.pid, t) }); });
    }
    function bind(room, conn, pid) {
      // اتصال قديم لنفس اللاعب؟ نقفله
      room.conns.forEach((c) => { if (c !== conn && pid && c.pid === pid) { c.pid = null; room.conns.delete(c); c.close(4000); } });
      conn.code = room.g.code; conn.pid = pid; conn.board = !pid; room.conns.add(conn);
      if (pid) { E.setConnected(room.g, pid, true); delete room.discAt[pid]; }
    }

      const room = conn.code && rooms.get(conn.code); if (!room) return;

      }
    }

    function message(conn, m) {
      const t0 = now();
      const err = (e) => conn.send({ t: 'err', err: e });

        case 'ping': return conn.send({ t: 'pong' });

          // محرك عام (مثل مستشار الديوانية): كل أفعال اللعب تروح لـ E.act، ما عدا الطرد والبدء والخروج (لها شغل اتصالات هنا)

          switch (m.a) {
            case 'ready': r = E.ready(g, id, t0); break;
            case 'night': r = E.nightAct(g, id, m.target === undefined ? null : m.target, t0, m.kind, rng); break;
            case 'confirm': r = E.nightConfirm(g, id, t0, rng, m.on !== false); break;
            case 'task': r = E.nightTask(g, id, t0, rng); break;
            case 'vote': r = E.vote(g, id, m.target, t0); break;
            case 'voteReady': r = E.voteReady(g, id, t0); break;
            case 'settings': r = E.setSettings(g, id, m.patch || {}); break;
            case 'skip': r = E.skip(g, id, t0, rng); break;
            case 'hostPick': r = E.hostPick(g, id, m.kind, m.target === undefined ? null : m.target); break;
            case 'hostNext': r = E.hostNext(g, id, t0); break;
            case 'hostTimer': r = E.hostTimer(g, id, m.sec, t0); break;
            case 'kick': { const victim = [...room.conns].find((c) => c.pid === m.target); r = E.kick(g, id, m.target); if (r.ok && victim) { victim.pid = null; room.conns.delete(victim); victim.send({ t: 'kicked' }); victim.close(4001); } break; }
            case 'reset': r = E.reset(g, id); break;
            case 'start': {
              if (g.hostId !== id) { r = { ok: false, err: 'not_host' }; break; }
              if (g.phase !== 'lobby') { r = { ok: false, err: 'already_started' }; break; }
              if (E.need(g) > 0) { r = { ok: false, err: 'need_players' }; break; }
              // هنا يُخصم قيم واحد من رصيد المضيف (من الخادم، مو من الجوال).
              Promise.resolve(wallet.charge(room)).then((okc) => {
                if (!okc) { conn.send({ t: 'err', err: 'no_credit' }); return; }
                const rr = E.start(g, id, now(), rng); if (!rr.ok) conn.send({ t: 'err', err: rr.err });
                sendViews(room);
              }).catch(() => conn.send({ t: 'err', err: 'wallet_error' }));
              return;
            }
            case 'leave': { r = E.leave(g, id); const tkn = Object.keys(room.tokens).find((k) => room.tokens[k] === id); if (tkn) delete room.tokens[tkn]; conn.pid = null; conn.send({ t: 'left' }); break; }

          }
          if (!r.ok) err(r.err);

        }
      }
    }

    // مؤقتات اللعبة + تنظيف الغرف (يُستدعى كل ~500ms)
    function tick() {
      const t = now();
      rooms.forEach((room, code) => {
        const g = room.g; let changed = false;
        try { changed = E.tick(g, t, rng); } catch (e) { if (typeof console !== 'undefined') console.error('tick error', code, e); }
        if (g.phase === 'lobby') Object.keys(room.discAt).forEach((pid) => { if (t - room.discAt[pid] > LOBBY_GRACE_MS) { E.leave(g, pid); delete room.discAt[pid]; changed = true; } });
        if (changed) sendViews(room);
        if ((room.conns.size === 0 && t - room.last > EMPTY_ROOM_MS) || t - room.last > ROOM_IDLE_MS) rooms.delete(code);
      });
    }

    return { rooms, message, closed, tick, sendViews };
  }

  return { createHub };
});

    g.players = g.players.filter((p) => p.connected);
    if (!g.players.some((p) => p.id === g.hostId)) g.hostId = g.players.length ? g.players[0].id : null;
    g.players.forEach((p) => { p.role = null; p.party = null; p.alive = true; });
    Object.assign(g, { phase: 'lobby', round: 0, deadline: null, timerTotal: null, winner: null, voteResult: null, enacted: null, power: null, gov: null, events: [], ready: {} });
    return ok();
  }

  // كل أفعال اللعب من مكان واحد (الخادم يمرّر الرسالة كما هي)
  function act(g, id, m, now, rng) {
    switch (m.a) {
      case 'ready': return ready(g, id, now);
      case 'nominate': return nominate(g, id, m.target, now);
      case 'vote': return vote(g, id, m.target, now);
      case 'discard': return presDiscard(g, id, m.i, now);
      case 'enact': return chanEnact(g, id, m.i, now, rng);
      case 'vetoAsk': return vetoAsk(g, id, now);
      case 'vetoReply': return vetoReply(g, id, m.on === true, now, rng);
      case 'power': return usePower(g, id, m.target, now);
      case 'powerDone': return powerDone(g, id, now);
      case 'claim': return claim(g, id, m.v);
      case 'settings': return setSettings(g, id, m.patch || {});
      case 'skip': return skip(g, id, now, rng);
      case 'reset': return reset(g, id);
      case 'again': { const r = reset(g, id); if (!r.ok) return r; return start(g, id, now, rng); }
    }
    return fail('bad_action');
  }

  function viewFor(g, pid, now) {

    const vr = g.voteResult, showVotes = g.phase === 'voteResult' && vr && !vr.pending;
    const players = g.players.map((p) => ({

      ready: !!g.ready[p.id],
      voted: g.phase === 'vote' ? !!g.votes[p.id] : undefined,
      vote: showVotes ? vr.votes[p.id] || null : null,
      notLeader: !!g.notLeader[p.id], investigated: !!g.investigated[p.id],

      powers: powersFor(Math.max(5, g.phase === 'lobby' ? g.players.length : g.nPlayers)),
      lib: g.lib, fas: g.fas, tracker: g.tracker, vetoOn: g.vetoOn, deckCount: g.deck.length, discardCount: g.discard.length,
      presId: g.presId, nomId: g.nomId, chanId: g.chanId, lastPresId: g.lastPresId, lastChanId: g.lastChanId,
      votedCount: g.phase === 'vote' ? Object.keys(g.votes).length : 0,

      enacted: g.enacted && g.phase === 'enacted' ? (g.enacted.pending ? { pending: true, chaos: g.enacted.chaos, revealAt: g.enacted.revealAt } : Object.assign({}, g.enacted, { revealAt: undefined })) : null,
      power: g.power && g.phase === 'power' ? { kind: g.power.kind, pres: g.power.pres, done: g.power.done, target: g.power.kind === 'investigate' || g.power.kind === 'kill' || g.power.kind === 'special' ? g.power.target : null, leader: false } : null,
      vetoAsked: g.phase === 'veto',
      gov: g.gov ? { round: g.gov.round, pres: g.gov.pres, chan: g.gov.chan, presClaim: g.gov.presClaim, chanClaim: g.gov.chanClaim, done: g.gov.done } : null,
      events: g.events.slice(-30), winner: g.winner
    };

      const mv = { id: me.id, host: me.id === g.hostId, alive: me.alive, role: me.role, party: me.party, ready: !!g.ready[me.id], team: [] };

      if ((g.phase === 'chan' || g.phase === 'veto') && me.id === g.chanId) { mv.chanCards = g.chanCards.slice(); mv.canVeto = g.vetoOn && !g.vetoRefused && g.phase === 'chan'; }

  }

  function mount(el, opts) {

    function cues(prev, v) {

        case 'vote': sfx('pop'); later_(400, () => say(N(v, v.presId) + ' رشّح ' + N(v, v.nomId) + '. صوّتوا بجوالاتكم: نعم أو لا.' + (v.fas >= 3 ? ' وانتبهوا… لو طلع الزعيم السري، تنتهي اللعبة.' : ''))); break;

    function enactCue(v) { const e = v.enacted; sfx(e.card === 'liberal' ? 'chime' : 'evil'); later_(700, () => say(e.card === 'liberal' ? 'سياسة نزيهة.' : 'سياسة فاسدة.' + (e.power ? ' والرئيس حصل على قدرة: ' + POWER[e.power] + '.' : ''))); }

      for (let j = 1; j <= 6; j++) { const on = j <= v.fas, pw = v.powers[j]; f += '<div class="slot ' + (on ? 'on' : '') + (on && nw && j === v.fas ? ' new' : '') + '">' + (on ? '<div class="ic">' + I.svg('fascist', 'transparent') + '</div>' : (j === 6 ? '<div class="ic">' + I.svg('win') + '</div><span>فوز</span>' : pw ? '<div class="ic">' + I.svg(pw) + '</div><span>' + POWER[pw] + '</span>' : '<span>' + AR(j) + '</span>')) + '</div>'; }

        '<div class="meta"><span>عداد الفوضى ' + tr + '</span><span>الكومة: ' + AR(v.deckCount) + '</span><span>المستبعدة: ' + AR(v.discardCount) + '</span><span class="sp"></span>' + (v.fas >= 3 ? '<span class="tg g">منطقة الزعيم السري</span>' : '') + (v.vetoOn ? '<span class="tg">الفيتو مفتوح</span>' : '') + '</div></div>';

<script>/* sh/loopback.js */
/* ديوانية بلس — مستشار الديوانية: النسخة التجريبية بدون إنترنت — "خادم" داخل الصفحة + لاعبين بوتات.
 * نفس البروتوكول (hub.js) بالضبط، فالواجهة ما تدري إنها مو على خادم حقيقي. */
(function (g) {
  'use strict';
  var E = g.SHEngine, H = g.MafiaHub, rnd = Math.random;
  var hub = H.createHub({
    E: E, rng: rnd, allowDev: false,
    randInt: function (a, b) { return a + Math.floor(rnd() * (b - a)); },
    token: function () { var s = ''; for (var i = 0; i < 24; i++) s += Math.floor(rnd() * 16).toString(16); return s; }
  });
  setInterval(function () { hub.tick(); }, 500);

  function Sock(url) {
    var self = this; self.readyState = 0; self.url = url;
    self.conn = { closed: false, pid: null, code: null, board: false, send: function (o) { self._deliver(o); }, close: function () { self._shut(); } };
    setTimeout(function () { if (self.readyState !== 0) return; self.readyState = 1; if (self.onopen) self.onopen({}); }, 20);
  }
  Sock.prototype.send = function (text) { var self = this; if (self.readyState !== 1) throw new Error('closed'); var m = JSON.parse(text); setTimeout(function () { if (!self.conn.closed) hub.message(self.conn, m); }, 0); };
  Sock.prototype._deliver = function (o) { var self = this; if (self.readyState !== 1) return; var data = JSON.stringify(o); setTimeout(function () { if (self.readyState === 1 && self.onmessage) self.onmessage({ data: data }); }, 0); };
  Sock.prototype.close = function () { this._shut(); };
  Sock.prototype._shut = function () { var self = this; if (self.conn.closed) return; self.conn.closed = true; self.readyState = 3; hub.closed(self.conn); setTimeout(function () { if (self.onclose) self.onclose({}); }, 0); };
  g.SHWS = Sock;

  // ------------------------------------------------------------ البوتات
  var NAMES = ['بدر', 'لمى', 'سلطان', 'هند', 'ياسر', 'جود', 'تركي', 'أروى', 'نواف', 'ريم', 'فهد', 'سارة', 'ماجد', 'دانة'];
  var pick = function (a) { return a[Math.floor(rnd() * a.length)]; };
  var delay = function (a, b) { return a + rnd() * (b - a); };
  var FAST = /[?&]fast=1/.test(g.location && g.location.search || '');
  var D = function (a, b) { return FAST ? delay(300, 900) : delay(a, b); };

  function Bot(code, name) {
    var b = this; b.name = name; b.view = null; b.sentFor = ''; b.mem = {};
    b.sock = new Sock('bot'); b.sock.onopen = function () { b.sock.send(JSON.stringify({ t: 'join', code: code, name: name })); };
    b.sock.onmessage = function (ev) { var m = JSON.parse(ev.data); if (m.t === 'view') { b.view = m.view; b.think(); } };
  }
  Bot.prototype.act = function (o) { try { this.sock.send(JSON.stringify(Object.assign({ t: 'act' }, o))); } catch (e) { } };
  Bot.prototype.later = function (ms, fn) { setTimeout(fn, ms); };
  Bot.prototype.think = function () {
    var b = this, v = b.view, me = v && v.me; if (!me) return;
    if (v.phase === 'lobby') { b.sentFor = ''; b.mem = {}; return; }
    var key = v.phase + ':' + v.round + ':' + (v.power && v.power.done ? 1 : 0); if (b.sentFor === key) return;
    var fas = me.party === 'fascist', team = (me.team || []).map(function (t) { return t.id; });
    var bad = (me.notes || []).filter(function (n) { return n.party === 'fascist'; }).map(function (n) { return n.target; });
    var others = v.players.filter(function (p) { return p.alive && p.id !== me.id; });
    if (me.drawn) b.mem.drawn = me.drawn.slice(); if (me.chanCards) b.mem.chan = me.chanCards.slice();
    // الادعاء بعد الجلسة
    if (me.claimAs && v.gov && v.gov.done && !b.mem['c' + v.gov.round] && v.phase !== 'enacted') {
      b.mem['c' + v.gov.round] = 1;
      var src = me.claimAs === 'pres' ? b.mem.drawn : b.mem.chan;
      if (src && rnd() < 0.8) { var nf = src.filter(function (c) { return c === 'fascist'; }).length; if (fas && rnd() < 0.5) nf = src.length; b.later(D(1500, 4000), function () { b.act({ a: 'claim', v: nf }); }); }
    }
    if (v.phase === 'reveal' && !me.ready) { b.sentFor = key; b.later(D(1500, 5000), function () { b.act({ a: 'ready' }); }); return; }
    if (!me.alive) return;
    if (v.phase === 'nominate' && me.id === v.presId) {
      b.sentFor = key;
      var el = v.players.filter(function (p) { return p.eligible; }); if (!el.length) return;
      var choice = pick(el);
      if (fas) { var h = el.filter(function (p) { return team.indexOf(p.id) >= 0; }); if (h.length && rnd() < 0.6) choice = pick(h); }
      else { var good = el.filter(function (p) { return bad.indexOf(p.id) < 0; }); if (good.length) choice = pick(good); }
      b.later(D(4000, 9000), function () { b.act({ a: 'nominate', target: choice.id }); });
    } else if (v.phase === 'vote' && me.myVote == null) {
      b.sentFor = key;
      var gov = [v.presId, v.nomId], ja;
      if (fas) ja = gov.some(function (id) { return team.indexOf(id) >= 0; }) ? rnd() < 0.9 : rnd() < 0.45;
      else ja = gov.some(function (id) { return bad.indexOf(id) >= 0; }) ? false : (v.tracker >= 2 ? rnd() < 0.85 : rnd() < 0.62);
      b.later(D(3000, 10000), function () { b.act({ a: 'vote', target: ja ? 'ja' : 'nein' }); });
    } else if (v.phase === 'pres' && me.drawn) {
      b.sentFor = key; var cs = me.drawn, i = 0, want = fas ? 'liberal' : 'fascist';
      if (cs.indexOf(want) >= 0 && (!fas || rnd() < 0.7)) i = cs.indexOf(want); else i = Math.floor(rnd() * cs.length);
      b.later(D(3000, 7000), function () { b.act({ a: 'discard', i: i }); });
    } else if (v.phase === 'chan' && me.chanCards) {
      b.sentFor = key; var cc = me.chanCards, want2 = fas ? 'fascist' : 'liberal';
      if (me.canVeto && !fas && cc.every(function (c) { return c === 'fascist'; }) && rnd() < 0.8) { b.later(D(2500, 6000), function () { b.act({ a: 'vetoAsk' }); }); return; }
      var j = cc.indexOf(want2) >= 0 && (!fas || rnd() < 0.8) ? cc.indexOf(want2) : Math.floor(rnd() * cc.length);
      b.later(D(3000, 7000), function () { b.act({ a: 'enact', i: j }); });
    } else if (v.phase === 'veto' && me.id === v.presId) {
      b.sentFor = key; b.later(D(2000, 5000), function () { b.act({ a: 'vetoReply', on: !fas && rnd() < 0.7 }); });
    } else if (v.phase === 'power' && me.id === v.presId) {
      b.sentFor = key; var pw = v.power;
      if (pw.done) { if (pw.kind === 'investigate') b.later(D(3000, 6000), function () { b.act({ a: 'powerDone' }); }); return; }
      if (pw.kind === 'peek') { b.later(D(3000, 6000), function () { b.act({ a: 'power', target: null }); }); return; }
      var ts = others.filter(function (p) { return !(pw.kind === 'investigate' && p.investigated); });
      var t = pick(ts);
      if (pw.kind === 'kill') { var pool = fas ? ts.filter(function (p) { return team.indexOf(p.id) < 0; }) : ts.filter(function (p) { return bad.indexOf(p.id) >= 0; }); if (pool.length) t = pick(pool); }
      if (pw.kind === 'special' && fas) { var tm = ts.filter(function (p) { return team.indexOf(p.id) >= 0; }); if (tm.length) t = pick(tm); }
      if (t) b.later(D(4000, 9000), function () { b.act({ a: 'power', target: t.id }); });
    }
  };

  var seen = {};
  function wantBots() { var m = /[?&]bots=(\d+)/.exec(g.location && g.location.search || ''); return m ? Math.max(4, Math.min(59, Number(m[1]))) : 6; }
  setInterval(function () {
    hub.rooms.forEach(function (room, code) {
      if (seen[code]) return; seen[code] = true;
      var names = NAMES.slice().sort(function () { return rnd() - 0.5; }), n = wantBots();
      for (var i = 0; i < n; i++) (function (i) { setTimeout(function () { var r = hub.rooms.get(code); if (r && r.g.phase === 'lobby' && r.g.players.length < 60) new Bot(code, names[i]); }, 800 + i * 600); })(i);
    });
  }, 400);
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  if (window.SH_DEMO) { document.body.classList.add('is-demo'); var db = document.createElement('div'); db.className = 'demo'; db.textContent = 'نسخة تجريبية بدون إنترنت — باقي اللاعبين بوتات'; document.body.appendChild(db); }
  render(); connect();
})();
</script>

<style>
.dw-FloatingAudioBar {
  position: fixed; bottom: 12px; left: 12px; z-index: 9999;
  display: inline-flex; gap: 6px; background: rgba(10, 15, 36, 0.92);
  border: 1px solid rgba(245, 185, 66, 0.45); border-radius: 999px;
  padding: 5px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  font-family: -apple-system, "Tajawal", "Cairo", sans-serif;
}
.dw-FloatingAudioBar button {
  padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.08); color: #F8FAFC; font-size: 12px; font-weight: 800;
  cursor: pointer;
}
.dw-FloatingAudioBar button.off {
  opacity: 0.55; background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.45);
}
</style>
<script>
(function(){
  window.__DW_VOICE_ON = true;
  window.__DW_SFX_ON = true;
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var sfxCtx = null;
  function playPremiumClick(freq) {
    if (!window.__DW_SFX_ON || !AudioCtx) return;
    try {
      if (!sfxCtx) sfxCtx = new AudioCtx();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
      var o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq || 560, sfxCtx.currentTime);
      g.gain.setValueAtTime(0.06, sfxCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.075);
      o.connect(g); g.connect(sfxCtx.destination);
      o.start(); o.stop(sfxCtx.currentTime + 0.075);
    } catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){
    var bar = document.createElement('div');
    bar.className = 'dw-FloatingAudioBar';
    bar.innerHTML =
      '<button id="dwFlVoiceBtn" type="button">🔊 الصوت: مفعّل</button>' +
      '<button id="dwFlSfxBtn" type="button">🎵 المؤثرات: مفعّلة</button>';
    document.body.appendChild(bar);
    var vBtn = document.getElementById('dwFlVoiceBtn');
    var sBtn = document.getElementById('dwFlSfxBtn');
    vBtn.addEventListener('click', function(){
      window.__DW_VOICE_ON = !window.__DW_VOICE_ON;
      vBtn.textContent = window.__DW_VOICE_ON ? '🔊 الصوت: مفعّل' : '🔇 الصوت: مغلق';
      vBtn.classList.toggle('off', !window.__DW_VOICE_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('voice', window.__DW_VOICE_ON);
      if (!window.__DW_VOICE_ON && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch(e){} }
    });
    sBtn.addEventListener('click', function(){
      window.__DW_SFX_ON = !window.__DW_SFX_ON;
      sBtn.textContent = window.__DW_SFX_ON ? '🎵 المؤثرات: مفعّلة' : '🔕 المؤثرات: مغلقة';
      sBtn.classList.toggle('off', !window.__DW_SFX_ON);
      if (window.DiwaniyaAudio && window.DiwaniyaAudio.setEnabled) window.DiwaniyaAudio.setEnabled('sfx', window.__DW_SFX_ON);
      if (window.__DW_SFX_ON) playPremiumClick(660);
    });
    document.addEventListener('click', function(ev){
      if (ev.target && ev.target.closest && ev.target.closest('button')) playPremiumClick(540);
    }, true);
  });
})();
</script>


<script>
(function(){
  window.addEventListener('message', function(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'DW_AUDIO_SYNC') {
      window.__DW_VOICE_ON = !!d.voiceOn;
      window.__DW_SFX_ON = !!d.sfxOn;
      if (!d.voiceOn && window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch(e){}
      }
    }
  });
})();
</script>
