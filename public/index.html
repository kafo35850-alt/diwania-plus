/* ============================================================================
 * ديوانية بلس (Diwaniya+) — Luxury Royal Night Commercial Platform Stylesheet
 * Responsive for iPad (Safari), Mobile, Desktop, and TV Screens
 * ============================================================================ */
:root {
  --bg-deep: #0A0F24;
  --bg-surface: #111936;
  --bg-card: rgba(23, 33, 68, 0.78);
  --bg-glass: rgba(15, 23, 48, 0.88);
  --border-line: rgba(245, 185, 66, 0.18);
  --border-subtle: rgba(255, 255, 255, 0.11);
  --gold: #F5B942;
  --gold-light: #FFE08A;
  --teal: #2DD4BF;
  --teal-dark: #0D9488;
  --coral: #F97316;
  --rose: #F43F5E;
  --emerald: #10B981;
  --text-main: #F8FAFC;
  --text-muted: #94A3B8;
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-md: 12px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: -apple-system, "SF Arabic", "Segoe UI", Tajawal, Cairo, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}

body {
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(245, 185, 66, 0.14) 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 10%, rgba(45, 212, 191, 0.10) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-deep) 65%);
  min-height: 100vh;
  min-height: 100dvh;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Navbar */
.dw-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 15, 36, 0.88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  padding: max(12px, env(safe-area-inset-top)) 20px 12px;
}

.dw-nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.dw-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text-main);
}

.dw-brand-logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--gold), #D97706);
  display: grid;
  place-items: center;
  color: #1A1100;
  font-weight: 900;
  font-size: 22px;
  box-shadow: 0 6px 18px rgba(245, 185, 66, 0.3);
}

.dw-brand-text h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.3px;
}

.dw-brand-text h1 span {
  color: var(--gold);
}

.dw-brand-text p {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
}

.dw-nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.dw-tab-btn {
  padding: 9px 15px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 14px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  transition: all 0.15s;
}

.dw-tab-btn.active, .dw-tab-btn:hover {
  color: var(--text-main);
  background: rgba(245, 185, 66, 0.14);
  border-color: var(--border-line);
}

.dw-tab-btn.admin-tab {
  color: var(--teal);
  border-color: rgba(45, 212, 191, 0.35);
}

.dw-spacer {
  flex: 1;
}

.dw-wallet-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(245, 185, 66, 0.2), rgba(245, 185, 66, 0.08));
  border: 1px solid rgba(245, 185, 66, 0.5);
  font-weight: 900;
  font-size: 14px;
  color: var(--gold-light);
}

.dw-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 15px;
  transition: transform 0.12s, opacity 0.12s;
}

.dw-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.dw-btn-gold {
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  color: #1E1300;
  box-shadow: 0 6px 18px rgba(245, 185, 66, 0.28);
}

.dw-btn-teal {
  background: linear-gradient(180deg, var(--teal), var(--teal-dark));
  color: #042f2e;
  box-shadow: 0 6px 18px rgba(45, 212, 191, 0.25);
}

.dw-btn-sec {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
}

.dw-btn-danger {
  background: rgba(244, 63, 94, 0.2);
  border: 1px solid rgba(244, 63, 94, 0.5);
  color: #FECDD3;
}

.dw-btn-sm {
  padding: 7px 12px;
  font-size: 13px;
  border-radius: 10px;
}

/* Container & Sections */
.dw-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.dw-hero {
  border-radius: 26px;
  padding: 32px 28px;
  background:
    radial-gradient(700px 300px at 10% 0%, rgba(245, 185, 66, 0.18), transparent 70%),
    linear-gradient(145deg, rgba(23, 33, 68, 0.9), rgba(10, 15, 36, 0.92));
  border: 1px solid var(--border-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.dw-hero-content {
  max-width: 680px;
}

.dw-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 999px;
  background: rgba(45, 212, 191, 0.14);
  border: 1px solid rgba(45, 212, 191, 0.45);
  color: var(--teal);
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 10px;
}

.dw-hero h2 {
  margin: 0;
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 900;
  line-height: 1.25;
}

.dw-hero h2 b {
  color: var(--gold);
}

.dw-hero p {
  margin: 10px 0 0;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.75;
}

/* Grid Cards */
.dw-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: 20px;
}

.dw-grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.dw-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: border-color 0.15s, transform 0.15s;
}

.dw-card:hover {
  border-color: var(--border-line);
}

.dw-game-card-head {
  display: flex;
  align-items: center;
  gap: 14px;
}

.dw-game-icon {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(245, 185, 66, 0.22), rgba(45, 212, 191, 0.14));
  border: 1px solid var(--border-line);
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 900;
  color: var(--gold);
  flex: none;
}

.dw-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-subtle);
  font-size: 12.5px;
  font-weight: 700;
}

.dw-chip.gold {
  background: rgba(245, 185, 66, 0.18);
  border-color: rgba(245, 185, 66, 0.5);
  color: var(--gold-light);
}

.dw-chip.teal {
  background: rgba(45, 212, 191, 0.16);
  border-color: rgba(45, 212, 191, 0.45);
  color: #99F6E4;
}

/* Inputs & Tables */
.dw-input, .dw-select, .dw-textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: rgba(5, 9, 22, 0.65);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  font-size: 15px;
  outline: none;
}

.dw-input:focus, .dw-select:focus, .dw-textarea:focus {
  border-color: var(--gold);
}

.dw-table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

.dw-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: right;
}

.dw-table th, .dw-table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.dw-table th {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  font-weight: 800;
}

/* Category Explorer */
.dw-cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 12px;
  max-height: 540px;
  overflow-y: auto;
  padding: 4px;
}

.dw-cat-item {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dw-cat-item b {
  font-size: 14.5px;
}

/* Modal & Toast */
.dw-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(4, 7, 18, 0.82);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: none;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}

.dw-modal-backdrop.open {
  display: grid;
}

.dw-modal {
  width: 100%;
  max-width: 520px;
  background: var(--bg-surface);
  border: 1px solid var(--border-line);
  border-radius: 24px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
}

.dw-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  background: #162044;
  border: 1px solid var(--gold);
  color: var(--text-main);
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 800;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  display: none;
}

.dw-toast.show {
  display: block;
}

/* Game Fullscreen Modal Frame */
.dw-game-frame-wrap {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: var(--bg-deep);
  display: none;
  flex-direction: column;
}

.dw-game-frame-wrap.open {
  display: flex;
}

.dw-game-frame-bar {
  flex-shrink: 0;
  min-height: 52px;
  background: #080C1D;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
  padding-top: max(6px, env(safe-area-inset-top));
  gap: 10px;
}
.fb-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-actions { display: flex; gap: 6px; flex-shrink: 0; }
.fb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 40px; height: 40px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid var(--border-subtle); white-space: nowrap; }
.fb-btn.off { opacity: .55; }
.fb-close { background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.5); color: #fecdd3; }
@media (max-width: 640px) { .fb-btn .lbl { display: none; } .fb-btn { padding: 0 10px; } .fb-title { font-size: 15px; } }
@media (orientation: landscape) and (max-height: 540px) {
  .dw-game-frame-bar { min-height: 40px; padding-top: max(3px, env(safe-area-inset-top)); padding-bottom: 3px; }
  .fb-btn { height: 32px; min-width: 34px; padding: 0 9px; border-radius: 10px; font-size: 14px; }
  .fb-btn .lbl { display: none; }
  .fb-title { font-size: 14px; }
}
.dw-game-frame-wrap:fullscreen { width: 100vw; height: 100vh; }
.dw-toast.in-game { bottom: auto; top: calc(58px + env(safe-area-inset-top)); padding: 8px 14px; font-size: 13px; max-width: min(92vw, 440px); text-align: center; border-radius: 12px; }

.dw-game-frame {
  flex: 1;
  min-height: 0;
  width: 100%;
  border: 0;
}


/* Luxury Game Emblem Banner & Crest */
.dw-crest-banner {
  position: relative;
  height: 168px;
  border-radius: 18px;
  margin: -6px -6px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid rgba(245, 185, 66, 0.28);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55), 0 10px 24px rgba(0, 0, 0, 0.35);
}

.dw-crest-banner svg {
  width: 132px;
  height: 132px;
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.65));
  transition: transform 0.25s cubic-bezier(0.2, 1.2, 0.4, 1);
}

.dw-card:hover .dw-crest-banner svg {
  transform: scale(1.07) translateY(-2px);
}

.dw-free-ribbon {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 5px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, #10B981, #059669);
  color: #fff;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.28);
}

.dw-used-ribbon {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.78);
  color: var(--gold-light);
  font-size: 11.5px;
  font-weight: 800;
  border: 1px solid rgba(245, 185, 66, 0.35);
}

.dw-guide-modal {
  max-width: 680px;
}

.dw-guide-step {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px 14px;
}

.dw-guide-step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #D97706);
  color: #1A1100;
  font-weight: 900;
  display: grid;
  place-items: center;
  flex: none;
}


/* ===================== 2026 storefront refresh ===================== */
html, body { font-family: "IBM Plex Sans Arabic", -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif; }
.dw-container { max-width: 1240px; }
/* header */
.dw-nav-inner { gap: 14px; padding-top: 10px; padding-bottom: 10px; flex-wrap: nowrap; }
.dw-brand-text p { display: none; }
.dw-nav-links { gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.dw-nav-links::-webkit-scrollbar { display: none; }
.dw-tab-btn { white-space: nowrap; padding: 8px 14px; font-size: 14.5px; font-weight: 600; border-radius: 999px; }
.nav-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 1px solid var(--border-subtle); background: rgba(255,255,255,.06); white-space: nowrap; }
.nav-pill.gold { background: linear-gradient(180deg, #ffd978, var(--gold)); color: #2b1c00; border: 0; }
.nav-pill.ghost:hover { background: rgba(255,255,255,.12); }
.nav-user { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); white-space: nowrap; }
.nav-user .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(245,185,66,.18); color: var(--gold); font-weight: 700; }
@media (max-width: 900px) {
  .dw-nav-inner { flex-wrap: wrap; row-gap: 8px; }
  .dw-nav-links { order: 3; width: 100%; }
  .nav-side { margin-inline-start: auto; }
  .nav-hide-sm { display: none; }
}
/* hero */
.hero2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: center; padding: 36px 32px; border-radius: 28px; border: 1px solid var(--border-line);
  background: radial-gradient(700px 360px at 85% 0%, rgba(245,185,66,.16), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(45,212,191,.12), transparent 60%), rgba(17,25,54,.72); }
.hero2 .eyebrow { display: inline-block; font-size: 13.5px; font-weight: 600; color: var(--teal); background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.3); padding: 5px 12px; border-radius: 999px; }
.hero2 h2 { font-size: clamp(30px, 4.4vw, 52px); line-height: 1.25; margin: 14px 0 12px; font-weight: 700; }
.hero2 h2 b { color: var(--gold); }
.hero2 p { font-size: 17px; line-height: 1.85; color: #c9d2e6; margin: 0; max-width: 560px; }
.hero2 .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero2 .cta .dw-btn { padding: 13px 22px; font-size: 16px; }
.hero-points { list-style: none; padding: 0; margin: 22px 0 0; display: flex; gap: 18px; flex-wrap: wrap; color: #c9d2e6; font-size: 14.5px; }
.hero-points li { display: flex; align-items: center; gap: 6px; }
.hero-art { position: relative; height: 320px; }
.hero-art .tile { position: absolute; width: 46%; aspect-ratio: 1; border-radius: 26px; display: grid; place-items: center; box-shadow: 0 24px 50px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); }
.hero-art .tile svg { width: 64%; height: 64%; }
.hero-art .t1 { top: 0; right: 4%; transform: rotate(-6deg); }
.hero-art .t2 { top: 8%; left: 2%; transform: rotate(7deg); }
.hero-art .t3 { bottom: 0; right: 16%; transform: rotate(4deg); z-index: 2; }
.hero-art .t4 { bottom: 6%; left: 14%; transform: rotate(-5deg); }
@media (max-width: 860px) { .hero2 { grid-template-columns: 1fr; padding: 26px 18px; } .hero-art { display: none; } }
/* how it works */
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.how > div { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid var(--border-subtle); }
.how .n { flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; background: rgba(245,185,66,.15); color: var(--gold); }
.how b { display: block; font-size: 16px; margin-bottom: 2px; }
.how span { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
@media (max-width: 760px) { .how { grid-template-columns: 1fr; } }
/* games */
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.sec-head h3 { margin: 0; font-size: 26px; font-weight: 700; }

  function getEightIslandQuestions(catSlug) {
    if (__EIGHT_ISLAND_CACHE[catSlug]) return __EIGHT_ISLAND_CACHE[catSlug].slice();
    var sess = DiwaniyaServerKernel.getSessionUser();
    if (!catSlug || !sess || !sess.user || sess.user.adminRole !== 'owner' || __EIGHT_ISLAND_PENDING[catSlug]) return [];
    __EIGHT_ISLAND_PENDING[catSlug] = true;
    DiwaniyaServerKernel.fetchEightCategory(catSlug).then(function (d) {
      delete __EIGHT_ISLAND_PENDING[catSlug];
      if (d.ok && Array.isArray(d.items)) {

    return [];

  var LOCAL_ROOMS_KEY = 'dw_rooms_local_v1';

  var DiwaniyaServerKernel = (function () {
    var CACHE = {
      games: [], packages: [], categories: [], game_content: [], suggestions: [],
      catQuestionsOverrides: {}, gatewayConnected: false,
      usersList: [], admin_logs: [], payments: [],
      rooms: {} // local multi-tab room preview only (real-time rooms come later)
    };
    var ME = null; // { user, wallet }
    try { CACHE.rooms = JSON.parse(window.localStorage.getItem(LOCAL_ROOMS_KEY) || '{}') || {}; } catch (e) {}

    function api(method, path, body) {
      var headers = { accept: 'application/json' };
      if (body !== undefined) headers['content-type'] = 'application/json';
      if (ME && ME.user && ME.user.csrfToken) headers['x-dw-csrf'] = ME.user.csrfToken;
      return fetch(path, {
        method: method,
        headers: headers,
        credentials: 'same-origin',
        body: body !== undefined ? JSON.stringify(body) : undefined
      }).then(function (r) {
        return r.json().catch(function () { return { error: 'استجابة غير متوقعة من الخادم.' }; }).then(function (d) {
          d = d || {};
          if (d.ok === undefined) d.ok = r.ok;
          if (!d.status) d.status = r.status;
          if (r.status === 401 && path.indexOf('/api/auth/') !== 0) ME = null;
          return d;
        });
      }).catch(function () {
        return { ok: false, status: 0, error: 'تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مجدداً.' };
      });
    }

    function clearAdmin() {
      CACHE.usersList = []; CACHE.admin_logs = []; CACHE.payments = [];
      CACHE.game_content = []; CACHE.catQuestionsOverrides = {};
    }
    function applyMe(d) { ME = d && d.user ? { user: d.user, wallet: d.wallet } : null; }

    function refreshCatalog() {
      return api('GET', '/api/catalog').then(function (d) {
        if (d.ok) {
          ['games', 'packages', 'categories', 'suggestions'].forEach(function (k) {
            if (d[k] !== undefined) CACHE[k] = d[k];
          });
          CACHE.gatewayConnected = !!d.gatewayConnected;
        }
        return d;
      });
    }
    function refreshMe() {
      return api('GET', '/api/me').then(function (d) { if (d.ok) applyMe(d); return d; });
    }
    function refreshAdmin() {
      if (!ME || !ME.user || ME.user.adminRole !== 'owner') { clearAdmin(); return Promise.resolve({ ok: true }); }
      return api('GET', '/api/admin/data').then(function (d) {
        if (d.ok) {
          CACHE.usersList = d.users || [];
          CACHE.admin_logs = d.admin_logs || [];
          CACHE.payments = d.payments || [];
          CACHE.game_content = d.game_content || [];
          CACHE.catQuestionsOverrides = d.catQuestionsOverrides || {};
        }
        return d;
      });
    }
    function refreshAll() {
      return Promise.all([refreshCatalog(), refreshMe()]).then(refreshAdmin);
    }

    return {
      loadDB: function () { return CACHE; },
      saveDB: function (db) {
        try { window.localStorage.setItem(LOCAL_ROOMS_KEY, JSON.stringify((db && db.rooms) || {})); } catch (e) {}
      },
      getSessionUser: function () { return ME; },
      refreshAll: refreshAll,
      refreshMe: refreshMe,
      sendOtp: function (email) {
        return api('POST', '/api/auth/otp/send', { email: email });
      },
      verifyOtp: function (email, code, displayName) {
        return api('POST', '/api/auth/otp/verify', { email: email, code: code, displayName: displayName }).then(function (d) {
          if (!d.ok) return d;
          applyMe(d);
          return refreshAdmin().then(function () { return d; });
        });
      },
      logout: function () {
        return api('POST', '/api/auth/logout', {}).then(function (d) { ME = null; clearAdmin(); return d; });
      },
      launchGame: function (slug, idempotencyKey) {
        return api('POST', '/api/games/' + encodeURIComponent(slug) + '/launch', { idempotencyKey: idempotencyKey }).then(function (d) {
          if (d.wallet && ME) ME.wallet = d.wallet;
          return d;
        });
      },
      createRoom: function (gameSlug) {
        return api('POST', '/api/rooms', { gameSlug: gameSlug || '' });
      },
      paymentStatus: function (orderId) {
        return api('GET', '/api/payments/orders/' + encodeURIComponent(orderId)).then(function (d) {
          if (d.wallet && ME) ME.wallet = d.wallet;
          return d;
        });
      },
      createPaymentOrder: function (pkgId) {
        return api('POST', '/api/payments/orders', { pkgId: pkgId }).then(function (d) {
          if (d.wallet && ME) ME.wallet = d.wallet;
          return d;
        });
      },
      executeAdminAction: function (action, payload) {
        return api('POST', '/api/admin/action', { action: action, payload: payload }).then(function (d) {
          if (!d.ok) return d;
          return refreshAll().then(function () { return d; });
        });
      },
      fetchEightCategory: function (catSlug) {
        return api('GET', '/api/admin/eight-category/' + encodeURIComponent(catSlug));
      },
      submitSuggestion: function (payload) {
        return api('POST', '/api/suggestions', payload).then(function (d) {
          if (d.ok && d.suggestions) CACHE.suggestions = d.suggestions;
          return d;
        });
      }
    };
  })();

        if (!AC) return;
        if (!this.ctx) this.ctx = new AC();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        var o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq || 580, this.ctx.currentTime);
        g.gain.setValueAtTime(0.08, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.08);

  // Price per credit of the smallest package is the reference for "you save".
  function renderPriceCards() {
    var pkgs = STATE.packages.filter(function (p) { return p.is_active; }).sort(function (a, b) { return a.sort_order - b.sort_order; });
    if (!pkgs.length) return '';
    var ref = pkgs.slice().sort(function (a, b) { return a.credits - b.credits; })[0];
    var refPer = ref.price_halalas / ref.credits;
    var gateway = DiwaniyaServerKernel.loadDB().gatewayConnected;
    return '<div class="price-grid">' + pkgs.map(function (p) {
      var full = Math.round(refPer * p.credits);
      var save = full > p.price_halalas ? Math.round((1 - p.price_halalas / full) * 100) : 0;
      var per = sarText(Math.round(p.price_halalas / p.credits));
      var hl = !!p.highlight;
      var btn = !gateway
        ? '<button class="dw-btn dw-btn-sec" disabled>🔒 قريباً</button>'
        : (!STATE.user
          ? '<button class="dw-btn ' + (hl ? 'dw-btn-gold' : 'dw-btn-sec') + '" data-act="open-auth">اشترِ الآن</button>'
          : '<button class="dw-btn ' + (hl ? 'dw-btn-gold' : 'dw-btn-sec') + '" data-act="buy-pkg" data-id="' + esc(p.id) + '"' + (STATE.checkoutInFlight ? ' disabled' : '') + '>💳 اشترِ الآن</button>');
      return '<div class="price-card' + (hl ? ' hl' : '') + '">' +
        (p.badge ? '<span class="pc-badge">' + esc(p.badge) + '</span>' : '') +
        '<div class="pc-name">' + esc(p.name) + '</div>' +
        '<div class="pc-credits">' + arNum(p.credits) + '<small>' + (p.credits === 1 ? 'قيم' : 'أقيام') + '</small></div>' +
        '<div class="pc-price"><b>' + arNum(sarText(p.price_halalas)) + ' <small>ر.س</small></b>' + (save ? '<s>' + arNum(sarText(full)) + '</s>' : '') + '</div>' +
        (save ? '<span class="pc-save">وفّر ' + arNum(save) + '٪</span>' : '<span class="pc-per">السعر الأساسي</span>') +
        (p.credits > 1 ? '<div class="pc-per">≈ ' + arNum(per) + ' ر.س للقيم</div>' : '') +
        '<p class="pc-desc">' + esc(p.description) + '</p>' +
        btn +
      '</div>';
    }).join('') + '</div>';
  }

  function getEditorQuestionsForCurrentSelection() {
    var db = DiwaniyaServerKernel.loadDB();
    if (STATE.editorGameId === 'game_eight') {
      var cSlug = STATE.editorCatSlug || 'honeycomb_ar';
      if (db.catQuestionsOverrides && Array.isArray(db.catQuestionsOverrides[cSlug])) {
        return db.catQuestionsOverrides[cSlug].map(function (q, idx) {
          return {
            id: q.uid || (cSlug + '_' + idx),
            game_id: 'game_eight',
            cat: cSlug,
            difficulty_points: Number(q.points || 200),
            prompt_text: q.q || '',
            answer_text: q.a || '',
            extra_info: q.hint || ''
          };
        });
      }

  // Store room: one shared buzzer + answers for any game. The server (BuzzerRoomDO) owns the state;
  // this client only sends actions and renders the snapshots it receives.
  var ROOM_SYNC = {
    ws: null,
    retry: 0,
    timer: null,
    wanted: false,
    creating: false,
    init: function () {
      var self = this;
      if (STATE.room.code) { self.connect(); return; }
      if (STATE.room.mobileControllerMode) return; // guest without a code: nothing to do
      if (!STATE.user) {
        STATE.room.wsStatus = 'needs_login';
        renderRoomModal();
        return;
      }
      var saved = null;
      try { saved = window.sessionStorage.getItem('dw_host_room_code'); } catch (e) {}
      if (saved) { STATE.room.code = saved; self.connect(); return; }
      if (self.creating) return;
      self.creating = true;
      STATE.room.wsStatus = 'creating';
      renderRoomModal();
      DiwaniyaServerKernel.createRoom(STATE.activeGameSlug || STATE.room.gameSlug || '').then(function (d) {
        self.creating = false;
        if (!d.ok) { STATE.room.wsStatus = 'error'; showToast(d.error || 'تعذر إنشاء الغرفة.'); renderRoomModal(); return; }
        STATE.room.code = d.code;
        try { window.sessionStorage.setItem('dw_host_room_code', d.code); } catch (e) {}
        self.connect();
      });
    },
    connect: function () {
      var self = this;
      self.wanted = true;
      if (self.ws && (self.ws.readyState === 0 || self.ws.readyState === 1)) return;
      var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/rooms/buzz/' + encodeURIComponent(STATE.room.code) + '/ws';
      var ws;
      try { ws = new WebSocket(url); } catch (e) { self.later(); return; }
      self.ws = ws;
      STATE.room.wsStatus = 'reconnecting';
      ws.onopen = function () {
        self.retry = 0;
        STATE.room.wsStatus = 'connected_cloud';
        var tok = null;
        try { tok = window.localStorage.getItem('dw_buzz_token_' + STATE.room.code); } catch (e) {}
        if (tok) self.send({ t: 'resume', token: tok });
        self.ping = setInterval(function () { self.send({ t: 'ping' }); }, 25000);
        renderRoomModal();
      };
      ws.onmessage = function (ev) {
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'hello') {
          STATE.room.isHost = !!m.host;
        } else if (m.t === 'state' && m.room) {
          STATE.room.players = m.room.players || [];
          STATE.room.buzzerOrder = m.room.buzzerOrder || [];
          STATE.room.buzzerLockedBy = m.room.buzzerLockedBy || null;
          STATE.room.currentPrompt = m.room.currentPrompt || '';
          STATE.room.gameSlug = m.room.gameSlug || STATE.room.gameSlug;
          var first = STATE.room.buzzerLockedBy;
          if (first && first.timestampMs !== self.lastFirst) { self.lastFirst = first.timestampMs; STORE_AUDIO.playSfx(840); }
        } else if (m.t === 'me') {
          STATE.room.myPlayerId = m.id;
          STATE.room.myResumeToken = m.token;
          try { window.localStorage.setItem('dw_buzz_token_' + STATE.room.code, m.token); } catch (e) {}
        } else if (m.t === 'kicked' || m.t === 'left') {
          STATE.room.myPlayerId = '';
          try { window.localStorage.removeItem('dw_buzz_token_' + STATE.room.code); } catch (e) {}
          showToast(m.t === 'kicked' ? 'أخرجك المضيف من الغرفة.' : 'طلعت من الغرفة.');
        } else if (m.t === 'err') {
          if (m.err === 'bad_token') { try { window.localStorage.removeItem('dw_buzz_token_' + STATE.room.code); } catch (e) {} }
          else showToast(m.err);
        }
        renderRoomModal();
      };
      ws.onclose = function () {
        clearInterval(self.ping);
        if (self.ws === ws) self.ws = null;
        STATE.room.wsStatus = 'reconnecting';
        renderRoomModal();
        self.later();
      };
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
    },
    later: function () {
      var self = this;
      if (!self.wanted) return;
      clearTimeout(self.timer);
      var wait = Math.min(1000 * Math.pow(2, self.retry++), 10000);
      self.timer = setTimeout(function () {
        // A room that no longer exists stops the retries.
        fetch('/api/rooms/status?code=' + encodeURIComponent(STATE.room.code)).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.exists) self.connect();
          else {
            self.wanted = false;
            STATE.room.wsStatus = 'gone';
            try { window.sessionStorage.removeItem('dw_host_room_code'); } catch (e) {}
            renderRoomModal();
          }
        }).catch(function () { self.later(); });
      }, wait);
    },
    send: function (o) {
      if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; }
      showToast('الاتصال بالغرفة مقطوع، جاري إعادة الاتصال…');
      return false;
    },
    newRoom: function () {
      this.wanted = false;
      if (this.ws) { try { this.ws.close(); } catch (e) {} }
      try { window.sessionStorage.removeItem('dw_host_room_code'); } catch (e) {}
      STATE.room.code = '';
      STATE.room.players = []; STATE.room.buzzerOrder = []; STATE.room.buzzerLockedBy = null;
      this.init();
    }
  };

  window.ROOM_SYNC = ROOM_SYNC;

  function renderRoomModal() {
    var modal = document.getElementById('dwRoomModal');
    var inner = document.getElementById('dwRoomModalInner');
    if (!modal || !inner || !modal.classList.contains('open')) return;
    var R = STATE.room;
    var st = R.wsStatus;
    var statusHtml = st === 'connected_cloud'
      ? '<span class="dw-chip teal">🟢 متصل بخادم الغرف</span>'

  // ============================================================================
  // 5. ATOMIC GAME LAUNCHER WITH IN-FLIGHT MUTEX & SERVER IDEMPOTENCY KEY
  // ============================================================================
  var __LAST_LAUNCH_CLICK = { slug: '', ts: 0, idemKey: '' };

  function launchGameWithCreditCheck(slug, explicitIdemKey) {
    if (!slug) return Promise.resolve({ ok: false, reason: 'missing_slug' });
    if (STATE.launchInFlight) {
      return Promise.resolve({ ok: false, reason: 'launch_in_flight_locked' });
    }
    if (!STATE.user) {
      showToast('سجّل دخولك أول عشان تجرّب اللعبة مجاناً.');
      var authMod = document.getElementById('dwAuthModal');
      if (authMod) authMod.classList.add('open');
      return Promise.resolve({ ok: false, status: 401, reason: 'not_authenticated' });
    }

    var now = Date.now();
    // If rapid click within 1500ms on same game, reuse the exact same Idempotency-Key so server deduplicates
    var idemKey = explicitIdemKey;
    if (!idemKey) {
      if (__LAST_LAUNCH_CLICK.slug === slug && (now - __LAST_LAUNCH_CLICK.ts) < 1500 && __LAST_LAUNCH_CLICK.idemKey) {
        idemKey = __LAST_LAUNCH_CLICK.idemKey;
      } else {
        idemKey = 'idem_' + STATE.user.id + '_' + slug + '_' + now;
        __LAST_LAUNCH_CLICK = { slug: slug, ts: now, idemKey: idemKey };
      }
    }

    STATE.launchInFlight = true;
    render();
    return DiwaniyaServerKernel.launchGame(slug, idemKey).then(function (res) {
      STATE.launchInFlight = false;
      if (!res.ok) {
        showToast(res.error || 'تعذر تشغيل اللعبة.');
        if (res.code === 'INSUFFICIENT_CREDITS') {
          STATE.tab = 'packages';
        }
        if (res.status === 401) document.getElementById('dwAuthModal').classList.add('open');
        render();
        return res;
      }

      STATE.activeGameSlug = slug;
      STATE.room.gameSlug = slug;
      STATE.guideSlug = null;
      render();

      if (!res.deduplicated) {
        showToast(res.isFreeTrial
          ? '🎁 تجربتك المجانية — استمتع!'
          : '✅ انخصم ' + arNum(res.costDeducted) + ' قيم — استمتع!');
      }

      var frameWrap = document.getElementById('dwGameFrameWrap');
      var frameTitle = document.getElementById('dwGameFrameTitle');
      var iframe = document.getElementById('dwGameIframe');
      if (frameWrap && iframe) {
        frameTitle.textContent = cleanTitle(res.gameTitle);
        iframe.onload = function () { syncGameRoleToFrame(); syncAudioButtonsUI(); };
        iframe.removeAttribute('srcdoc');
        iframe.src = res.playUrl;
        frameWrap.classList.add('open');
        var tEl = document.getElementById('dwToast'); if (tEl) tEl.classList.add('in-game');
        var fsBtn = document.getElementById('dwFrameFsBtn');
        if (fsBtn) fsBtn.style.display = (document.fullscreenEnabled || document.webkitFullscreenEnabled) ? '' : 'none';
        syncFrameDemoButton();
      }
      return res;
    });
  }

  window.launchGameWithCreditCheck = launchGameWithCreditCheck;

  // Check URL query parameters for QR room join (?room=XXXX&game=SLUG)
  (function checkUrlRoomJoin() {
    try {
      var params = new URLSearchParams(window.location.search);
      var rCode = params.get('room');
      var gSlug = params.get('game');
      if (rCode && /^[A-Za-z2-9]{6}$/.test(rCode)) {
        STATE.room.code = rCode.toUpperCase();
        STATE.room.mobileControllerMode = true;
        if (gSlug) STATE.room.gameSlug = gSlug;
        setTimeout(function () {
          ROOM_SYNC.init();
          var rmModal = document.getElementById('dwRoomModal');
          if (rmModal) rmModal.classList.add('open');
          renderRoomModal();
        }, 120);
      }
    } catch (e) {}
  })();

  // ============================================================================
  // 6. UNIFIED EVENT LISTENERS
  // ============================================================================
  document.addEventListener('click', function (e) {
    var raw = e.target;
    var base = raw && raw.nodeType === 1 ? raw : (raw && raw.parentElement ? raw.parentElement : null);
    if (!base || !base.closest) return;

    var navBtn = base.closest('[data-nav]');
    if (navBtn) {
      e.preventDefault();
      var targetTab = navBtn.getAttribute('data-nav');
      if (targetTab === 'admin' && (!STATE.user || STATE.user.adminRole !== 'owner')) {
        showToast('🚫 غير مصرح لك بالدخول إلى لوحة الإدارة.');
        return;
      }
      var tabChanged = STATE.tab !== targetTab;
      STATE.tab = targetTab;
      render();
      if (tabChanged || navBtn.closest('.site-foot')) window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var admTabBtn = base.closest('[data-adm-tab]');
    if (admTabBtn) {
      STATE.adminSubTab = admTabBtn.getAttribute('data-adm-tab');
      render();
      return;
    }

    var actBtn = base.closest('[data-act]');
    if (!actBtn) return;
    var act = actBtn.getAttribute('data-act');

    if (act === 'launch-game' || act === 'launch-from-guide') {
      launchGameWithCreditCheck(actBtn.getAttribute('data-slug'));
    } else if (act === 'game-filter') {
      STATE.gameFilter = actBtn.getAttribute('data-f') || 'all';
      render();
    } else if (act === 'scroll-games') {
      var gt = document.getElementById('dwGamesTop');
      if (gt) gt.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (act === 'explain-game') {
      STATE.guideSlug = actBtn.getAttribute('data-slug');
      STATE.guideTabIdx = 0;
      renderGuideModal();
    } else if (act === 'guide-tab') {
      STATE.guideTabIdx = parseInt(actBtn.getAttribute('data-idx'), 10) || 0;
      renderGuideModal();
    } else if (act === 'close-guide') {
      STATE.guideSlug = null;
      renderGuideModal();
    } else if (act === 'preview-cat-questions') {
      STATE.previewCatSlug = actBtn.getAttribute('data-slug');
      renderCategoryPreviewModal();
    } else if (act === 'close-cat-preview') {
      STATE.previewCatSlug = null;
      renderCategoryPreviewModal();
    } else if (act === 'open-room-hub') {
      var rmMod = document.getElementById('dwRoomModal');
      if (rmMod) rmMod.classList.add('open');
      ROOM_SYNC.init();
      renderRoomModal();
    } else if (act === 'close-room-hub') {
      var rmMod2 = document.getElementById('dwRoomModal');
      if (rmMod2) rmMod2.classList.remove('open');
    } else if (act === 'room-new') {
      ROOM_SYNC.newRoom();
    } else if (act === 'room-copy-link') {
      var link = window.location.origin + '/?room=' + encodeURIComponent(STATE.room.code);
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(function () { showToast('تم نسخ الرابط'); });
    } else if (act === 'room-join-human') {
      var pName = ((document.getElementById('mobPlayerName') || {}).value || '').trim();
      var pTeam = (document.getElementById('mobPlayerTeam') || {}).value || 'الفريق الأول 🔵';
      if (!pName) { showToast('اكتب اسمك أولاً'); return; }
      ROOM_SYNC.send({ t: 'join', name: pName, team: pTeam });
    } else if (act === 'room-buzz-now') {
      if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e2) {} }
      ROOM_SYNC.send({ t: 'buzz' });
    } else if (act === 'room-reset-buzzer') {
      if (ROOM_SYNC.send({ t: 'reset' })) showToast('🔄 الجرس مفتوح لجولة جديدة');
    } else if (act === 'room-set-prompt') {
      ROOM_SYNC.send({ t: 'prompt', text: (document.getElementById('roomPromptInp') || {}).value || '' });
    } else if (act === 'room-score') {
      ROOM_SYNC.send({ t: 'score', id: actBtn.getAttribute('data-id'), delta: parseInt(actBtn.getAttribute('data-delta'), 10) });
    } else if (act === 'room-kick') {
      ROOM_SYNC.send({ t: 'kick', id: actBtn.getAttribute('data-id') });
    } else if (act === 'room-leave') {
      ROOM_SYNC.send({ t: 'leave' });
    } else if (act === 'room-send-answer' || act === 'room-send-vote') {
      var ansInp = document.getElementById('mobAnswerInp');
      var ansTxt = ((ansInp || {}).value || '').trim();
      if (!ansTxt) { showToast('اكتب شي أولاً'); return; }
      if (ROOM_SYNC.send({ t: act === 'room-send-answer' ? 'answer' : 'vote', text: ansTxt })) {
        if (ansInp) ansInp.value = '';
        showToast(act === 'room-send-answer' ? '✍️ وصلت إجابتك للشاشة' : '🗳️ وصل تصويتك');
      }
    } else if (act === 'toggle-frame-demo') {
      var dIfr = document.getElementById('dwGameIframe');
      if (dIfr && dIfr.src) {
        var dUrl = new URL(dIfr.src, window.location.href);
        if (dUrl.searchParams.get('demo') === '1') dUrl.searchParams.delete('demo'); else dUrl.searchParams.set('demo', '1');
        dIfr.src = dUrl.pathname + dUrl.search;
        syncFrameDemoButton();
      }
    } else if (act === 'toggle-frame-fullscreen') {
      var fsWrap = document.getElementById('dwGameFrameWrap');
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else {
        var req = fsWrap.requestFullscreen || fsWrap.webkitRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(fsWrap)).then(function () {
            try { if (screen.orientation && screen.orientation.lock && window.innerWidth > window.innerHeight) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
          }).catch(function () {});
        }
      }
    } else if (act === 'close-game-frame') {
      var fw = document.getElementById('dwGameFrameWrap');
      var ifr = document.getElementById('dwGameIframe');
      if (fw) fw.classList.remove('open');
      var tEl2 = document.getElementById('dwToast'); if (tEl2) tEl2.classList.remove('in-game');
      if (document.fullscreenElement || document.webkitFullscreenElement) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
      if (ifr) { ifr.onload = null; ifr.removeAttribute('srcdoc'); ifr.src = 'about:blank'; }
    } else if (act === 'filter-cat-grp') {
      STATE.catFilterGroup = actBtn.getAttribute('data-grp');
      render();
    } else if (act === 'open-auth') {
      document.getElementById('dwAuthModal').classList.add('open');
    } else if (act === 'close-auth') {
      document.getElementById('dwAuthModal').classList.remove('open');
    } else if (act === 'send-otp') {
      var em = (document.getElementById('authEmailInp').value || '').trim();
      var rlBox = document.getElementById('authRateLimitNotice');
      if (rlBox) rlBox.style.display = 'none';
      var sendBtn = document.getElementById('sendOtpBtn');
      if (sendBtn) sendBtn.disabled = true;
      DiwaniyaServerKernel.sendOtp(em).then(function (otpRes) {
        if (sendBtn) sendBtn.disabled = false;
        if (!otpRes.ok) {
          if (rlBox) {
            rlBox.textContent = otpRes.error;
            rlBox.style.display = 'block';
          }
          showToast(otpRes.error);
          return;
        }
        STATE.pendingOtpEmail = em;
        document.getElementById('otpStepBox').style.display = 'block';
        var otpInp = document.getElementById('authOtpInp');
        if (otpInp) otpInp.focus();
        showToast(otpRes.message);
      });
    } else if (act === 'verify-otp') {
      var codeInp = (document.getElementById('authOtpInp').value || '').trim();
      var nameInp = (document.getElementById('authNameInp').value || '').trim();
      var em2 = STATE.pendingOtpEmail || (document.getElementById('authEmailInp').value || '').trim();
      var rlBox2 = document.getElementById('authRateLimitNotice');
      if (rlBox2) rlBox2.style.display = 'none';

      DiwaniyaServerKernel.verifyOtp(em2, codeInp, nameInp).then(function (verRes) {
        if (!verRes.ok) {
          if (rlBox2) {
            rlBox2.textContent = verRes.error;
            rlBox2.style.display = 'block';
          }
          showToast(verRes.error);
          return;
        }
        document.getElementById('dwAuthModal').classList.remove('open');
        document.getElementById('otpStepBox').style.display = 'none';
        document.getElementById('authOtpInp').value = '';
        render();
        showToast('مرحباً بك في ديوانية بلس يا ' + STATE.user.displayName + (STATE.user.adminRole === 'owner' ? ' (صلاحية المالك)' : '') + '!');
      });
    } else if (act === 'logout') {
      DiwaniyaServerKernel.logout().then(function () {
        STATE.tab = 'store';
        render();
        showToast('تم تسجيل الخروج وإنهاء الجلسة بنجاح.');
      });
    } else if (act === 'buy-pkg') {
      if (!STATE.user) {
        showToast('🔐 سجّل دخولك أولاً لطلب الباقة.');
        document.getElementById('dwAuthModal').classList.add('open');
        return;
      }
      var pkgId = actBtn.getAttribute('data-id');
      if (STATE.checkoutInFlight) return;
      STATE.checkoutInFlight = true;
      render();
      DiwaniyaServerKernel.createPaymentOrder(pkgId).then(function (payRes) {
        if (!payRes.ok || !payRes.checkoutUrl) {
          STATE.checkoutInFlight = false;
          render();
          showToast(payRes.error || 'تعذر بدء عملية الدفع.');
          return;
        }
        showToast(payRes.message || 'جاري تحويلك لصفحة الدفع…');
        window.location.href = payRes.checkoutUrl;
      });
    } else if (act === 'adm-reset-trials') {
      var selU = document.getElementById('admUserSelect');
      var uidTarget = selU ? selU.value : (STATE.user ? STATE.user.id : '');
      adminCall('reset_trials', { userId: uidTarget }, function (rRes) {
        render();
        showToast(rRes.message);
      });
    } else if (act === 'adm-adjust-credit') {
      var uid = (document.getElementById('admUserSelect') || {}).value;
      var delta = parseInt((document.getElementById('admCreditDelta') || {}).value, 10);
      var reason = ((document.getElementById('admCreditReason') || {}).value || '').trim();
      adminCall('adjust_credit', {
        userId: uid,
        delta: delta,
        reason: reason
      }, function (adjRes) {
        render();
        showToast(adjRes.message);
      });
    } else if (act === 'adm-toggle-user') {
      var tuid = actBtn.getAttribute('data-id');
      adminCall('toggle_user', { userId: tuid }, function (tgRes) {
        render();
        showToast(tgRes.message);
      });
    } else if (act === 'adm-save-pkg') {
      adminCall('save_pkg', {
        name: (document.getElementById('pkgName') || {}).value,
        credits: (document.getElementById('pkgCredits') || {}).value,
        priceSar: (document.getElementById('pkgPriceSar') || {}).value,
        badge: (document.getElementById('pkgBadge') || {}).value,
        description: (document.getElementById('pkgDesc') || {}).value
      }, function (spRes) {
        render();
        showToast(spRes.message);
      });
    } else if (act === 'adm-toggle-pkg') {
      adminCall('toggle_pkg', { pkgId: actBtn.getAttribute('data-id') }, function (tpRes) {
        render();
        showToast(tpRes.message);
      });
    } else if (act === 'toggle-store-voice') {
      STATE.storeVoiceOn = !STATE.storeVoiceOn;
      syncAudioButtonsUI();
      render();
      showToast(STATE.storeVoiceOn ? '🔊 تم تفعيل الصوت العام في المنصة' : '🔇 تم إغلاق الصوت العام في المنصة');
    } else if (act === 'toggle-store-sfx') {
      STATE.storeSfxOn = !STATE.storeSfxOn;
      if (STATE.storeSfxOn) STORE_AUDIO.playSfx(660);
      syncAudioButtonsUI();
      render();
      showToast(STATE.storeSfxOn ? '🎵 تم تفعيل المؤثرات الصوتية (SFX)' : '🔕 تم إغلاق المؤثرات الصوتية فقط');
    } else if (act === 'submit-game-suggestion') {
      DiwaniyaServerKernel.submitSuggestion({
        title: (document.getElementById('sugTitleInp') || {}).value,
        url: (document.getElementById('sugUrlInp') || {}).value,
        userName: (document.getElementById('sugUserInp') || {}).value,
        notes: (document.getElementById('sugNotesInp') || {}).value
      }).then(function (sugRes) {
        if (!sugRes.ok) { showToast(sugRes.error); return; }
        STORE_AUDIO.playSfx(720);
        render();
        showToast('✅ شكراً! وصلت فكرتك لفريقنا.');
      });
    } else if (act === 'adm-save-game') {
      var gsSlug = ((document.getElementById('gmSlug') || {}).value || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      var gEngVal = ((document.getElementById('gmEngineSel') || {}).value || 'mystery_button');
      var gTitleVal = ((document.getElementById('gmTitle') || {}).value || '').trim();
      adminCall('save_game', {
        title: gTitleVal,
        slug: gsSlug,
        engineType: gEngVal,
        costCredits: (document.getElementById('gmCost') || {}).value,
        minPlayers: (document.getElementById('gmMinP') || {}).value,
        maxPlayers: (document.getElementById('gmMaxP') || {}).value,
        sortOrder: (document.getElementById('gmSort') || {}).value,
        rules: (document.getElementById('gmRules') || {}).value,
        description: (document.getElementById('gmDesc') || {}).value
      }, function (sgRes) {
        if (!GAME_GUIDES[gsSlug]) {
          GAME_GUIDES[gsSlug] = {
            title: 'شرح لعبة: ' + gTitleVal,
            subtitle: 'لعبة مضافة من لوحة الإدارة',
            tabs: [{ id: 'idea', label: 'فكرة اللعبة وقواعدها', lead: 'لعبة مضافة من محرر الألعاب في لوحة الإدارة.', steps: [{ h: 'القواعد الأساسية', t: 'تعمل اللعبة مباشرة عبر شاشة التلفزيون والجوالات بالـ QR.' }] }]
          };
        }
        STORE_AUDIO.playSfx(680);
        render();
        showToast(sgRes.message);
      });
    } else if (act === 'adm-toggle-game') {
      adminCall('toggle_game', { gameId: actBtn.getAttribute('data-id') }, function (tgmRes) {
        render();
        showToast(tgmRes.message);
      });
    } else if (act === 'adm-open-cat-editor') {
      STATE.adminSubTab = 'editor';
      STATE.editorGameId = 'game_eight';
      STATE.editorCatSlug = actBtn.getAttribute('data-slug') || 'honeycomb_ar';
      STATE.editingItemId = null;
      render();
    } else if (act === 'adm-add-content') {
      var pr = ((document.getElementById('edPrompt') || {}).value || '').trim();
      var an = ((document.getElementById('edAnswer') || {}).value || '').trim();
      var inf = ((document.getElementById('edInfo') || {}).value || '').trim();
      var pts = ((document.getElementById('edPointsSelect') || {}).value || '200');
      var catN = ((document.getElementById('edCustomCatInp') || {}).value || 'عام');
      if (!pr || !an) { showToast('أدخل نص السؤال والإجابة الصحيحة أولاً'); return; }
      adminCall('add_content', {
        gameId: STATE.editorGameId,
        catSlug: STATE.editorCatSlug,
        catName: catN,
        points: pts,
        promptText: pr,
        answerText: an,
        extraInfo: inf
      }, function (acRes) {
        render();
        showToast(acRes.message);
      });
    } else if (act === 'adm-start-edit-content') {
      STATE.editingItemId = actBtn.getAttribute('data-id');
      render();
    } else if (act === 'adm-cancel-edit-content') {
      STATE.editingItemId = null;
      render();
    } else if (act === 'adm-save-edit-content') {
      var pr2 = ((document.getElementById('edPrompt') || {}).value || '').trim();
      var an2 = ((document.getElementById('edAnswer') || {}).value || '').trim();
      var inf2 = ((document.getElementById('edInfo') || {}).value || '').trim();
      var pts2 = ((document.getElementById('edPointsSelect') || {}).value || '200');
      if (!pr2 || !an2) { showToast('نص السؤال والإجابة مطلوبان.'); return; }
      adminCall('edit_content', {
        gameId: STATE.editorGameId,
        catSlug: STATE.editorCatSlug,
        itemId: STATE.editingItemId,
        points: pts2,
        promptText: pr2,
        answerText: an2,
        extraInfo: inf2
      }, function (ecRes) {
        STATE.editingItemId = null;
        render();
        showToast(ecRes.message);
      });
    } else if (act === 'adm-del-content') {
      adminCall('del_content', {
        gameId: STATE.editorGameId,
        catSlug: STATE.editorCatSlug,
        itemId: actBtn.getAttribute('data-id')
      }, function (dcRes) {
        render();
        showToast(dcRes.message);
      });
    } else if (act === 'adm-export-json') {
      var currentItems = getEditorQuestionsForCurrentSelection();
      var blob = new Blob([JSON.stringify(currentItems, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'diwaniya_plus_' + STATE.editorGameId + '_' + (STATE.editorCatSlug || 'content') + '.json';
      a.click();
      showToast('تم تصدير ملف المحتوى (' + currentItems.length + ' عنصر) بصيغة JSON.');
    } else if (act === 'adm-add-cat') {
      adminCall('add_cat', {
        name: (document.getElementById('catNewName') || {}).value,
        group: (document.getElementById('catNewGroup') || {}).value,
        icon: (document.getElementById('catNewIcon') || {}).value,
        description: (document.getElementById('catNewDesc') || {}).value
      }, function (adCatRes) {
        render();
        showToast(adCatRes.message);
      });
    } else if (act === 'adm-add-admin' || act === 'adm-remove-admin') {
      var adminEmail = act === 'adm-add-admin' ? ((document.getElementById('admNewAdminEmail') || {}).value || '').trim() : actBtn.getAttribute('data-email');
      if (!adminEmail) { showToast('اكتب الإيميل أول'); return; }
      if (act === 'adm-remove-admin' && !window.confirm('تشيل صلاحية الأدمن من ' + adminEmail + '؟')) return;
      adminCall('set_admin', { email: adminEmail, makeAdmin: act === 'adm-add-admin' }, function (aRes) {
        render();
        showToast(aRes.message);
      });
    } else if (act === 'adm-verify-payment') {
      adminCall('verify_payment', { orderId: actBtn.getAttribute('data-id') }, function (vRes) {
        render();
        showToast(vRes.message);
      });
    } else if (act === 'adm-toggle-cat') {
      adminCall('toggle_cat', { catId: actBtn.getAttribute('data-id') }, function (tgCatRes) {
        render();
        showToast(tgCatRes.message);
      });
    }
  });

  // Esc or a click on the dark backdrop closes any open window.
  function closeAllModals() {
    STATE.guideSlug = null;
    STATE.previewCatSlug = null;
    document.querySelectorAll('.dw-modal-backdrop.open').forEach(function (m) { m.classList.remove('open'); });
    renderGuideModal();
    renderCategoryPreviewModal();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.querySelector('.dw-modal-backdrop.open')) closeAllModals();
  });
  document.addEventListener('mousedown', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('dw-modal-backdrop')) closeAllModals();
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'edGameSelect') {
      STATE.editorGameId = t.value;
      STATE.editingItemId = null;
      render();
    } else if (t.id === 'edCatSelect') {
      STATE.editorCatSlug = t.value;
      STATE.editingItemId = null;
      render();
    } else if (t.id === 'admImportJsonInp' && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed)) { showToast('ملف JSON يجب أن يحتوي على مصفوفة أسئلة.'); return; }
          adminCall('import_content', {
            gameId: STATE.editorGameId,
            catSlug: STATE.editorCatSlug,
            items: parsed
          }, function (impRes) {
            render();
            showToast(impRes.message);
          });
        } catch (err) {
          showToast('خطأ في قراءة ملف JSON.');
        }
      };
      reader.readAsText(t.files[0]);
    } else if (t.hasAttribute('data-act-change-cost')) {
      var gid = t.getAttribute('data-act-change-cost');
      adminCall('update_game_cost', {
        gameId: gid,
        costCredits: t.value
      }, function (upRes) {
        render();
        showToast(upRes.message);
      });
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'dwCatSearchInp') {
      STATE.catSearch = t.value;
      render();
      var inp = document.getElementById('dwCatSearchInp');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    } else if (t.id === 'edSearchInp') {
      STATE.editorSearch = t.value;
      render();
      var inp2 = document.getElementById('edSearchInp');
      if (inp2) { inp2.focus(); inp2.setSelectionRange(inp2.value.length, inp2.value.length); }
    }
  });

  var RETURN_PARAMS = (function () {
    try {
      var q = new URLSearchParams(window.location.search);
      if (!q.get('payment') && !q.get('tab')) return null;
      var info = { tab: q.get('tab'), payment: q.get('payment'), order: q.get('order') };
      q.delete('payment'); q.delete('order'); q.delete('tab');
      var rest = q.toString();
      window.history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : ''));
      return info;
    } catch (e) { return null; }
  })();
  if (RETURN_PARAMS && ['store', 'packages', 'wallet', 'categories'].indexOf(RETURN_PARAMS.tab) !== -1) STATE.tab = RETURN_PARAMS.tab;

  function announcePaymentResult(status) {
    if (status === 'paid') showToast('🎉 تم الدفع بنجاح وانضافت الأقيام لمحفظتك!');
    else if (status === 'pending') showToast('⏳ لم يكتمل الدفع بعد. إذا دفعت، بتنضاف الأقيام خلال لحظات.');
    else if (status === 'failed' || status === 'expired' || status === 'canceled') showToast('❌ لم تتم عملية الدفع، وما انخصم منك شي.');
  }

  render();
  DiwaniyaServerKernel.refreshAll().then(function () {
    STATE.catalogLoaded = true;
    render();
    if (RETURN_PARAMS && RETURN_PARAMS.payment && RETURN_PARAMS.order && STATE.user) {
      DiwaniyaServerKernel.paymentStatus(RETURN_PARAMS.order).then(function (d) {
        render();
        announcePaymentResult(d.ok && d.order ? d.order.status : RETURN_PARAMS.payment);
      });
    }
  });
})();

</script>
