/* ============================================================================
 * ديوانية بلس (Diwaniya+) — Luxury Royal Night Commercial Platform Stylesheet
 * Responsive for iPad (Safari), Mobile, Desktop, and TV Screens
 * ============================================================================ */
:root {
  --bg-deep: #0A0F24;
  --bg-surface: #111936;
  --bg-card: rgba(23, 33, 68, 0.78);
  --bg-glass: rgba(15, 23, 48, 0.88);
  --border-line: rgba(245, 185, 66, 0.18);
  --border-subtle: rgba(255, 255, 255, 0.11);
  --gold: #F5B942;
  --gold-light: #FFE08A;
  --teal: #2DD4BF;
  --teal-dark: #0D9488;
  --coral: #F97316;
  --rose: #F43F5E;
  --emerald: #10B981;
  --text-main: #F8FAFC;
  --text-muted: #94A3B8;
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-md: 12px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: -apple-system, "SF Arabic", "Segoe UI", Tajawal, Cairo, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}

body {
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(245, 185, 66, 0.14) 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 10%, rgba(45, 212, 191, 0.10) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-deep) 65%);
  min-height: 100vh;
  min-height: 100dvh;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Navbar */
.dw-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 15, 36, 0.88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-subtle);
  padding: max(12px, env(safe-area-inset-top)) 20px 12px;
}

.dw-nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.dw-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text-main);
}

.dw-brand-logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--gold), #D97706);
  display: grid;
  place-items: center;
  color: #1A1100;
  font-weight: 900;
  font-size: 22px;
  box-shadow: 0 6px 18px rgba(245, 185, 66, 0.3);
}

.dw-brand-text h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.3px;
}

.dw-brand-text h1 span {
  color: var(--gold);
}

.dw-brand-text p {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
}

.dw-nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.dw-tab-btn {
  padding: 9px 15px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 14px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  transition: all 0.15s;
}

.dw-tab-btn.active, .dw-tab-btn:hover {
  color: var(--text-main);
  background: rgba(245, 185, 66, 0.14);
  border-color: var(--border-line);
}

.dw-tab-btn.admin-tab {
  color: var(--teal);
  border-color: rgba(45, 212, 191, 0.35);
}

.dw-spacer {
  flex: 1;
}

.dw-wallet-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(245, 185, 66, 0.2), rgba(245, 185, 66, 0.08));
  border: 1px solid rgba(245, 185, 66, 0.5);
  font-weight: 900;
  font-size: 14px;
  color: var(--gold-light);
}

.dw-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 15px;
  transition: transform 0.12s, opacity 0.12s;
}

.dw-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.dw-btn-gold {
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  color: #1E1300;
  box-shadow: 0 6px 18px rgba(245, 185, 66, 0.28);
}

.dw-btn-teal {
  background: linear-gradient(180deg, var(--teal), var(--teal-dark));
  color: #042f2e;
  box-shadow: 0 6px 18px rgba(45, 212, 191, 0.25);
}

.dw-btn-sec {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
}

.dw-btn-danger {
  background: rgba(244, 63, 94, 0.2);
  border: 1px solid rgba(244, 63, 94, 0.5);
  color: #FECDD3;
}

.dw-btn-sm {
  padding: 7px 12px;
  font-size: 13px;
  border-radius: 10px;
}

/* Container & Sections */
.dw-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.dw-hero {
  border-radius: 26px;
  padding: 32px 28px;
  background:
    radial-gradient(700px 300px at 10% 0%, rgba(245, 185, 66, 0.18), transparent 70%),
    linear-gradient(145deg, rgba(23, 33, 68, 0.9), rgba(10, 15, 36, 0.92));
  border: 1px solid var(--border-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.dw-hero-content {
  max-width: 680px;
}

.dw-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 999px;
  background: rgba(45, 212, 191, 0.14);
  border: 1px solid rgba(45, 212, 191, 0.45);
  color: var(--teal);
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 10px;
}

.dw-hero h2 {
  margin: 0;
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 900;
  line-height: 1.25;
}

.dw-hero h2 b {
  color: var(--gold);
}

.dw-hero p {
  margin: 10px 0 0;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1.75;
}

/* Grid Cards */
.dw-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: 20px;
}

.dw-grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.dw-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: border-color 0.15s, transform 0.15s;
}

.dw-card:hover {
  border-color: var(--border-line);
}

.dw-game-card-head {
  display: flex;
  align-items: center;
  gap: 14px;
}

.dw-game-icon {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(245, 185, 66, 0.22), rgba(45, 212, 191, 0.14));
  border: 1px solid var(--border-line);
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 900;
  color: var(--gold);
  flex: none;
}

.dw-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-subtle);
  font-size: 12.5px;
  font-weight: 700;
}

.dw-chip.gold {
  background: rgba(245, 185, 66, 0.18);
  border-color: rgba(245, 185, 66, 0.5);
  color: var(--gold-light);
}

.dw-chip.teal {
  background: rgba(45, 212, 191, 0.16);
  border-color: rgba(45, 212, 191, 0.45);
  color: #99F6E4;
}

/* Inputs & Tables */
.dw-input, .dw-select, .dw-textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: rgba(5, 9, 22, 0.65);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  font-size: 15px;
  outline: none;
}

.dw-input:focus, .dw-select:focus, .dw-textarea:focus {
  border-color: var(--gold);
}

.dw-table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
}

.dw-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: right;
}

.dw-table th, .dw-table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.dw-table th {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  font-weight: 800;
}

/* Category Explorer */
.dw-cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  /* rows always as tall as their card: Safari used to squeeze them into thin lines inside a fixed-height box */
  grid-auto-rows: max-content;
  gap: 12px;
  padding: 4px;
}
.dw-cat-grid > .dw-cat-item { min-height: max-content; }

.dw-cat-item {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dw-cat-item b {
  font-size: 14.5px;
}

/* Modal & Toast */
.dw-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(4, 7, 18, 0.82);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: none;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}

.dw-modal-backdrop.open {
  display: grid;
}

.dw-modal {
  width: 100%;
  max-width: 520px;
  background: var(--bg-surface);
  border: 1px solid var(--border-line);
  border-radius: 24px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
}

.dw-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  background: #162044;
  border: 1px solid var(--gold);
  color: var(--text-main);
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 800;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  display: none;
}

.dw-toast.show {
  display: block;
}

/* Game Fullscreen Modal Frame */
.dw-game-frame-wrap {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: var(--bg-deep);
  display: none;
  flex-direction: column;
}

.dw-game-frame-wrap.open {
  display: flex;
}

.dw-game-frame-bar {
  flex-shrink: 0;
  min-height: 52px;
  background: #080C1D;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
  padding-top: max(6px, env(safe-area-inset-top));
  gap: 10px;
}
.fb-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-actions { display: flex; gap: 6px; flex-shrink: 0; }
.fb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 40px; height: 40px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid var(--border-subtle); white-space: nowrap; }
.fb-btn.off { opacity: .55; }
.fb-close { background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.5); color: #fecdd3; }
@media (max-width: 640px) { .fb-btn .lbl { display: none; } .fb-btn { padding: 0 10px; } .fb-title { font-size: 15px; } }
@media (orientation: landscape) and (max-height: 540px) {
  .dw-game-frame-bar { min-height: 40px; padding-top: max(3px, env(safe-area-inset-top)); padding-bottom: 3px; }
  .fb-btn { height: 32px; min-width: 34px; padding: 0 9px; border-radius: 10px; font-size: 14px; }
  .fb-btn .lbl { display: none; }
  .fb-title { font-size: 14px; }
}
.dw-game-frame-wrap:fullscreen { width: 100vw; height: 100vh; }
.dw-toast.in-game { bottom: auto; top: calc(58px + env(safe-area-inset-top)); padding: 8px 14px; font-size: 13px; max-width: min(92vw, 440px); text-align: center; border-radius: 12px; }

.dw-game-frame {
  flex: 1;
  min-height: 0;
  width: 100%;
  border: 0;
}


/* Luxury Game Emblem Banner & Crest */
.dw-crest-banner {
  position: relative;
  height: 168px;
  border-radius: 18px;
  margin: -6px -6px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid rgba(245, 185, 66, 0.28);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55), 0 10px 24px rgba(0, 0, 0, 0.35);
}

.dw-crest-banner svg {
  width: 132px;
  height: 132px;
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.65));
  transition: transform 0.25s cubic-bezier(0.2, 1.2, 0.4, 1);
}

.dw-card:hover .dw-crest-banner svg {
  transform: scale(1.07) translateY(-2px);
}

.dw-free-ribbon {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 5px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, #10B981, #059669);
  color: #fff;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.28);
}

.dw-used-ribbon {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.78);
  color: var(--gold-light);
  font-size: 11.5px;
  font-weight: 800;
  border: 1px solid rgba(245, 185, 66, 0.35);
}

.dw-guide-modal {
  max-width: 680px;
}

.dw-guide-step {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 12px 14px;
}

.dw-guide-step-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #D97706);
  color: #1A1100;
  font-weight: 900;
  display: grid;
  place-items: center;
  flex: none;
}


/* ===================== 2026 storefront refresh ===================== */
html, body { font-family: "IBM Plex Sans Arabic", -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif; }
.dw-container { max-width: 1240px; }
/* header */
.dw-nav-inner { gap: 14px; padding-top: 10px; padding-bottom: 10px; flex-wrap: nowrap; }
.dw-brand-text p { display: none; }
.dw-nav-links { gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.dw-nav-links::-webkit-scrollbar { display: none; }
.dw-tab-btn { white-space: nowrap; padding: 8px 14px; font-size: 14.5px; font-weight: 600; border-radius: 999px; }
.nav-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.nav-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 1px solid var(--border-subtle); background: rgba(255,255,255,.06); white-space: nowrap; }
.nav-pill.gold { background: linear-gradient(180deg, #ffd978, var(--gold)); color: #2b1c00; border: 0; }
.nav-pill.ghost:hover { background: rgba(255,255,255,.12); }
.nav-user { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); white-space: nowrap; }
.nav-user .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(245,185,66,.18); color: var(--gold); font-weight: 700; }
@media (max-width: 900px) {
  .dw-nav-inner { flex-wrap: wrap; row-gap: 8px; }
  .dw-nav-links { order: 3; width: 100%; }
  .nav-side { margin-inline-start: auto; }
  .nav-hide-sm { display: none; }
}
/* hero */
.hero2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: center; padding: 36px 32px; border-radius: 28px; border: 1px solid var(--border-line);
  background: radial-gradient(700px 360px at 85% 0%, rgba(245,185,66,.16), transparent 60%), radial-gradient(600px 400px at 0% 100%, rgba(45,212,191,.12), transparent 60%), rgba(17,25,54,.72); }
.hero2 .eyebrow { display: inline-block; font-size: 13.5px; font-weight: 600; color: var(--teal); background: rgba(45,212,191,.1); border: 1px solid rgba(45,212,191,.3); padding: 5px 12px; border-radius: 999px; }
.hero2 h2 { font-size: clamp(30px, 4.4vw, 52px); line-height: 1.25; margin: 14px 0 12px; font-weight: 700; }
.hero2 h2 b { color: var(--gold); }
.hero2 p { font-size: 17px; line-height: 1.85; color: #c9d2e6; margin: 0; max-width: 560px; }
.hero2 .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero2 .cta .dw-btn { padding: 13px 22px; font-size: 16px; }
.hero-points { list-style: none; padding: 0; margin: 22px 0 0; display: flex; gap: 18px; flex-wrap: wrap; color: #c9d2e6; font-size: 14.5px; }
.hero-points li { display: flex; align-items: center; gap: 6px; }
.hero-art { position: relative; height: 320px; }
.hero-art .tile { position: absolute; width: 46%; aspect-ratio: 1; border-radius: 26px; display: grid; place-items: center; box-shadow: 0 24px 50px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.08); }
.hero-art .tile svg { width: 64%; height: 64%; }
.hero-art .t1 { top: 0; right: 4%; transform: rotate(-6deg); }
.hero-art .t2 { top: 8%; left: 2%; transform: rotate(7deg); }
.hero-art .t3 { bottom: 0; right: 16%; transform: rotate(4deg); z-index: 2; }
.hero-art .t4 { bottom: 6%; left: 14%; transform: rotate(-5deg); }
@media (max-width: 860px) { .hero2 { grid-template-columns: 1fr; padding: 26px 18px; } .hero-art { display: none; } }
/* how it works */
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.how > div { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid var(--border-subtle); }
.how .n { flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; background: rgba(245,185,66,.15); color: var(--gold); }
.how b { display: block; font-size: 16px; margin-bottom: 2px; }
.how span { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  // Shrinks a photo in the browser (max 1280px, under ~400KB) before it is uploaded.
  function compressImageFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('اختر ملف صورة.')); return; }
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () {
        URL.revokeObjectURL(url);
        var scale = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.naturalWidth * scale));
        cv.height = Math.max(1, Math.round(im.naturalHeight * scale));
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        var q = 0.85;
        (function attempt() {
          cv.toBlob(function (b) {
            if (!b) { reject(new Error('تعذر تجهيز الصورة.')); return; }
            if (b.size > 400 * 1024 && q > 0.45) { q -= 0.12; attempt(); return; }
            if (b.size > 440 * 1024) { reject(new Error('الصورة كبيرة حتى بعد الضغط.')); return; }
            resolve(b);
          }, 'image/jpeg', q);
        })();
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('الملف مو صورة صالحة.')); };
      im.src = url;
    });
  }
  // Wires an <input type=file data-upload-target="inputId"> to fill the target with the uploaded address.

    }).then(function (d) {

  // ---- question media: { t: 'image' | 'audio' | 'video' | 'youtube', u: address } ----
  function youTubeIdOf(u) {
    try {
      var x = new URL(u);
      var h = x.hostname.replace(/^(www|m|music)\./, '');
      var id = '';
      if (h === 'youtu.be') id = x.pathname.slice(1).split('/')[0];
      else if (h === 'youtube.com' || h === 'youtube-nocookie.com') id = x.searchParams.get('v') || ((x.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]+)/) || [])[1] || '');
      return /^[A-Za-z0-9_-]{6,20}$/.test(id) ? id : '';
    } catch (e) { return ''; }
  }
  function kindOfUrl(u) {
    if (youTubeIdOf(u)) return 'youtube';
    if (/\.(mp3|m4a|aac|wav|ogg|oga)(\?|#|$)/i.test(u)) return 'audio';
    if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u)) return 'video';

  function guessMimeFromName(name) {
    var ext = String(name || '').split('.').pop().toLowerCase();
    var map = { heic: 'image/heic', heif: 'image/heif', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif',
      mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', opus: 'audio/ogg', amr: 'audio/amr', flac: 'audio/flac',
      mp4: 'video/mp4', mov: 'video/quicktime', m4v: 'video/x-m4v', webm: 'video/webm', mkv: 'video/x-matroska', avi: 'video/x-msvideo', '3gp': 'video/3gpp', wmv: 'video/x-ms-wmv' };
    return map[ext] || '';
  }
  function qeUpload(slot, file) {
    var e = STATE.qEditor;
    if (!e || !file) return;
    var ftype = file.type || guessMimeFromName(file.name);
    if (ftype !== file.type) file = new File([file], file.name, { type: ftype });
    var kind = /^image\//.test(ftype) ? 'image' : /^audio\//.test(ftype) ? 'audio' : /^video\//.test(ftype) ? 'video' : '';
    if (!kind) { showToast('نوع الملف غير مدعوم.'); return; }
    var lim = DiwaniyaServerKernel.loadDB().media || { imageMb: 8, audioMb: 8, videoMb: 15 };
    var maxMb = kind === 'audio' ? lim.audioMb : kind === 'video' ? lim.videoMb : Math.max(lim.imageMb, 20);
    if (file.size > maxMb * 1024 * 1024) { showToast('الملف كبير. الحد ' + arNum(maxMb) + ' ميقابايت' + (kind === 'video' ? '. للمقاطع الأطول حط رابط يوتيوب.' : '.')); return; }
    e.busy[slot] = true; renderQEditorModal();
    // Photos are shrunk for fast loading; a format the browser can't open (e.g. HEIC on some devices) is sent as it is.
    var ready = kind === 'image' && file.type !== 'image/gif'
      ? compressImageFile(file).catch(function () { if (file.size > lim.imageMb * 1024 * 1024) throw new Error('الصورة كبيرة. الحد ' + arNum(lim.imageMb) + ' ميقابايت.'); return file; })
      : Promise.resolve(file);
    ready.then(function (blob) { return DiwaniyaServerKernel.uploadMedia(blob); }).then(function (d) {
      if (STATE.qEditor !== e) return;
      e.busy[slot] = false;
      if (!d || !d.ok || !d.url) showToast((d && d.error) || 'تعذر رفع الملف.');
      else { e[slot] = { t: d.kind || kind, u: d.url }; showToast('✅ انرفع الملف'); }
      renderQEditorModal();
    }).catch(function (err) { e.busy[slot] = false; renderQEditorModal(); showToast(err.message || 'تعذر رفع الملف.'); });
  }
  // Record a voice clip straight into the question or answer media.
  var QREC = { mr: null };
  function qeStartRecording(slot) {
    var e = STATE.qEditor;

    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (stream) {
      var type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); }) || '';
      var mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      var chunks = [];
      QREC.mr = mr; QREC.cancel = false;
      mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        QREC.mr = null;
        if (STATE.qEditor !== e) return;
        e.recording = null;
        if (QREC.cancel || !chunks.length) { renderQEditorModal(); return; }
        var blob = new Blob(chunks, { type: (mr.mimeType || 'audio/webm').split(';')[0] });
        e.busy[slot] = true; renderQEditorModal();
        DiwaniyaServerKernel.uploadMedia(blob).then(function (d) {
          if (STATE.qEditor !== e) return;

          else { e[slot] = { t: 'audio', u: d.url }; showToast('✅ انحفظ تسجيلك'); }
          renderQEditorModal();
        });
      };
      mr.start();
      e.recording = slot; renderQEditorModal();
    }).catch(function () { showToast('اسمح للموقع يستخدم المايك من إعدادات المتصفح.'); });
  }
  function qeStopRecording(cancel) {

  function qeSave() {

  function voSave(line, part, blob) {
    STATE.voBusy = { line: line, part: part }; render();

      if (!d || !d.ok) { STATE.voBusy = null; render(); showToast((d && d.error) || 'تعذر رفع التسجيل.'); return; }

      setTimeout(function () { if (STATE.voBusy) { STATE.voBusy = null; render(); } }, 15000);

  function voStartRecording(line, part) {
    if (!navigator.mediaDevices || !window.MediaRecorder) { showToast('جهازك ما يدعم التسجيل من المتصفح. استخدم «⬆️ ارفع».'); return; }
    if (VO.rec) voStopRecording(true);
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (stream) {
      var type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); }) || '';
      var mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      VO.rec = mr; VO.stream = stream; VO.chunks = []; VO.target = { line: line, part: part };
      mr.ondataavailable = function (e) { if (e.data && e.data.size) VO.chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var t = VO.target, chunks = VO.chunks, cancel = VO.cancel;
        VO.rec = null; VO.stream = null; VO.cancel = false; STATE.voRec = null;
        if (cancel || !chunks.length) { render(); return; }
        var blob = new Blob(chunks, { type: (mr.mimeType || 'audio/webm').split(';')[0] });
        voSave(t.line, t.part, blob);
      };
      mr.start();
      STATE.voRec = { line: line, part: part }; render();
      showToast('🔴 يسجّل الحين… قل الجملة وبعدها «وقّف واحفظ».');
    }).catch(function () { showToast('اسمح للموقع يستخدم المايك من إعدادات المتصفح، أو استخدم «⬆️ ارفع».'); });

  function voPlay(steps) {
    var n = 0;
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    var next = function () {
      if (n >= steps.length) return;
      var st = steps[n++];
      if (st.url) { var a = new Audio(st.url); a.onended = next; a.onerror = next; var pr = a.play(); if (pr && pr.catch) pr.catch(next); }
      else if (st.say && window.speechSynthesis) { var u = new SpeechSynthesisUtterance(st.say); u.lang = 'ar-SA'; u.onend = u.onerror = next; window.speechSynthesis.speak(u); }
      else next();
    };
    next();
  }

  // Price per credit of the smallest package is the reference for "you save".
  function renderPriceCards() {
    var pkgs = STATE.packages.filter(function (p) { return p.is_active; }).sort(function (a, b) { return a.sort_order - b.sort_order; });
    if (!pkgs.length) return '';
    var ref = pkgs.slice().sort(function (a, b) { return a.credits - b.credits; })[0];
    var refPer = ref.price_halalas / ref.credits;
    var gateway = DiwaniyaServerKernel.loadDB().gatewayConnected;
    return '<div class="price-grid">' + pkgs.map(function (p) {
      var full = Math.round(refPer * p.credits);
      var save = full > p.price_halalas ? Math.round((1 - p.price_halalas / full) * 100) : 0;
      var per = sarText(Math.round(p.price_halalas / p.credits));
      var hl = !!p.highlight;
      var promoOff = STATE.promoApplied ? Math.max(0, Math.min(STATE.promoApplied.amount, p.price_halalas - 100)) : 0;
      var btn = !gateway
        ? '<button class="dw-btn dw-btn-sec" disabled>🔒 قريباً</button>'
        : (!STATE.user
          ? '<button class="dw-btn ' + (hl ? 'dw-btn-gold' : 'dw-btn-sec') + '" data-act="open-auth">اشترِ الآن</button>'
          : '<button class="dw-btn ' + (hl ? 'dw-btn-gold' : 'dw-btn-sec') + '" data-act="buy-pkg" data-id="' + esc(p.id) + '"' + (STATE.checkoutInFlight ? ' disabled' : '') + '>💳 اشترِ الآن</button>');
      return '<div class="price-card' + (hl ? ' hl' : '') + '">' +
        (p.badge ? '<span class="pc-badge">' + esc(p.badge) + '</span>' : '') +
        '<div class="pc-name">' + esc(p.name) + '</div>' +
        '<div class="pc-credits">' + arNum(p.credits) + '<small>' + (p.credits === 1 ? 'قيم' : 'أقيام') + '</small></div>' +
        (promoOff
          ? '<div class="pc-price"><b>' + arNum(sarText(p.price_halalas - promoOff)) + ' <small>ر.س</small></b><s>' + arNum(sarText(p.price_halalas)) + '</s></div><span class="pc-save promo">🎁 بعد خصم الكود</span>'
          : '<div class="pc-price"><b>' + arNum(sarText(p.price_halalas)) + ' <small>ر.س</small></b>' + (save ? '<s>' + arNum(sarText(full)) + '</s>' : '') + '</div>') +

  // Store room: one shared buzzer + answers for any game. The server (BuzzerRoomDO) owns the state;
  // this client only sends actions and renders the snapshots it receives.
  var ROOM_SYNC = {
    ws: null,
    retry: 0,
    timer: null,
    wanted: false,
    creating: false,
    init: function () {
      var self = this;
      if (STATE.room.code) { self.connect(); return; }
      if (STATE.room.mobileControllerMode) return; // guest without a code: nothing to do
      if (!STATE.user) {
        STATE.room.wsStatus = 'needs_login';
        renderRoomModal();
        return;
      }
      var saved = null;
      try { saved = window.sessionStorage.getItem('dw_host_room_code'); } catch (e) {}
      if (saved) { STATE.room.code = saved; self.connect(); return; }
      if (self.creating) return;
      self.creating = true;
      STATE.room.wsStatus = 'creating';
      renderRoomModal();
      DiwaniyaServerKernel.createRoom(STATE.activeGameSlug || STATE.room.gameSlug || '').then(function (d) {
        self.creating = false;
        if (!d.ok) { STATE.room.wsStatus = 'error'; showToast(d.error || 'تعذر إنشاء الغرفة.'); renderRoomModal(); return; }
        STATE.room.code = d.code;
        try { window.sessionStorage.setItem('dw_host_room_code', d.code); } catch (e) {}
        self.connect();
      });
    },
    connect: function () {
      var self = this;
      self.wanted = true;
      if (self.ws && (self.ws.readyState === 0 || self.ws.readyState === 1)) return;
      var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/rooms/buzz/' + encodeURIComponent(STATE.room.code) + '/ws';
      var ws;
      try { ws = new WebSocket(url); } catch (e) { self.later(); return; }
      self.ws = ws;
      STATE.room.wsStatus = 'reconnecting';
      ws.onopen = function () {
        self.retry = 0;
        STATE.room.wsStatus = 'connected_cloud';
        var tok = null;
        try { tok = window.localStorage.getItem('dw_buzz_token_' + STATE.room.code); } catch (e) {}
        if (tok) self.send({ t: 'resume', token: tok });
        self.ping = setInterval(function () { self.send({ t: 'ping' }); }, 25000);
        renderRoomModal();
      };
      ws.onmessage = function (ev) {
        var m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'hello') {
          STATE.room.isHost = !!m.host;
        } else if (m.t === 'state' && m.room) {
          STATE.room.players = m.room.players || [];
          STATE.room.buzzerOrder = m.room.buzzerOrder || [];
          STATE.room.buzzerLockedBy = m.room.buzzerLockedBy || null;
          STATE.room.currentPrompt = m.room.currentPrompt || '';
          STATE.room.gameSlug = m.room.gameSlug || STATE.room.gameSlug;
          var first = STATE.room.buzzerLockedBy;
          if (first && first.timestampMs !== self.lastFirst) { self.lastFirst = first.timestampMs; STORE_AUDIO.playSfx(840); }
        } else if (m.t === 'me') {
          STATE.room.myPlayerId = m.id;
          STATE.room.myResumeToken = m.token;
          try { window.localStorage.setItem('dw_buzz_token_' + STATE.room.code, m.token); } catch (e) {}
        } else if (m.t === 'kicked' || m.t === 'left') {
          STATE.room.myPlayerId = '';
          try { window.localStorage.removeItem('dw_buzz_token_' + STATE.room.code); } catch (e) {}
          showToast(m.t === 'kicked' ? 'أخرجك المضيف من الغرفة.' : 'طلعت من الغرفة.');

          if (m.err === 'bad_token') { try { window.localStorage.removeItem('dw_buzz_token_' + STATE.room.code); } catch (e) {} }
          else showToast(m.err);
        }
        renderRoomModal();
      };
      ws.onclose = function () {
        clearInterval(self.ping);
        if (self.ws === ws) self.ws = null;
        STATE.room.wsStatus = 'reconnecting';
        renderRoomModal();
        self.later();
      };
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
    },
    later: function () {
      var self = this;
      if (!self.wanted) return;
      clearTimeout(self.timer);
      var wait = Math.min(1000 * Math.pow(2, self.retry++), 10000);
      self.timer = setTimeout(function () {
        // A room that no longer exists stops the retries.
        fetch('/api/rooms/status?code=' + encodeURIComponent(STATE.room.code)).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.exists) self.connect();
          else {
            self.wanted = false;
            STATE.room.wsStatus = 'gone';
            try { window.sessionStorage.removeItem('dw_host_room_code'); } catch (e) {}
            renderRoomModal();
          }
        }).catch(function () { self.later(); });
      }, wait);
    },
    send: function (o) {
      if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; }
      showToast('الاتصال بالغرفة مقطوع، جاري إعادة الاتصال…');
      return false;
    },
    newRoom: function () {
      this.wanted = false;
      if (this.ws) { try { this.ws.close(); } catch (e) {} }
      try { window.sessionStorage.removeItem('dw_host_room_code'); } catch (e) {}

  // ============================================================================

  var __LAST_LAUNCH_CLICK = { slug: '', ts: 0, idemKey: '' };

  // A free trial only counts once the game really starts: a start button pressed inside it,
  // or the game kept open for 4 minutes. Closing it before that keeps the trial for later.
  var START_RE = /ابدأ|ابدا|إبدأ|بدء|يلا نبدأ|يلا نلعب|ابدئي|start/i;
  // Paid games work the same way: closed before starting = the credits come back.
  var TRIAL_WATCH = {
    slug: null, timer: null, paidKey: null,
    arm: function (slug, paidKey) {
      this.disarm(); this.slug = slug; this.paidKey = paidKey || null;
      // Eight takes longer to set up (choosing 8 categories), so it waits longer before counting as started.
      if (slug) { var self = this; this.timer = setTimeout(function () { self.confirm(); }, (slug === 'eight' ? 15 : 4) * 60 * 1000); }
    },
    disarm: function () { if (this.timer) clearTimeout(this.timer); this.timer = null; this.slug = null; this.paidKey = null; },
    closedEarly: function () {
      var key = this.paidKey; this.disarm();
      if (!key) return;
      DiwaniyaServerKernel.cancelLaunch(key).then(function (d) {
        if (d && d.refunded) { showToast('↩️ ما بدأت اللعب، فرجعنا لك ' + arNum(d.refunded) + ' ' + (d.refunded === 1 ? 'قيم' : 'أقيام')); DiwaniyaServerKernel.refreshMe().then(function () { render(); }); }
      });
    },
    confirm: function () {
      var slug = this.slug; if (!slug) return; this.disarm();
      DiwaniyaServerKernel.trialStarted(slug).then(function () { return DiwaniyaServerKernel.refreshMe(); }).then(function () { render(); });
    }
  };
  function watchTrialStart(iframe) {
    try {
      var doc = iframe.contentDocument; if (!doc || doc.__dwTrialWatch) return; doc.__dwTrialWatch = true;
      doc.addEventListener('click', function (e) {
        if (!TRIAL_WATCH.slug) return;
        var b = e.target && e.target.closest && e.target.closest('button, [role="button"], a');
        if (b && START_RE.test((b.innerText || b.textContent || '') + ' ' + (b.id || ''))) TRIAL_WATCH.confirm();
      }, true);
    } catch (e) {}
  }
  function launchGameWithCreditCheck(slug, explicitIdemKey) {
    if (!slug) return Promise.resolve({ ok: false, reason: 'missing_slug' });
    if (STATE.launchInFlight) {
      return Promise.resolve({ ok: false, reason: 'launch_in_flight_locked' });
    }
    if (!STATE.user) {
      showToast('سجّل دخولك أول عشان تجرّب اللعبة مجاناً.');
      var authMod = document.getElementById('dwAuthModal');
      if (authMod) authMod.classList.add('open');
      return Promise.resolve({ ok: false, status: 401, reason: 'not_authenticated' });
    }

    var now = Date.now();
    // If rapid click within 1500ms on same game, reuse the exact same Idempotency-Key so server deduplicates
    var idemKey = explicitIdemKey;
    if (!idemKey) {
      if (__LAST_LAUNCH_CLICK.slug === slug && (now - __LAST_LAUNCH_CLICK.ts) < 1500 && __LAST_LAUNCH_CLICK.idemKey) {
        idemKey = __LAST_LAUNCH_CLICK.idemKey;
      } else {
        idemKey = 'idem_' + STATE.user.id + '_' + slug + '_' + now;
        __LAST_LAUNCH_CLICK = { slug: slug, ts: now, idemKey: idemKey };
      }
    }

    STATE.launchInFlight = true;
    render();
    return DiwaniyaServerKernel.launchGame(slug, idemKey).then(function (res) {
      STATE.launchInFlight = false;
      if (!res.ok) {
        showToast(res.error || 'تعذر تشغيل اللعبة.');
        if (res.code === 'INSUFFICIENT_CREDITS') {
          STATE.tab = 'packages';
        }
        if (res.status === 401) document.getElementById('dwAuthModal').classList.add('open');
        render();
        return res;
      }

      STATE.activeGameSlug = slug;
      STATE.room.gameSlug = slug;
      STATE.guideSlug = null;
      render();

      if (!res.deduplicated) {
        showToast(res.isFree ? '🆓 لعبة مجانية — استمتع!' : res.isFreeTrial
          ? '🎁 تجربتك المجانية — استمتع!'
          : '✅ انخصم ' + arNum(res.costDeducted) + ' قيم — وإذا قفلت قبل ما تبدأ ترجع لك');
      }

      var frameWrap = document.getElementById('dwGameFrameWrap');
      var frameTitle = document.getElementById('dwGameFrameTitle');
      var iframe = document.getElementById('dwGameIframe');
      if (frameWrap && iframe) {
        frameTitle.textContent = cleanTitle(res.gameTitle);
        iframe.onload = function () { syncGameRoleToFrame(); syncAudioButtonsUI(); watchTrialStart(iframe); };
        TRIAL_WATCH.arm(!res.deduplicated && (res.isFreeTrial || res.costDeducted > 0) ? slug : null, res.costDeducted > 0 ? idemKey : null);
        iframe.removeAttribute('srcdoc');
        iframe.src = res.playUrl;
        frameWrap.classList.add('open');
        document.documentElement.classList.add('dw-game-open');
        var tEl = document.getElementById('dwToast'); if (tEl) tEl.classList.add('in-game');
        var fsBtn = document.getElementById('dwFrameFsBtn');
        if (fsBtn) fsBtn.style.display = (document.fullscreenEnabled || document.webkitFullscreenEnabled) ? '' : 'none';
        syncFrameDemoButton();
      }
      return res;
    });
  }

  document.addEventListener('click', function (e) {
    var raw = e.target;
    var base = raw && raw.nodeType === 1 ? raw : (raw && raw.parentElement ? raw.parentElement : null);
    if (!base || !base.closest) return;

    var navBtn = base.closest('[data-nav]');
    if (navBtn) {
      e.preventDefault();
      var targetTab = navBtn.getAttribute('data-nav');

        showToast('🚫 غير مصرح لك بالدخول إلى لوحة الإدارة.');
        return;

      var tabChanged = STATE.tab !== targetTab;
      STATE.tab = targetTab;
      render();
      if (tabChanged || navBtn.closest('.site-foot')) window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var admTabBtn = base.closest('[data-adm-tab]');
    if (admTabBtn) {
      STATE.adminSubTab = admTabBtn.getAttribute('data-adm-tab');
      render();
      return;
    }

    var actBtn = base.closest('[data-act]');
    if (!actBtn) return;
    var act = actBtn.getAttribute('data-act');

    if (act === 'launch-game' || act === 'launch-from-guide') {
      launchGameWithCreditCheck(actBtn.getAttribute('data-slug'));
    } else if (act === 'game-filter') {
      STATE.gameFilter = actBtn.getAttribute('data-f') || 'all';
      render();
    } else if (act === 'show-all-games') {
      STATE.showAllGames = true;
      render();
    } else if (act === 'csug-open') {
      STATE.catSugOpen = true;
      render();
    } else if (act === 'csug-close') {
      STATE.catSugOpen = false;
      render();
    } else if (act === 'csug-new-q') {
      var cnt = { 200: 0, 400: 0, 600: 0 };
      (STATE.catSug ? STATE.catSug.qs : []).forEach(function (x) { cnt[x.points >= 600 ? 600 : x.points >= 400 ? 400 : 200]++; });
      openQEditor({ mode: 'suggest', allowVideo: true, points: cnt[200] < 2 ? 200 : cnt[400] < 2 ? 400 : cnt[600] < 2 ? 600 : 400 });
    } else if (act === 'csug-edit-q') {

      });
    } else if (act === 'adm-toggle-cat') {
      adminCall('toggle_cat', { catId: actBtn.getAttribute('data-id') }, function (tgCatRes) {
        render();
        showToast(tgCatRes.message);
      });
    }
  });

  // Esc or a click on the dark backdrop closes any open window.
  function closeAllModals() {
    STATE.guideSlug = null;
    STATE.previewCatSlug = null;
    document.querySelectorAll('.dw-modal-backdrop.open').forEach(function (m) { m.classList.remove('open'); });
    renderGuideModal();
    renderCategoryPreviewModal();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.querySelector('.dw-modal-backdrop.open')) closeAllModals();
  });
  document.addEventListener('mousedown', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('dw-modal-backdrop')) closeAllModals();
  });

  // Keeps the category-suggestion draft in memory so re-renders never lose what was typed.
  function syncCatSugField(t) {
    var f = t.getAttribute('data-csug');
    if (!f || !STATE.catSug) return;
    var qi = t.getAttribute('data-qi');
    if (qi === null) STATE.catSug[f] = t.value;
    else if (STATE.catSug.qs[Number(qi)]) STATE.catSug.qs[Number(qi)][f] = f === 'points' ? Number(t.value) : t.value;
  }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.hasAttribute) return;
    if (t.id === 'anSearch') {
      var q = t.value.trim().toLowerCase();
      document.querySelectorAll('[data-an-q]').forEach(function (tr) { tr.style.display = !q || tr.getAttribute('data-an-q').indexOf(q) !== -1 ? '' : 'none'; });
      return;
    }
    if (t.hasAttribute('data-csug')) syncCatSugField(t);
    if (t.hasAttribute('data-qe') && STATE.qEditor) STATE.qEditor[t.getAttribute('data-qe')] = t.value;
    if (t.id === 'admCatSearch') {
      STATE.admCatSearch = t.value;
      var pos = t.selectionStart;
      render();
      var again = document.getElementById('admCatSearch');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (er) {} }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.hasAttribute && t.hasAttribute('data-csug')) { syncCatSugField(t); return; }
    if (t.hasAttribute && t.hasAttribute('data-upload-target')) { handleImagePick(t); return; }
    if (t.hasAttribute && t.hasAttribute('data-vo-file')) {
      var vf = t.files && t.files[0], vk = t.getAttribute('data-vo-file').split('|');
      if (vf) {
        var vtype = vf.type || (/\.m4a$/i.test(vf.name) ? 'audio/mp4' : /\.mp3$/i.test(vf.name) ? 'audio/mpeg' : /\.ogg|\.opus$/i.test(vf.name) ? 'audio/ogg' : /\.wav$/i.test(vf.name) ? 'audio/wav' : 'audio/mp4');
        voSave(vk[0], Number(vk[1]), vf.type ? vf : new File([vf], vf.name, { type: vtype }));
      }
      t.value = ''; return;
    }
    if (t.hasAttribute && t.hasAttribute('data-qe-file')) { qeUpload(t.getAttribute('data-qe-file'), t.files && t.files[0]); t.value = ''; return; }
    if (t.id === 'edGameSelect') {
      STATE.editorGameId = t.value;
      STATE.editingItemId = null;
      render();
    } else if (t.id === 'edCatSelect') {
      STATE.editorCatSlug = t.value;
      STATE.editingItemId = null;
      render();
    } else if (t.id === 'admImportJsonInp' && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed)) { showToast('ملف JSON يجب أن يحتوي على مصفوفة أسئلة.'); return; }
          adminCall('import_content', {
            gameId: STATE.editorGameId,
            catSlug: STATE.editorCatSlug,
            items: parsed
          }, function (impRes) {
            render();
            showToast(impRes.message);
          });
        } catch (err) {
          showToast('خطأ في قراءة ملف JSON.');
        }
      };
      reader.readAsText(t.files[0]);
    } else if (t.hasAttribute('data-act-change-cost')) {
      var gid = t.getAttribute('data-act-change-cost');
      adminCall('update_game_cost', {
        gameId: gid,
        costCredits: t.value
      }, function (upRes) {
        render();
        showToast(upRes.message);
      });
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'dwCatSearchInp') {
      STATE.catSearch = t.value;
      render();
      var inp = document.getElementById('dwCatSearchInp');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    } else if (t.id === 'edSearchInp') {
      STATE.editorSearch = t.value;
      render();
      var inp2 = document.getElementById('edSearchInp');
      if (inp2) { inp2.focus(); inp2.setSelectionRange(inp2.value.length, inp2.value.length); }
    }
  });

  var RETURN_PARAMS = (function () {
    try {
      var q = new URLSearchParams(window.location.search);
      if (!q.get('payment') && !q.get('tab')) return null;
      var info = { tab: q.get('tab'), payment: q.get('payment'), order: q.get('order') };
      q.delete('payment'); q.delete('order'); q.delete('tab');
      var rest = q.toString();
      window.history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : ''));
      return info;
    } catch (e) { return null; }
  })();
  if (RETURN_PARAMS && ['store', 'packages', 'wallet', 'categories'].indexOf(RETURN_PARAMS.tab) !== -1) STATE.tab = RETURN_PARAMS.tab;

  function announcePaymentResult(status) {
    if (status === 'paid') showToast('🎉 تم الدفع بنجاح وانضافت الأقيام لمحفظتك!');
    else if (status === 'pending') showToast('⏳ لم يكتمل الدفع بعد. إذا دفعت، بتنضاف الأقيام خلال لحظات.');
    else if (status === 'failed' || status === 'expired' || status === 'canceled') showToast('❌ لم تتم عملية الدفع، وما انخصم منك شي.');
  }

  // Bridge for /app-install.js (install guide + install reward).
  window.DwApp = {
    toast: function (m) { showToast(m); },
    user: function () { return STATE.user; },
    claimInstall: function (platform) { return DiwaniyaServerKernel.claimAppInstall(platform); },
    setPromo: function (info) { STATE.appPromo = info; render(); },
    rewardSar: function () { return STATE.appPromo ? STATE.appPromo.amount_halalas / 100 : 2; },
    goPackages: function (code) { STATE.tab = 'packages'; STATE.promoInput = code || ''; render(); window.scrollTo(0, 0); if (code) applyPromo(code); },
    openLogin: function () { document.getElementById('dwAuthModal').classList.add('open'); },
    onChange: function () { render(); }
  };
  function afterSignIn() {
    activityPing();
    if (window.DwInstall) window.DwInstall.checkReward();
    else window.addEventListener('load', function () { if (window.DwInstall) window.DwInstall.checkReward(); });
    if (STATE.user && !(window.DwInstall && window.DwInstall.standalone())) {
      DiwaniyaServerKernel.myPromo().then(function (d) { if (d && d.ok && d.installed && !d.used && d.active) { STATE.appPromo = d; render(); } });
    }
  }

  function activityPing() {
    if (STATE.user && document.visibilityState === 'visible') DiwaniyaServerKernel.ping();
  }
  setInterval(activityPing, 60000);
  document.addEventListener('visibilitychange', activityPing);

  render();
  DiwaniyaServerKernel.refreshAll().then(function () {
    STATE.catalogLoaded = true;
    render();
    afterSignIn();
    if (RETURN_PARAMS && RETURN_PARAMS.payment && RETURN_PARAMS.order && STATE.user) {
      DiwaniyaServerKernel.paymentStatus(RETURN_PARAMS.order).then(function (d) {
        render();
        announcePaymentResult(d.ok && d.order ? d.order.status : RETURN_PARAMS.payment);
      });
    }
  });
})();

</script>
